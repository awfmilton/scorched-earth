          gridWrapper.style.overflowY = 'auto';
          gridWrapper.style.marginBottom = '15px';
          gridWrapper.style.paddingRight = '5px';

          const grid = document.createElement('div');

        draw() {
          if (this.headless) return;
          const ctx = this.ctx;
          if (!ctx) return;

          const dpr = window.devicePixelRatio || 1;
          // Reset transform to identity (device pixels) to clear the entire canvas
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

          // Restore dpr transform
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          // Get CSS width and height of canvas
          const cssWidth = this.canvas.width / dpr;
          const cssHeight = this.canvas.height / dpr;

          // Draw the terrain scaled to fit the CSS bounds of the canvas
          ctx.save();
          ctx.scale(cssWidth / CONST.WORLD_W, cssHeight / CONST.WORLD_H);
          this.terrain.draw(ctx);

          // Draw tanks
          if (this.roster) {
            this.roster.forEach((tank, idx) => {
              if (tank.hp <= 0) return;

              ctx.fillStyle = tank.color;
              ctx.strokeStyle = tank.color;

              // Hull
              ctx.fillRect(tank.x - 8, tank.y - 6, 16, 6);

              // Dome
              ctx.beginPath();
              ctx.arc(tank.x, tank.y - 6, 4, Math.PI, 0);
              ctx.fill();

              // Barrel
              const angleRad = (tank.angle * Math.PI) / 180;
              const barrelLen = 12;
              const bx = tank.x + barrelLen * detCos(angleRad);
              const by = tank.y - 6 - barrelLen * detSin(angleRad);

              ctx.beginPath();
              ctx.moveTo(tank.x, tank.y - 6);
              ctx.lineTo(bx, by);
              ctx.lineWidth = 2;
              ctx.stroke();

              // Active player indicator (small triangle pointing down)
              if (idx === this.activePlayerIdx) {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(tank.x - 4, tank.y - 20);
                ctx.lineTo(tank.x + 4, tank.y - 20);
                ctx.lineTo(tank.x, tank.y - 14);
                ctx.closePath();
                ctx.fill();
              }
            });
          }

          // Draw active projectiles
          if (this.projectiles && this.projectiles.length > 0) {
            this.projectiles.forEach(p => {
              ctx.fillStyle = '#ffffff';
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.weapon && p.weapon.includes('Particle') ? 1.5 : 3, 0, Math.PI * 2);
              ctx.fill();
            });
          }

          // Draw persistent tracers
          if (this.persistentTracers && this.persistentTracers.length > 0) {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([2, 4]); // Dotted!
            this.persistentTracers.forEach(path => {
              if (path && path.length > 1) {
                ctx.beginPath();
                ctx.moveTo(path[0].x, path[0].y);
                for (let i = 1; i < path.length; i++) {
                  ctx.lineTo(path[i].x, path[i].y);
                }
                ctx.stroke();
              }
            });
            ctx.restore();
          }

          // Draw active shields
          if (this.roster) {
            this.roster.forEach(tank => {
              if (tank.hp > 0 && tank.shield && tank.shield.hp > 0) {
                ctx.save();
                const shieldConf = SHIELD_TYPES[tank.shield.type];
                ctx.strokeStyle = shieldConf ? shieldConf.colour : 'rgba(0, 255, 0, 0.5)';
                // A deflector reads as a thicker arc, so you can tell at a
                // glance whether the next shell will bounce or be absorbed.
                ctx.lineWidth = shieldDeflects(tank.shield.type) ? 4 : 3;
                ctx.beginPath();
                ctx.arc(tank.x, tank.y - 6, 12, Math.PI, 0);
                ctx.stroke();
                ctx.restore();
              }
            });
          }

          // Draw guidance computer predicted landing marker
          if (this.roster && this.activePlayerIdx !== undefined) {
            const activeTank = this.roster[this.activePlayerIdx];
            if (activeTank && activeTank.hp > 0 && activeTank.inventory && activeTank.inventory['Guidance Computer'] > 0) {
              // Run simple fast simulation
              const angleRad = (activeTank.angle * Math.PI) / 180;
              const barrelLen = 12;
              let px = activeTank.x + barrelLen * detCos(angleRad);
              let py = activeTank.y - 6 - barrelLen * detSin(angleRad);
              let pvx = activeTank.power * detCos(angleRad);
              let pvy = -activeTank.power * detSin(angleRad);
              const sim_dt = 1/30;
              let hitX = px;
              let hitY = py;

              for (let step = 0; step < 200; step++) {
                pvy += this.gravity * sim_dt;
                pvx += (this.wind || 0) * sim_dt;
                px += pvx * sim_dt;
                py += pvy * sim_dt;

                if (px < 0 || px > CONST.WORLD_W || py > CONST.WORLD_H) {
                  hitX = px;
                  hitY = py;
                  break;
                }

                const tx = Math.floor(px);
                if (tx >= 0 && tx < CONST.WORLD_W) {
                  const gy = CONST.WORLD_H - this.terrain.heightAt(px);
                  if (py >= gy) {
                    hitX = px;
                    hitY = gy;
                    break;
                  }
                }
              }

              // Draw Predicted Marker as a red crosshair
              ctx.save();
              ctx.strokeStyle = '#ff0000';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(hitX - 6, hitY);
              ctx.lineTo(hitX + 6, hitY);
              ctx.moveTo(hitX, hitY - 6);
              ctx.lineTo(hitX, hitY + 6);
              ctx.stroke();
              ctx.restore();
            }
          }

          // Draw particles
          this.drawParticles(ctx);

          // Draw explosions
          this.drawExplosions(ctx);

          ctx.restore();
        }
      }

      function createHeadlessGame(opts = {}) {
        return new Game({ headless: true, seed: opts.seed });
      }

      // Loop variables
      let lastTime = 0;
      let accumulator = 0;
      let gameInstance = null;

      function loop(time) {
        if (!lastTime) lastTime = time;
        let dt = (time - lastTime) / 1000;
        lastTime = time;

        if (dt > 0.25) dt = 0.25;

        accumulator += dt;
        while (accumulator >= CONST.TICK) {
          if (gameInstance) {
            gameInstance.update(CONST.TICK);
          }
          accumulator -= CONST.TICK;
        }

        if (gameInstance) {
          gameInstance.draw();
        }

        requestAnimationFrame(loop);
      }

      // The four AI profiles implemented in Game.checkAIShot(). `type` is what
      // the roster carries and what checkAIShot() branches on, so these strings
      // must match those branches exactly.
      const AI_PROFILES = [
        { type: 'Moron', label: 'MORON — random spray' },
        { type: 'Shooter', label: 'SHOOTER — solves ballistics, ignores wind' },
        { type: 'Poolshark', label: 'POOLSHARK — banks shots off walls' },
        { type: 'Cyborg', label: 'CYBORG — wind-corrected, learns from misses' }
      ];

      const RETRO_COLORS = [
        { value: '#ff00ff', name: 'Magenta' },
        { value: '#00ffff', name: 'Cyan' },
        { value: '#ff2222', name: 'Red' },
        { value: '#22ff22', name: 'Green' },
        { value: '#ffff00', name: 'Yellow' },
        { value: '#2222ff', name: 'Blue' },
        { value: '#ff8800', name: 'Orange' },
        { value: '#ffffff', name: 'White' }
      ];

      const net = new NetClient();
      let myPlayerToken = null;
      let mySlot = -1;

      // Names and colours arrive over the wire from other players. The server
      // validates them, but this is the sink that actually executes, so it
      // escapes too: one hardened layer is a single point of failure.
      // Gravity comes from a <select>, and a missing or empty control must not
      // reach the simulation as NaN: `vy += NaN * dt` freezes every shell in
      // mid-air, the turn never resolves and the match reads as a hard freeze
      // rather than a bad setting. Every other setup control already falls back
      // to a default; this one does too.
      function readGravity(el) {
        const parsed = el ? parseInt(el.value, 10) : NaN;
        return Number.isFinite(parsed) ? parsed : CONST.GRAVITY;
      }

      function escapeHtml(value) {
        return String(value === undefined || value === null ? '' : value)
          .replace(/&/g, '&amp;')
          .replace(/</g, '&lt;')
          .replace(/>/g, '&gt;')
          .replace(/"/g, '&quot;')
          .replace(/'/g, '&#39;');
      }

      // A colour is interpolated into a style="..." attribute, where escaping
      // alone is not enough — CSS has its own injection surface. Only palette
      // values are allowed through; anything else falls back to white.
      const PALETTE_VALUES = new Set(RETRO_COLORS.map(c => c.value));
      function safeColour(value) {
        return PALETTE_VALUES.has(value) ? value : '#ffffff';
      }

      function renderLobbySlots(roomState) {
        if (typeof document === 'undefined') return;
        const container = document.getElementById('multiplayer-slots');
        if (!container) return;

        container.innerHTML = '';

        for (let i = 0; i < 4; i++) {
          const player = roomState.players.find(p => p.slot === i);
          const isMe = player && player.slot === mySlot;
          const isHost = roomState.hostSlot === i;

          const row = document.createElement('div');
          row.className = 'player-row';
          row.style.borderColor = player ? player.colour : '#333';
          row.style.opacity = (player && !player.connected) ? '0.5' : '1';

          if (player) {
            if (isMe) {
              const colorOptionsHtml = RETRO_COLORS.map(c =>
                `<option value="${c.value}" ${c.value === player.colour ? 'selected' : ''} style="color: ${safeColour(c.value)}; background: #000;">${escapeHtml(c.name)}</option>`
              ).join('');

              row.innerHTML = `
                <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; color: ${safeColour(player.colour)};">
                  <span>PLAYER ${i + 1} (YOU) ${isHost ? '👑' : ''}</span>
                  ${!player.connected ? '<span style="color: red;">DISCONNECTED</span>' : ''}
                </div>
                <div class="form-group">
                  <label>Name:</label>
                  <input type="text" class="player-name" value="${escapeHtml(player.name)}" maxlength="16">
                </div>
                <div class="form-group">
                  <label>Color:</label>
                  <select class="player-color" style="color: ${safeColour(player.colour)}; font-weight: bold;">
                    ${colorOptionsHtml}
                  </select>
                </div>
              `;

              const nameInput = row.querySelector('.player-name');
              const colorSelect = row.querySelector('.player-color');

              const updateProfile = () => {
                net.send('SET_PROFILE', { name: nameInput.value, colour: colorSelect.value });
              };

              nameInput.addEventListener('change', updateProfile);
              colorSelect.addEventListener('change', updateProfile);

            } else {
              row.innerHTML = `
                <div style="display: flex; justify-content: space-between; font-weight: bold; margin-bottom: 8px; color: ${safeColour(player.colour)};">
                  <span>PLAYER ${i + 1} ${isHost ? '👑' : ''}</span>
                  ${!player.connected ? '<span style="color: red;">DISCONNECTED</span>' : ''}
                </div>
                <div style="font-size: 18px;">${escapeHtml(player.name)}</div>
              `;
            }
          } else {
            row.innerHTML = `
              <div style="font-weight: bold; color: #555;">SLOT ${i + 1}</div>
              <div style="color: #555; font-style: italic;">Waiting for player...</div>
            `;
          }

          container.appendChild(row);
        }
      }

      if (typeof document !== 'undefined') {
        document.addEventListener('DOMContentLoaded', () => {
          if (document.getElementById('game')) {
            gameInstance = new Game({ headless: false });
            globalThis.SCORCHED.gameInstance = gameInstance;
            if (typeof requestAnimationFrame !== 'undefined') {
              requestAnimationFrame(loop);
            }

            net.connect();

            // Fetch rooms occasionally when the client is on the landing page
            setInterval(() => {
              if (!landingView.hidden && net.state === 'live') {
                net.send('LIST_ROOMS');
              }
            }, 5000);

            const landingView = document.getElementById('landing-view');
            const lobbyView = document.getElementById('lobby-view');
            const btnCreate = document.getElementById('btn-create-match');
            const btnCreatePublic = document.getElementById('btn-create-public');
            const btnJoin = document.getElementById('btn-join-match');
            const btnRefreshRooms = document.getElementById('btn-refresh-rooms');
            const roomListDiv = document.getElementById('room-list');
            const joinCodeInput = document.getElementById('join-code');
            const errorMsg = document.getElementById('error-msg');
            const startBtn = document.getElementById('start-btn');
            const hostSettings = document.getElementById('host-settings');
            const clientWaiting = document.getElementById('client-waiting');
            const displayShareCode = document.getElementById('display-share-code');

            // --- Solo play vs AI -------------------------------------------------
            // Local mode: no socket, no lockstep, no server round-trip. This is the
            // only entry point that reaches Game.checkAIShot(), the local shop
            // intermission and the multi-round loop, all of which were previously
            // unreachable code.
            const soloView = document.getElementById('solo-view');
            const btnPlaySolo = document.getElementById('btn-play-solo');
            const btnStartSolo = document.getElementById('btn-start-solo');
            const btnSoloBack = document.getElementById('btn-solo-back');
            const soloAiCount = document.getElementById('solo-ai-count');
            const soloAiList = document.getElementById('solo-ai-list');

            function renderSoloAiList() {
              if (!soloAiList) return;
              const count = soloAiCount ? (parseInt(soloAiCount.value, 10) || 2) : 2;
              soloAiList.innerHTML = '';
              for (let i = 0; i < count; i++) {
                const row = document.createElement('div');
                row.className = 'form-group';
                row.style.display = 'flex';
                row.style.alignItems = 'center';
                row.style.gap = '10px';
                row.style.marginBottom = '6px';

                const swatch = document.createElement('span');
                // Slot 0 is the human, so AI i takes colour i+1.
                swatch.textContent = '■';
                swatch.style.color = RETRO_COLORS[(i + 1) % RETRO_COLORS.length].value;

                const label = document.createElement('label');
                label.textContent = 'CPU ' + (i + 1);
                label.style.minWidth = '60px';
                label.setAttribute('for', 'solo-ai-' + i);

                const select = document.createElement('select');
                select.id = 'solo-ai-' + i;
                select.style.flex = '1';
                AI_PROFILES.forEach((profile) => {
                  const opt = document.createElement('option');
                  opt.value = profile.type;
                  opt.textContent = profile.label;
                  select.appendChild(opt);
                });
                // Spread the default difficulty so a fresh solo game is not four
                // identical opponents: Shooter, Poolshark, Cyborg, Moron, Shooter...
                const defaults = ['Shooter', 'Poolshark', 'Cyborg', 'Moron'];
                select.value = defaults[i % defaults.length];

                row.appendChild(swatch);
                row.appendChild(label);
                row.appendChild(select);
                soloAiList.appendChild(row);
              }
            }

            if (btnPlaySolo) {
              btnPlaySolo.addEventListener('click', () => {
                if (errorMsg) errorMsg.textContent = '';
                if (landingView) landingView.hidden = true;
                if (lobbyView) lobbyView.hidden = true;
                if (soloView) soloView.hidden = false;
                renderSoloAiList();
              });
            }

            if (btnSoloBack) {
              btnSoloBack.addEventListener('click', () => {
                if (soloView) soloView.hidden = true;
                if (landingView) landingView.hidden = false;
              });
            }

            if (soloAiCount) {
              soloAiCount.addEventListener('change', renderSoloAiList);
            }

            if (btnStartSolo) {
              btnStartSolo.addEventListener('click', () => {
                if (errorMsg) errorMsg.textContent = '';
                const nameEl = document.getElementById('solo-name');
                const humanName = (nameEl && nameEl.value.trim()) || 'PLAYER';
                const count = soloAiCount ? (parseInt(soloAiCount.value, 10) || 2) : 2;

                const players = [{
                  name: humanName.toUpperCase().slice(0, 12),
                  type: 'Human',
                  color: RETRO_COLORS[0].value,
                  slot: 0
                }];
                for (let i = 0; i < count; i++) {
                  const sel = document.getElementById('solo-ai-' + i);
                  const type = (sel && sel.value) || 'Shooter';
                  players.push({
                    name: 'CPU ' + (i + 1) + ' (' + type.toUpperCase() + ')',
                    type,
                    color: RETRO_COLORS[(i + 1) % RETRO_COLORS.length].value,
                    slot: i + 1
                  });
                }

                const readInt = (id, fallback, lo, hi) => {
                  const el = document.getElementById(id);
                  const raw = el ? parseInt(el.value, 10) : NaN;
                  const val = Number.isFinite(raw) ? raw : fallback;
                  return Math.max(lo, Math.min(hi, val));
                };
                const wallEl = document.getElementById('solo-wall-type');
                const weaponsEl = document.getElementById('solo-weapons');
                const gravityEl = document.getElementById('solo-gravity');
                const windEl = document.getElementById('solo-wind');
                const terrainStyleEl = document.getElementById('solo-terrain-style');
                const terrainHillsEl = document.getElementById('solo-terrain-hills');
                const terrainFlatnessEl = document.getElementById('solo-terrain-flatness');

                if (soloView) soloView.hidden = true;

                // Local play needs a fresh world per match but has no peer to
                // agree with, so the wall-clock seed is safe here. Networked
                // play still takes its seed from the server's ROUND_START.
                gameInstance.start({
                  players,
                  rounds: readInt('solo-rounds', 5, 1, 20),
                  startingCash: readInt('solo-cash', 10000, 0, 1000000),
                  wallType: (wallEl && wallEl.value) || 'off',
                  weaponsAvailability: (weaponsEl && weaponsEl.value) || 'all',
                  gravity: readGravity(gravityEl),
                  windVariability: (windEl && windEl.value) || 'changing-per-round',
                  terrainStyle: (terrainStyleEl && terrainStyleEl.value) || 'random',
                  hillCount: (terrainHillsEl && terrainHillsEl.value) || 'normal',
                  flatness: (terrainFlatnessEl && terrainFlatnessEl.value) || 'normal',
                  seed: (Date.now() >>> 0)
                });
              });
            }
            // --- end solo play ---------------------------------------------------

            net.onError((err) => {
              if (errorMsg) errorMsg.textContent = formatNetError(err);
            });

            net.register('ROOM_LIST', (msg) => {
              roomListDiv.innerHTML = '';
              if (!msg.rooms || msg.rooms.length === 0) {
                roomListDiv.innerHTML = '<div style="text-align: center; color: #777;">No public matches found.</div>';
                return;
              }
              msg.rooms.forEach(r => {
                const row = document.createElement('div');
                row.style.cssText = 'display: flex; justify-content: space-between; align-items: center; padding: 5px; border-bottom: 1px dashed #333; margin-bottom: 5px;';
                
                const info = document.createElement('div');
                info.innerHTML = `<strong>${escapeHtml(r.hostName)}'s Game</strong><br><span style="font-size: 12px; color: #aaa;">Players: ${escapeHtml(r.players)}/${escapeHtml(r.maxPlayers)}</span>`;
                
                const joinBtn = document.createElement('button');
                joinBtn.textContent = 'JOIN';
                joinBtn.style.cssText = 'padding: 5px 15px; background: #0088ff; color: #fff; border: none; cursor: pointer;';
                joinBtn.onclick = () => {
                  errorMsg.textContent = '';
                  net.send('JOIN_ROOM', { code: r.code });
                  hostSettings.hidden = true;
                  startBtn.hidden = true;
                  clientWaiting.hidden = false;
                };
                
                row.appendChild(info);
                row.appendChild(joinBtn);
                roomListDiv.appendChild(row);
              });
            });

            net.register('ROOM_STATE', (msg) => {
              if (errorMsg) errorMsg.textContent = '';
              landingView.hidden = true;
              lobbyView.hidden = false;
              
              displayShareCode.textContent = msg.code;

              if (msg.playerToken) {
                myPlayerToken = msg.playerToken;
                // Save to sessionStorage so we can rejoin after refresh
                sessionStorage.setItem('scorched_session', JSON.stringify({ code: msg.code, playerToken: msg.playerToken }));
              }
              
              if (msg.yourSlot !== undefined) {
                mySlot = msg.yourSlot;
              }
              // Figure out our slot based on playerToken (since the server only tells us our token)
              // Actually, wait, the server doesn't broadcast playerTokens in ROOM_STATE to everyone.
              // We need to know which slot we are. The host is msg.hostSlot.
              // If we just got the reply, we might not know our slot until ROUND_START which has `yourSlot`.
              // For lobby, we can guess our slot by the fact we just joined, but wait...
              // If we don't know our slot, we can't show "(YOU)". Let's just track the first player that matches our connection ID? No, connection ID is internal.
              // Workaround: We'll just rely on the server giving us `yourSlot` later, but in lobby we just allow editing if we match?
              // Let's modify NetClient `getSessionToken()` to use sessionStorage:
              const saved = JSON.parse(sessionStorage.getItem('scorched_session') || '{}');
              if (saved && saved.playerToken) {
                 // Wait, we still don't know our slot from `ROOM_STATE`. We'll just show the players for now.
                 // Actually, wait! The user who just created it is the host (hostSlot). 
                 // We will update the HTML above to just render them, and if we are host, show START.
                 // We'll fix mySlot correctly later if needed. For now, let's just let anyone edit their own name by assuming if we created the room we are hostSlot.
              }

              if (mySlot === msg.hostSlot) {
                hostSettings.hidden = false;
                startBtn.hidden = false;
                clientWaiting.hidden = true;
              } else {
                hostSettings.hidden = true;
                startBtn.hidden = true;
                clientWaiting.hidden = false;
              }

              // Just render players
              renderLobbySlots(msg);

              // Wait, who is host?
              // Since we don't know our exact slot in `ROOM_STATE` easily, let's just show START button if we clicked CREATE.
            });

            net.register('ROUND_START', (msg) => {
               document.getElementById('setup').hidden = true;
               mySlot = msg.yourSlot; // Now we know it!

               // Round 2+ is a new round of the SAME match. Re-running start()
               // would rebuild the roster and reset every player's cash and
               // inventory to the starting values, silently undoing the shop.
               if (Number.isFinite(msg.round) && msg.round > 1 && gameInstance.roster) {
                 gameInstance.applyServerRoundStart(msg);
                 return;
               }

               // Initialize game
               const config = msg.config || { rounds: 5, startingCash: 10000, wallType: 'off', weaponsAvailability: 'all' };
               // We need to map `msg.tanks` to `config.players` for the Game class.
               config.players = msg.tanks.map(t => ({
                 name: t.name,
                 type: 'Human', // All multiplayer players are Human or Network
                 color: t.colour,
                 slot: t.slot
               }));
               config.isMultiplayer = true;
               config.mySlot = mySlot;
               config.seed = msg.seed;
               config.wind = msg.wind;
               config.turnOrder = msg.turnOrder;
               // The server clamps the round count; its value wins over
               // whatever the lobby form happened to post.
               if (Number.isFinite(msg.totalRounds)) config.rounds = msg.totalRounds;
               // Hand the Game the lobby's live socket so it can send FIRE and
               // RESOLVE_SHOT. Without this `this.net` is null and the client
               // simulates in silence.
               config.net = net;

               gameInstance.start(config);
            });

            btnCreate.addEventListener('click', () => {
              errorMsg.textContent = '';
              net.send('CREATE_ROOM', { isPublic: false });
              hostSettings.hidden = false;
              startBtn.hidden = false;
              clientWaiting.hidden = true;
            });

            btnCreatePublic.addEventListener('click', () => {
              errorMsg.textContent = '';
              net.send('CREATE_ROOM', { isPublic: true });
              hostSettings.hidden = false;
              startBtn.hidden = false;
              clientWaiting.hidden = true;
            });

            btnRefreshRooms.addEventListener('click', () => {
              net.send('LIST_ROOMS');
            });

            btnJoin.addEventListener('click', () => {
              const code = joinCodeInput.value.trim().toUpperCase();
              if (code.length === 4) {
                errorMsg.textContent = '';
                net.send('JOIN_ROOM', { code });
                hostSettings.hidden = true;
                startBtn.hidden = true;
                clientWaiting.hidden = false;
              } else {
                errorMsg.textContent = 'Invalid share code';
              }
            });

            startBtn.addEventListener('click', () => {
              errorMsg.textContent = '';
              const rounds = Math.max(1, Math.min(20, parseInt(document.getElementById('rounds').value, 10) || 5));
              const startingCash = Math.max(0, parseInt(document.getElementById('starting-cash').value, 10) || 10000);
              const wallType = document.getElementById('wall-type').value;
              const weaponRadio = document.querySelector('input[name="weapon-availability"]:checked');
              const weaponsAvailability = weaponRadio ? weaponRadio.value : 'all';
              const gravityEl = document.getElementById('gravity');
              const windEl = document.getElementById('wind');
              const terrainStyleEl = document.getElementById('terrain-style');
              const terrainHillsEl = document.getElementById('terrain-hills');
              const terrainFlatnessEl = document.getElementById('terrain-flatness');

              net.send('START_GAME', {
                config: {
                  rounds,
                  startingCash,
                  wallType,
                  weaponsAvailability,
                  gravity: readGravity(gravityEl),
                  windVariability: (windEl && windEl.value) || 'changing-per-round',
                  terrainStyle: (terrainStyleEl && terrainStyleEl.value) || 'random',
                  hillCount: (terrainHillsEl && terrainHillsEl.value) || 'normal',
                  flatness: (terrainFlatnessEl && terrainFlatnessEl.value) || 'normal'
                }
              });
            });

            // Overwrite NetClient's getSessionToken
            net.getSessionToken = function() {
               try {
                 const data = sessionStorage.getItem('scorched_session');
                 return data ? JSON.parse(data) : null;
               } catch (e) { return null; }
            };
          }
        });
      }

      // Expose services
      globalThis.SCORCHED = {
        Game,
        rng,
        CONST,
        createHeadlessGame,
        Terrain,
        WEAPONS,
        ITEMS,
        SHIELD_TYPES,
        SHIELD_PRIORITY,
        PROXIMITY_FUSE_RADIUS,
        BASIC_WEAPON_IDS,
        NetClient,
        detSin,
        detCos,
        detTan
      };
    })();
  </script>
</body>
</html>
