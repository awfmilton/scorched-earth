            this.roster.forEach(tank => {
              tank.cumulativeKills = (tank.cumulativeKills || 0) + (tank.kills || 0);
              tank.cumulativeDamage = (tank.cumulativeDamage || 0) + (tank.damageDealt || 0);

              const damagePayout = Math.floor(tank.damageDealt || 0);
              const killPayout = (tank.kills || 0) * 500;
              const survivalBonus = tank.hp > 0 ? (100 * this.currentRound) : 0;

              tank.cash += damagePayout + killPayout + survivalBonus;

              // Reset round-level stats
              tank.damageDealt = 0;
              tank.kills = 0;
            });
          }

          // 2. Check if this was the final round
          if (this.currentRound >= this.rounds) {
            if (!this.headless) {
              this.showMatchSummary();
            }
          } else {
            if (this.headless) {
              // In headless mode, automatically advance to next round
              this.roster.forEach(player => {
                if (player.type !== 'Human') {
                  this.handleAIPurchases(player);
                }
              });
              this.startNextRound();
            } else {
              // In browser, start shop intermission for the first player
              this.startShopIntermission();
            }
          }
        }

        startNextRound() {
          this.currentRound++;
          this.roundOver = false;

          // Generate fresh terrain and wind for the new round
          this.newRound(this.seed + this.currentRound);

          // Restore tanks to full hp, clear shields, reposition
          if (this.roster) {
            const N = this.roster.length;
            const zoneW = CONST.WORLD_W / N;
            const margin = 40;
            this.roster.forEach((tank, i) => {
              tank.hp = 100;
              tank.shield = null;

              // Fresh random position within player zone
              const minX = zoneW * i + margin;
              const maxX = zoneW * (i + 1) - margin;
              tank.x = rng.range(minX, maxX);
            });
            this.snapTanksToTerrain();
          }

          this.activePlayerIdx = 0;
          this.projectile = null;
          this.raiseShieldForActivePlayer();

          if (!this.headless) {
            const shopEl = document.getElementById('shop');
            if (shopEl) {
              shopEl.hidden = true;
            }
            this.updateHUD();
          }
        }

        buy(tank, id) {
          const weapon = WEAPONS.find(w => w.id === id);
          const item = ITEMS.find(i => i.id === id);
          const config = weapon || item;
          if (!config) return false;

          if (tank.cash < config.cost) {
            return false;
          }

          tank.cash -= config.cost;
          if (!tank.inventory) {
            tank.inventory = {};
          }
          if (tank.inventory[id] === undefined) {
            tank.inventory[id] = 0;
          }
          tank.inventory[id] += config.packSize;

          if (!this.headless) {
            sfx('buy');
          }
          return true;
        }

        handleAIPurchases(player) {
          if (player.type === 'Cyborg') {
            const isBasicOnly = this.config && this.config.weaponsAvailability === 'basic';
            const BASIC_WEAPONS = ['Baby Missile', 'Missile', 'Tracer'];
            const availableWeapons = WEAPONS.filter(w => {
              if (isBasicOnly) {
                return BASIC_WEAPONS.includes(w.id);
              }
              return true;
            });
            // Sort by damage descending
            const sortedWeapons = [...availableWeapons].sort((a, b) => b.damage - a.damage);
            const bestWeapon = sortedWeapons.find(w => player.cash >= w.cost);
            if (bestWeapon) {
              this.buy(player, bestWeapon.id);
            }
          }
        }

        startShopIntermission() {
          this.shoppingPlayerIdx = 0;
          this.showShopForPlayer(this.shoppingPlayerIdx);

        showMatchSummary() {

            const bKills = b.cumulativeKills || 0;
            if (bKills !== aKills) {
              return bKills - aKills;
            }
            return b.cash - a.cash;
          });

          const container = document.createElement('div');
          container.className = 'summary-container';
          container.style.background = '#181818';
          container.style.border = '3px double #00ff00';

          // Restart Game button

          restartBtn.style.border = 'none';
          restartBtn.style.cursor = 'pointer';
          restartBtn.style.transition = 'background 0.2s';

          restartBtn.addEventListener('click', () => {
            // Hide shop
            shopEl.hidden = true;
            // Show setup modal
            const setupEl = document.getElementById('setup');
            if (setupEl) setupEl.hidden = false;
          });

          container.appendChild(restartBtn);
          shopEl.appendChild(container);
        }

        draw() {
          if (this.headless) return;
          const ctx = this.ctx;
          if (!ctx) return;

          const dpr = window.devicePixelRatio || 1;
          // Reset transform to identity (device pixels) to clear the entire canvas
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

          // Restore dpr transform
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          // Get CSS width and height of canvas
          const cssWidth = this.canvas.width / dpr;
          const cssHeight = this.canvas.height / dpr;

          // Draw the terrain scaled to fit the CSS bounds of the canvas
          ctx.save();
          ctx.scale(cssWidth / CONST.WORLD_W, cssHeight / CONST.WORLD_H);
          this.terrain.draw(ctx);

          // Draw tanks
          if (this.roster) {
            this.roster.forEach((tank, idx) => {
              if (tank.hp <= 0) return;

              ctx.fillStyle = tank.color;
              ctx.strokeStyle = tank.color;

              // Hull
              ctx.fillRect(tank.x - 8, tank.y - 6, 16, 6);

              // Dome
              ctx.beginPath();
              ctx.arc(tank.x, tank.y - 6, 4, Math.PI, 0);
              ctx.fill();

              // Barrel
              const angleRad = (tank.angle * Math.PI) / 180;
              const barrelLen = 12;
              const bx = tank.x + barrelLen * Math.cos(angleRad);
              const by = tank.y - 6 - barrelLen * Math.sin(angleRad);

              ctx.beginPath();
              ctx.moveTo(tank.x, tank.y - 6);
              ctx.lineTo(bx, by);
              ctx.lineWidth = 2;
              ctx.stroke();

              // Active player indicator (small triangle pointing down)
              if (idx === this.activePlayerIdx) {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(tank.x - 4, tank.y - 20);
                ctx.lineTo(tank.x + 4, tank.y - 20);
                ctx.lineTo(tank.x, tank.y - 14);
                ctx.closePath();
                ctx.fill();
              }
            });
          }

          // Draw active projectiles
          if (this.projectiles && this.projectiles.length > 0) {
            this.projectiles.forEach(p => {
              ctx.fillStyle = '#ffffff';
              ctx.beginPath();
              ctx.arc(p.x, p.y, p.weapon && p.weapon.includes('Particle') ? 1.5 : 3, 0, Math.PI * 2);
              ctx.fill();
            });
          }

          // Draw persistent tracers
          if (this.persistentTracers && this.persistentTracers.length > 0) {
            ctx.save();
            ctx.strokeStyle = 'rgba(255, 255, 255, 0.4)';
            ctx.lineWidth = 1.5;
            ctx.setLineDash([2, 4]); // Dotted!
            this.persistentTracers.forEach(path => {
              if (path && path.length > 1) {
                ctx.beginPath();
                ctx.moveTo(path[0].x, path[0].y);
                for (let i = 1; i < path.length; i++) {
                  ctx.lineTo(path[i].x, path[i].y);
                }
                ctx.stroke();
              }
            });
            ctx.restore();
          }

          // Draw active shields
          if (this.roster) {
            this.roster.forEach(tank => {
              if (tank.hp > 0 && tank.shield && tank.shield.hp > 0) {
                ctx.save();
                ctx.strokeStyle = tank.shield.type === 'Heavy Shield' ? 'rgba(0, 0, 255, 0.5)' : (tank.shield.type === 'Magnetic Shield' ? 'rgba(0, 255, 255, 0.5)' : 'rgba(0, 255, 0, 0.5)');
                ctx.lineWidth = 3;
                ctx.beginPath();
                ctx.arc(tank.x, tank.y - 6, 12, Math.PI, 0);
                ctx.stroke();
                ctx.restore();
              }
            });
          }

          // Draw guidance computer predicted landing marker
          if (this.roster && this.activePlayerIdx !== undefined) {
            const activeTank = this.roster[this.activePlayerIdx];
            if (activeTank && activeTank.hp > 0 && activeTank.inventory && activeTank.inventory['Guidance Computer'] > 0) {
              // Run simple fast simulation
              const angleRad = (activeTank.angle * Math.PI) / 180;
              const barrelLen = 12;
              let px = activeTank.x + barrelLen * Math.cos(angleRad);
              let py = activeTank.y - 6 - barrelLen * Math.sin(angleRad);
              let pvx = activeTank.power * Math.cos(angleRad);
              let pvy = -activeTank.power * Math.sin(angleRad);
              const sim_dt = 1/30;
              let hitX = px;
              let hitY = py;

              for (let step = 0; step < 200; step++) {
                pvy += CONST.GRAVITY * sim_dt;
                pvx += (this.wind || 0) * sim_dt;
                px += pvx * sim_dt;
                py += pvy * sim_dt;

                if (px < 0 || px > CONST.WORLD_W || py > CONST.WORLD_H) {
                  hitX = px;
                  hitY = py;
                  break;
                }

                const tx = Math.floor(px);
                if (tx >= 0 && tx < CONST.WORLD_W) {
                  const gy = CONST.WORLD_H - this.terrain.heightAt(px);
                  if (py >= gy) {
                    hitX = px;
                    hitY = gy;
                    break;
                  }
                }
              }

              // Draw Predicted Marker as a red crosshair
              ctx.save();
              ctx.strokeStyle = '#ff0000';
              ctx.lineWidth = 2;
              ctx.beginPath();
              ctx.moveTo(hitX - 6, hitY);
              ctx.lineTo(hitX + 6, hitY);
              ctx.moveTo(hitX, hitY - 6);
              ctx.lineTo(hitX, hitY + 6);
              ctx.stroke();
              ctx.restore();
            }
          }

          // Draw particles
          this.drawParticles(ctx);

          // Draw explosions
          this.drawExplosions(ctx);

          ctx.restore();
        }
      }

      function createHeadlessGame(opts = {}) {
        return new Game({ headless: true, seed: opts.seed });
      }

      // Loop variables
      let lastTime = 0;
      let accumulator = 0;
      let gameInstance = null;

      function loop(time) {
        if (!lastTime) lastTime = time;
        let dt = (time - lastTime) / 1000;
        lastTime = time;

        if (dt > 0.25) dt = 0.25;

        accumulator += dt;
        while (accumulator >= CONST.TICK) {
          if (gameInstance) {
            gameInstance.update(CONST.TICK);
          }
          accumulator -= CONST.TICK;
        }

        if (gameInstance) {
          gameInstance.draw();
        }

        requestAnimationFrame(loop);
      }

      const RETRO_COLORS = [
        { value: '#ff00ff', name: 'Magenta' },
        { value: '#00ffff', name: 'Cyan' },
        { value: '#ff2222', name: 'Red' },
        { value: '#22ff22', name: 'Green' },
        { value: '#ffff00', name: 'Yellow' },
        { value: '#2222ff', name: 'Blue' },
        { value: '#ff8800', name: 'Orange' },
        { value: '#ffffff', name: 'White' }
      ];

      function renderPlayerSlots(count) {
        if (typeof document === 'undefined') return;
        const container = document.getElementById('player-slots');
        if (!container) return;

        const previousValues = [];
        const rows = container.querySelectorAll('.player-row');
        rows.forEach((row) => {
          const nameInput = row.querySelector('.player-name');
          const typeSelect = row.querySelector('.player-type');
          const colorSelect = row.querySelector('.player-color');
          previousValues.push({
            name: nameInput ? nameInput.value : '',
            type: typeSelect ? typeSelect.value : '',
            color: colorSelect ? colorSelect.value : ''
          });
        });

        container.innerHTML = '';

        const defaultTypes = ['Human', 'Moron', 'Shooter', 'Poolshark', 'Cyborg'];

        for (let i = 0; i < count; i++) {
          const prev = previousValues[i] || {};
          const defaultName = prev.name || `Player ${i + 1}`;
          const defaultType = prev.type || (i === 0 ? 'Human' : defaultTypes[i % defaultTypes.length]);
          const defaultColor = prev.color || RETRO_COLORS[i % RETRO_COLORS.length].value;

          const row = document.createElement('div');
          row.className = 'player-row';
          row.dataset.index = i;

          const colorOptionsHtml = RETRO_COLORS.map(c =>
            `<option value="${c.value}" ${c.value === defaultColor ? 'selected' : ''} style="color: ${c.value}; background: #000;">${c.name}</option>`
          ).join('');

          row.innerHTML = `
            <div style="font-weight: bold; margin-bottom: 8px; color: #00ff00;">PLAYER ${i + 1}</div>
            <div class="form-group">
              <label>Name:</label>
              <input type="text" class="player-name" value="${defaultName}">
            </div>
            <div class="form-group">
              <label>Type:</label>
              <select class="player-type">
                <option value="Human" ${defaultType === 'Human' ? 'selected' : ''}>Human</option>
                <option value="Moron" ${defaultType === 'Moron' ? 'selected' : ''}>Moron</option>
                <option value="Shooter" ${defaultType === 'Shooter' ? 'selected' : ''}>Shooter</option>
                <option value="Poolshark" ${defaultType === 'Poolshark' ? 'selected' : ''}>Poolshark</option>
                <option value="Cyborg" ${defaultType === 'Cyborg' ? 'selected' : ''}>Cyborg</option>
              </select>
            </div>
            <div class="form-group">
              <label>Color:</label>
              <select class="player-color" style="color: ${defaultColor}; font-weight: bold;">
                ${colorOptionsHtml}
              </select>
            </div>
          `;

          const colorSelect = row.querySelector('.player-color');
          colorSelect.addEventListener('change', (e) => {
            colorSelect.style.color = e.target.value;
          });

          container.appendChild(row);
        }
      }

      if (typeof document !== 'undefined') {
        document.addEventListener('DOMContentLoaded', () => {
          if (document.getElementById('game')) {
            gameInstance = new Game({ headless: false });
            globalThis.SCORCHED.gameInstance = gameInstance;
            if (typeof requestAnimationFrame !== 'undefined') {
              requestAnimationFrame(loop);
            }

            // Setup setup screen handlers
            const playerCountSelect = document.getElementById('player-count');
            if (playerCountSelect) {
              renderPlayerSlots(parseInt(playerCountSelect.value, 10));
              playerCountSelect.addEventListener('change', (e) => {
                renderPlayerSlots(parseInt(e.target.value, 10));
              });
            }

            const startBtn = document.getElementById('start-btn');
            const errorMsg = document.getElementById('error-msg');
            if (startBtn) {
              startBtn.addEventListener('click', () => {
                if (errorMsg) errorMsg.textContent = '';

                // Gather players
                const players = [];
                const rows = document.querySelectorAll('#player-slots .player-row');
                const colors = new Set();
                let duplicateColor = false;

                rows.forEach((row, idx) => {
                  const nameInput = row.querySelector('.player-name');
                  const typeSelect = row.querySelector('.player-type');
                  const colorSelect = row.querySelector('.player-color');

                  const name = nameInput ? nameInput.value.trim() : `Player ${idx + 1}`;
                  const type = typeSelect ? typeSelect.value : 'Human';
                  const color = colorSelect ? colorSelect.value : '#ff00ff';

                  if (colors.has(color)) {
                    duplicateColor = true;
                  }
                  colors.add(color);

                  players.push({ name, type, color });
                });

                if (duplicateColor) {
                  if (errorMsg) {
                    errorMsg.textContent = 'Error: Two or more players cannot share the same tank color!';
                  }
                  return;
                }

                // Gather settings
                const roundsInput = document.getElementById('rounds');
                const rounds = roundsInput ? Math.max(1, Math.min(20, parseInt(roundsInput.value, 10) || 5)) : 5;

                const cashInput = document.getElementById('starting-cash');
                const startingCash = cashInput ? Math.max(0, parseInt(cashInput.value, 10) || 10000) : 10000;

                const wallSelect = document.getElementById('wall-type');
                const wallType = wallSelect ? wallSelect.value : 'off';

                const weaponRadio = document.querySelector('input[name="weapon-availability"]:checked');
                const weaponsAvailability = weaponRadio ? weaponRadio.value : 'all';

                const config = {
                  players,
                  rounds,
                  startingCash,
                  wallType,
                  weaponsAvailability
                };

                if (gameInstance) {
                  gameInstance.start(config);
                }
              });
            }
          }
        });
      }

      // Expose services
      globalThis.SCORCHED = {
        Game,
        rng,
        CONST,
        createHeadlessGame,
        Terrain,
        WEAPONS,
        ITEMS
      };
    })();
  </script>
</body>
</html>
