<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scorched Earth</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c0c0c;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    #hud {
      flex: 0 0 auto;
      height: 40px;
      background: #141414;
      border-bottom: 2px solid #333;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }
    #game {
      flex: 1 1 auto;
      display: block;
      width: 100%;
      height: calc(100% - 40px);
    }
  </style>
</head>
<body>
  <div id="hud"></div>
  <canvas id="game"></canvas>
  <div id="setup" hidden></div>
  <div id="shop" hidden></div>
  <script>
    (function() {
      'use strict';

      const CONST = {
        WORLD_W: 1200,
        WORLD_H: 700,
        GRAVITY: 260,
        TICK: 1/60
      };

      // Deterministic mulberry32 generator
      let state = 1;
      const rng = {
        seed(n) {
          state = n >>> 0;
        },
        next() {
          let t = (state += 0x6D2B79F5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        },
        range(a, b) {
          return a + (b - a) * this.next();
        },
        int(a, b) {
          return Math.floor(this.range(a, b));
        }
      };

      // Sizing function supporting zero-size layout and high DPI screens
      function resize() {
        if (typeof document === 'undefined' || typeof window === 'undefined') return;
        const canvas = document.getElementById('game');
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const width = rect.width || window.innerWidth || 0;
        const height = rect.height || (window.innerHeight - 40) || 0;
        if (width === 0 || height === 0) return;

        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;

        const ctx = canvas.getContext('2d');
        if (ctx) {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
      }

      // Lazily created AudioContext and mute controller
      let audioCtx = null;
      let masterGain = null;
      let isMuted = false;

      function initAudio() {
        if (audioCtx) return;
        const AudioContextClass = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
        if (!AudioContextClass) return;
        try {
          audioCtx = new AudioContextClass();
          masterGain = audioCtx.createGain();
          masterGain.gain.setValueAtTime(isMuted ? 0 : 1, audioCtx.currentTime);
          masterGain.connect(audioCtx.destination);
        } catch (e) {
          // Silent catch
        }
      }

      function sfx(name, opts = {}) {
        initAudio();
        if (!audioCtx || isMuted) return;

        if (audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }

        try {
          if (name === 'launch') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
          } else if (name === 'bounce') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.setValueAtTime(300, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
          } else if (name === 'explode') {
            try {
              const bufferSize = audioCtx.sampleRate * 0.5;
              const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
              const data = buffer.getChannelData(0);
              let nSeed = 12345;
              for (let i = 0; i < bufferSize; i++) {
                nSeed = (nSeed * 1664525 + 1013904223) | 0;
                const r = (nSeed >>> 0) / 4294967296;
                data[i] = (r * 2 - 1) * 0.2;
              }
              const noise = audioCtx.createBufferSource();
              noise.buffer = buffer;
              const filter = audioCtx.createBiquadFilter();
              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(800, audioCtx.currentTime);
              filter.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
              const gain = audioCtx.createGain();
              gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
              gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
              noise.connect(filter);
              filter.connect(gain);
              gain.connect(masterGain);
              noise.start();
              noise.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(100, audioCtx.currentTime);
              osc.frequency.linearRampToValueAtTime(10, audioCtx.currentTime + 0.5);
              gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
              gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
              osc.connect(gain);
              gain.connect(masterGain);
              osc.start();
              osc.stop(audioCtx.currentTime + 0.5);
            }
          } else if (name === 'buy') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
          }
        } catch (e) {
          // Silent catch
        }
      }

      if (typeof window !== 'undefined') {
        window.addEventListener('keydown', (e) => {
          if (e.key === 'm' || e.key === 'M') {
            isMuted = !isMuted;
            if (masterGain && audioCtx) {
              masterGain.gain.setValueAtTime(isMuted ? 0 : 1, audioCtx.currentTime);
            }
          }
        });
      }

      class Terrain {
        constructor() {
          this.heights = new Float32Array(CONST.WORLD_W);
        }

        generate(seed) {
          rng.seed(seed);
          const minH = CONST.WORLD_H * 0.15;
          const maxH = CONST.WORLD_H * 0.80;

          // Standard midpoint displacement for 1D
          const heights = this.heights;
          const N = heights.length;

          heights[0] = rng.range(minH + (maxH - minH) * 0.2, maxH - (maxH - minH) * 0.2);
          heights[N - 1] = rng.range(minH + (maxH - minH) * 0.2, maxH - (maxH - minH) * 0.2);

          // Roughness controls the initial displacement size
          let roughness = 0.35;

          function displace(left, right, r) {
            if (right - left <= 1) return;
            const mid = Math.floor((left + right) / 2);
            // Height is the average of endpoints + random offset proportional to interval length
            const avg = (heights[left] + heights[right]) / 2;
            const rangeVal = (right - left) * r;
            const offset = rng.range(-rangeVal, rangeVal);
            heights[mid] = avg + offset;

            displace(left, mid, r * 0.55);
            displace(mid, right, r * 0.55);
          }

          displace(0, N - 1, roughness);

          // Smoothing pass: 5-point moving average, run 4 times
          const temp = new Float32Array(N);
          for (let pass = 0; pass < 4; pass++) {
            for (let i = 0; i < N; i++) {
              let sum = 0;
              let count = 0;
              for (let di = -2; di <= 2; di++) {
                const idx = i + di;
                if (idx >= 0 && idx < N) {
                  sum += heights[idx];
                  count++;
                }
              }
              temp[i] = sum / count;
            }
            heights.set(temp);
          }

          // Clamp to safety range
          for (let i = 0; i < N; i++) {
            if (heights[i] < minH) heights[i] = minH;
            if (heights[i] > maxH) heights[i] = maxH;
          }
        }

        heightAt(x) {
          const N = this.heights.length;
          // Clamped lookup
          const cx = Math.max(0, Math.min(N - 1, x));
          const x0 = Math.floor(cx);
          const x1 = Math.min(N - 1, x0 + 1);
          const t = cx - x0;
          return this.heights[x0] * (1 - t) + this.heights[x1] * t;
        }

        carve(x, y, r) {
          const N = this.heights.length;
          const cy_height = CONST.WORLD_H - y;
          const startCol = Math.max(0, Math.floor(x - r));
          const endCol = Math.min(N - 1, Math.ceil(x + r));

          for (let col = startCol; col <= endCol; col++) {
            const dx = col - x;
            if (Math.abs(dx) < r) {
              const dy = Math.sqrt(r * r - dx * dx);
              const y1 = cy_height - dy;
              const y2 = cy_height + dy;
              if (this.heights[col] > y1) {
                const overlap = Math.min(this.heights[col], y2) - y1;
                if (overlap > 0) {
                  this.heights[col] -= overlap;
                }
              }
            }
          }
        }

        deposit(x, y, r) {
          const N = this.heights.length;
          const cy_height = CONST.WORLD_H - y;
          const startCol = Math.max(0, Math.floor(x - r));
          const endCol = Math.min(N - 1, Math.ceil(x + r));

          for (let col = startCol; col <= endCol; col++) {
            const dx = col - x;
            if (Math.abs(dx) < r) {
              const dy = Math.sqrt(r * r - dx * dx);
              const y1 = cy_height - dy;
              const y2 = cy_height + dy;
              const overlap = Math.max(0, y2 - Math.max(this.heights[col], y1));
              if (overlap > 0) {
                this.heights[col] += overlap;
              }
            }
          }
        }

        settle() {
          const N = this.heights.length;
          const max_slope = 1.0;
          // Perform multiple sliding passes to let soil flow down slopes
          for (let pass = 0; pass < 20; pass++) {
            let changed = false;
            for (let i = 0; i < N - 1; i++) {
              const diff = this.heights[i] - this.heights[i + 1];
              if (diff > max_slope) {
                const excess = diff - max_slope;
                const move = excess / 2;
                this.heights[i] -= move;
                this.heights[i + 1] += move;
                changed = true;
              } else if (diff < -max_slope) {
                const excess = -diff - max_slope;
                const move = excess / 2;
                this.heights[i] += move;
                this.heights[i + 1] -= move;
                changed = true;
              }
            }
            if (!changed) break;
          }

          // Finally, clamp every column back into range
          const minH = CONST.WORLD_H * 0.15;
          const maxH = CONST.WORLD_H * 0.80;
          for (let i = 0; i < N; i++) {
            if (this.heights[i] < minH) this.heights[i] = minH;
            if (this.heights[i] > maxH) this.heights[i] = maxH;
          }
        }

        draw(ctx) {
          if (!ctx) return;

          // Sky gradient
          const skyGrad = ctx.createLinearGradient(0, 0, 0, CONST.WORLD_H);
          skyGrad.addColorStop(0, '#020010');
          skyGrad.addColorStop(1, '#1b1b3a');
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, CONST.WORLD_W, CONST.WORLD_H);

          // Ground fill: darker body
          ctx.beginPath();
          ctx.moveTo(0, CONST.WORLD_H);
          for (let i = 0; i < this.heights.length; i++) {
            ctx.lineTo(i, CONST.WORLD_H - this.heights[i]);
          }
          ctx.lineTo(CONST.WORLD_W, CONST.WORLD_H);
          ctx.closePath();

          const groundGrad = ctx.createLinearGradient(0, CONST.WORLD_H * 0.15, 0, CONST.WORLD_H);
          groundGrad.addColorStop(0, '#5a3d28');
          groundGrad.addColorStop(1, '#1f140c');
          ctx.fillStyle = groundGrad;
          ctx.fill();

          // Ground surface line: lighter surface line
          ctx.beginPath();
          ctx.moveTo(0, CONST.WORLD_H - this.heights[0]);
          for (let i = 1; i < this.heights.length; i++) {
            ctx.lineTo(i, CONST.WORLD_H - this.heights[i]);
          }
          ctx.strokeStyle = '#2d8a2d';
          ctx.lineWidth = 3;
          ctx.stroke();
        }
      }

      class Game {
        constructor(opts = {}) {
          this.headless = !!opts.headless;
          this.seed = opts.seed !== undefined ? opts.seed : 42;
          this.roundState = {
            ticks: 0
          };

          this.terrain = new Terrain();
          this.newRound(this.seed);

          if (!this.headless) {
            this.canvas = document.getElementById('game');
            this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
            window.addEventListener('resize', () => resize());
            resize();
          }
        }

        newRound(roundSeed) {
          this.seed = roundSeed;
          this.terrain.generate(roundSeed);
        }

        stepPhysics(dt) {
          this.roundState.ticks++;
        }

        update(dt) {
          this.stepPhysics(dt);
        }

        draw() {
          if (this.headless) return;
          const ctx = this.ctx;
          if (!ctx) return;

          const dpr = window.devicePixelRatio || 1;
          // Reset transform to identity (device pixels) to clear the entire canvas
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

          // Restore dpr transform
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          // Get CSS width and height of canvas
          const cssWidth = this.canvas.width / dpr;
          const cssHeight = this.canvas.height / dpr;

          // Draw the terrain scaled to fit the CSS bounds of the canvas
          ctx.save();
          ctx.scale(cssWidth / CONST.WORLD_W, cssHeight / CONST.WORLD_H);
          this.terrain.draw(ctx);
          ctx.restore();
        }
      }

      function createHeadlessGame(opts = {}) {
        return new Game({ headless: true, seed: opts.seed });
      }

      // Loop variables
      let lastTime = 0;
      let accumulator = 0;
      let gameInstance = null;

      function loop(time) {
        if (!lastTime) lastTime = time;
        let dt = (time - lastTime) / 1000;
        lastTime = time;

        if (dt > 0.25) dt = 0.25;

        accumulator += dt;
        while (accumulator >= CONST.TICK) {
          if (gameInstance) {
            gameInstance.update(CONST.TICK);
          }
          accumulator -= CONST.TICK;
        }

        if (gameInstance) {
          gameInstance.draw();
        }

        requestAnimationFrame(loop);
      }

      if (typeof document !== 'undefined') {
        document.addEventListener('DOMContentLoaded', () => {
          if (document.getElementById('game')) {
            gameInstance = new Game({ headless: false });
            if (typeof requestAnimationFrame !== 'undefined') {
              requestAnimationFrame(loop);
            }
          }
        });
      }

      // Expose services
      globalThis.SCORCHED = {
        Game,
        rng,
        CONST,
        createHeadlessGame,
        Terrain
      };
    })();
  </script>
</body>
</html>
