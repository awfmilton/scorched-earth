          const weapon = activeTank.selectedWeapon || 'Baby Missile';
          const ammoVal = activeTank.inventory[weapon];
          const ammoStr = ammoVal === Infinity ? 'INF' : ammoVal;

          const windSpeed = Math.round(Math.abs(this.wind || 0));
          const windDir = (this.wind || 0) < 0 ? '←' : '→';

          // Inline styling using helper elements or just setting textContent in a safe and structured way
          // Let's create static sub-elements once or update textContent using an elegant formatting scheme.
          // To ensure we update textContent with inline styles only, never rebuilding innerHTML per frame:
          // We can construct text contents for specific parts, or structure hud cleanly.
          // Let's check how the instructions specify: "fill #hud with the active tank's name in its colour, hp, angle, power, selected weapon with remaining ammo, cash, wind as a direction arrow beside its speed value, plus a compact controls legend. updateHUD() writes textContent with inline styles only, never rebuilding innerHTML per frame, returning immediately when headless. Call it on every input, on every turn change."
          // Since we want inline styles (like text color), we can create sub elements in DOMContentLoaded or lazily if not present, and update their textContent. Let's do lazy creation of sub-span elements inside #hud if #hud is empty or has wrong children. This is extremely fast and avoids innerHTML rebuilds.

          let nameSpan = hud.querySelector('.hud-name');
          let hpSpan = hud.querySelector('.hud-hp');
          let angleSpan = hud.querySelector('.hud-angle');
          let powerSpan = hud.querySelector('.hud-power');
          let weaponSpan = hud.querySelector('.hud-weapon');
          let cashSpan = hud.querySelector('.hud-cash');
          let fuelSpan = hud.querySelector('.hud-fuel');
          let windSpan = hud.querySelector('.hud-wind');
          let netSpan = hud.querySelector('.hud-net');
          let legendSpan = hud.querySelector('.hud-legend');

          if (!nameSpan) {
            hud.innerHTML = ''; // Initial clear

            nameSpan = document.createElement('span');
            nameSpan.className = 'hud-name';
            nameSpan.style.fontWeight = 'bold';
            nameSpan.style.marginRight = '15px';

            hpSpan = document.createElement('span');
            hpSpan.className = 'hud-hp';
            hpSpan.style.marginRight = '15px';

            angleSpan = document.createElement('span');
            angleSpan.className = 'hud-angle';
            angleSpan.style.marginRight = '15px';

            powerSpan = document.createElement('span');
            powerSpan.className = 'hud-power';
            powerSpan.style.marginRight = '15px';

            weaponSpan = document.createElement('span');
            weaponSpan.className = 'hud-weapon';
            weaponSpan.style.marginRight = '15px';

            cashSpan = document.createElement('span');
            cashSpan.className = 'hud-cash';
            cashSpan.style.marginRight = '15px';

            fuelSpan = document.createElement('span');
            fuelSpan.className = 'hud-fuel';
            fuelSpan.style.marginRight = '15px';

            windSpan = document.createElement('span');
            windSpan.className = 'hud-wind';
            windSpan.style.marginRight = '15px';

            netSpan = document.createElement('span');
            netSpan.className = 'hud-net';
            netSpan.style.marginRight = '15px';
            netSpan.style.fontWeight = 'bold';

            legendSpan = document.createElement('span');
            legendSpan.className = 'hud-legend';
            legendSpan.style.color = '#888';
            legendSpan.style.fontSize = '12px';
            legendSpan.style.marginLeft = 'auto';

            hud.appendChild(nameSpan);
            hud.appendChild(hpSpan);
            hud.appendChild(angleSpan);
            hud.appendChild(powerSpan);
            hud.appendChild(weaponSpan);
            hud.appendChild(cashSpan);
            hud.appendChild(fuelSpan);
            hud.appendChild(windSpan);
            hud.appendChild(netSpan);
            hud.appendChild(legendSpan);
          } else if (legendSpan && (!netSpan || !fuelSpan)) {
            // Upgrade a HUD built by an earlier version rather than rebuilding
            // it, which would drop the spans this frame is about to write.
            const addBeforeLegend = (span) => {
              if (typeof hud.insertBefore === 'function') {
                hud.insertBefore(span, legendSpan);
              } else {
                hud.appendChild(span);
              }
            };
            if (!netSpan) {
              netSpan = document.createElement('span');
              netSpan.className = 'hud-net';
              netSpan.style.marginRight = '15px';
              netSpan.style.fontWeight = 'bold';
              addBeforeLegend(netSpan);
            }
            if (!fuelSpan) {
              fuelSpan = document.createElement('span');
              fuelSpan.className = 'hud-fuel';
              fuelSpan.style.marginRight = '15px';
              addBeforeLegend(fuelSpan);
            }
          }

          nameSpan.textContent = activeTank.name.toUpperCase();
          nameSpan.style.color = activeTank.color;

          hpSpan.textContent = `HP: ${activeTank.hp}`;
          angleSpan.textContent = `ANG: ${activeTank.angle}°`;
          powerSpan.textContent = `PWR: ${activeTank.power}`;
          // Read off TRIGGER_PRIORITY rather than a second list, so the HUD can
          // never advertise a trigger different from the one armTrigger() will
          // actually spend.
          const armed = TRIGGER_PRIORITY.find(t => (activeTank.inventory[t.item] || 0) > 0);
          weaponSpan.textContent = `WEAP: ${weapon} (${ammoStr})`
            + (armed ? ` [${armed.trigger === 'proximity' ? 'PROX' : 'CONTACT'}]` : '');
          cashSpan.textContent = `CASH: $${activeTank.cash}`;
          if (fuelSpan) {
            const fuel = activeTank.inventory['Fuel'] || 0;
            const teleports = activeTank.inventory['Teleport'] || 0;
            fuelSpan.textContent = `FUEL: ${fuel}` + (teleports > 0 ? ` TP: ${teleports}` : '');
            fuelSpan.style.color = fuel > 0 ? '#ffaa00' : '#555';
          }
          windSpan.textContent = `WIND: ${windDir} ${windSpeed}`;

          if (this.mode === 'online') {
            if (netSpan) {
              netSpan.style.display = '';
              let stateColor = '#ff0000';
              const netState = this.net ? this.net.state : 'lost';
              if (netState === 'live') stateColor = '#00ff00';
              else if (netState === 'connecting' || netState === 'reconnecting') stateColor = '#ffff00';
              netSpan.textContent = `NET: ${netState.toUpperCase()}`;
              netSpan.style.color = stateColor;
            }
          } else {
            if (netSpan) {
              netSpan.style.display = 'none';
            }
          }

          legendSpan.textContent = 'L/R: Angle | U/D: Power | A/D: Drive | T: Teleport | Space: Fire | [/]: Weapon | Shift: Coarse';
        }

        // Put a net error somewhere the player can actually read it. #error-msg
        // lives in the #setup modal, which start() hides — but a rejected join
        // (ROOM_FULL, UNKNOWN_ROOM) arrives while the modal is still open, so
        // that is the surface those errors need. Errors raised after start()
        // still land here and reach the console; there is no in-game banner to
        // route them to yet, and adding one belongs with the chunk that builds
        // the lobby UI rather than this dispatch-table swap.
        showNetError(err) {
          const text = formatNetError(err);
          console.warn('Net error:', text, err);
          if (this.headless || typeof document === 'undefined') return;
          const errorMsg = document.getElementById('error-msg');
          if (errorMsg) errorMsg.textContent = text;
        }

        start(config) {
          this.config = config;
          this.currentRound = 1;
          this.rounds = config.rounds !== undefined ? config.rounds : 5;
          this.wallType = config.wallType || 'off';
          this.startingCash = config.startingCash !== undefined ? config.startingCash : 10000;

          // Online setup must land BEFORE newRound(), because the seed decides
          // the terrain, the biome and every tank spawn position.
          if (config.isMultiplayer) {
            this.mode = 'online';
            this.mySlot = config.mySlot;
            this.turnOrder = Array.isArray(config.turnOrder) ? config.turnOrder.slice() : null;
            if (config.net) this.net = config.net;
          }

          // The server mints the seed and broadcasts it in ROUND_START. Using
          // the page-local default here instead is what made two clients build
          // two different worlds before a shot was even fired.
          if (config.seed !== undefined && Number.isFinite(config.seed)) {
            this.seed = config.seed;
          }

          // Begin round 1 (generates terrain and seeds RNG)
          this.newRound(this.seed);

          // newRound() draws wind from the shared stream; with a shared seed
          // that already agrees, but the server's value is the one echoed in
          // every FIRE_SYNC, so take it as authoritative when offered.
          if (config.wind !== undefined && Number.isFinite(config.wind)) {
            this.wind = config.wind;
          }

          // Build roster using the newly-seeded generator
          const players = config.players || [];
          const N = players.length;
          const zoneW = CONST.WORLD_W / N;
          const margin = 40;

          this.roster = players.map((p, i) => {
            const minX = zoneW * i + margin;
            const maxX = zoneW * (i + 1) - margin;
            const x = gameplayRNG.range(minX, maxX);
            return {
              name: p.name,
              color: p.color,
              type: p.type,
              // Server slot identity. Turn order, FIRE_SYNC routing and
              // elimination reports are all keyed on this, never on the
              // roster array index, which can differ from slot order.
              slot: Number.isInteger(p.slot) ? p.slot : i,
              connected: true,
              hp: 100,
              angle: 45,
              power: 500,
              cash: this.startingCash,
              inventory: { 'Baby Missile': Infinity, 'Fuel': CONST.FUEL_PER_ROUND },
              selectedWeapon: 'Baby Missile',
              shield: null,
              x: x,
              y: 0,
              damageDealt: 0,
              kills: 0
            };
          });

          this.snapTanksToTerrain();
          // Online, the first shooter is turnOrder[0] (a slot), not roster
          // index 0 — those differ whenever lobby churn leaves the roster in a
          // different order from the slot numbering, and every client keying
          // off index 0 means every client drives the same tank.
          this.activePlayerIdx = 0;
          if (this.mode === 'online' && this.turnOrder && this.turnOrder.length) {
            this.setActiveSlot(this.turnOrder[0]);
          }
          this.activeShotId = null;
          this.reportedShotId = null;
          this.projectile = null; // Will store active projectile { x, y, vx, vy, ... }
          this.raiseShieldForActivePlayer();

          if (!this.headless && typeof document !== 'undefined') {
            const setupEl = document.getElementById('setup');
            if (setupEl) {
              setupEl.hidden = true;
            }
            this.updateHUD();
          }
        }

        raiseShieldForActivePlayer() {
          if (!this.roster || this.activePlayerIdx === undefined) return;
          const activeTank = this.roster[this.activePlayerIdx];
          if (!activeTank || activeTank.hp <= 0) return;

          // Battery logic: "Battery restoring hp or recharging a raised shield."
          if (activeTank.inventory && activeTank.inventory['Battery'] > 0) {
            const cap = activeTank.shield ? shieldStrength(activeTank.shield.type) : 0;
            if (activeTank.shield && activeTank.shield.hp < cap) {
              activeTank.shield.hp = Math.min(cap, activeTank.shield.hp + 50);
              activeTank.inventory['Battery']--;
            } else if (activeTank.hp < 100) {
              activeTank.hp = Math.min(100, activeTank.hp + 30);
              activeTank.inventory['Battery']--;
            }
          }

          // Raise shield from inventory if none is active
          if (!activeTank.shield || activeTank.shield.hp <= 0) {
            activeTank.shield = null;
            this.raiseBestShield(activeTank);
          }
        }

        // Raises the strongest shield the tank owns and spends it. Shared by the
        // start-of-turn raise and Auto Defense, so the two can never disagree
        // about which shield is best.
        raiseBestShield(tank) {
          if (!tank || !tank.inventory) return null;
          for (const type of SHIELD_PRIORITY) {
            if (tank.inventory[type] > 0) {
              tank.shield = { type: type, hp: shieldStrength(type) };
              tank.inventory[type]--;
              return tank.shield;
            }
          }
          return null;
        }

        nextTurn() {
          if (!this.roster || this.roster.length === 0) return;

          // Online the turn cursor belongs to the server. Every call site that
          // means "this shot is over" reports the resolution and stops; the
          // active player then changes when TURN_SYNC comes back.
          if (this.mode === 'online') {
            this.reportShotResolved();
            return;
          }

          let nextIdx = this.activePlayerIdx;
          for (let i = 0; i < this.roster.length; i++) {
            nextIdx = (nextIdx + 1) % this.roster.length;
            if (this.roster[nextIdx].hp > 0) {
              this.activePlayerIdx = nextIdx;
              this.raiseShieldForActivePlayer();
              this.updateHUD();
              this.aiTimer = 0;
              return;
            }
          }
          this.updateHUD();
          this.aiTimer = 0;
        }

        checkAIShot() {
          if (!this.roster || this.activePlayerIdx === undefined) return;
          const activeTank = this.roster[this.activePlayerIdx];
          if (activeTank && activeTank.hp > 0 && activeTank.type !== 'Human' && !this.projectile) {
            // Find nearest living opponent
            let target = null;
            let minDist = Infinity;
            this.roster.forEach((tank, idx) => {
              if (idx !== this.activePlayerIdx && tank.hp > 0) {
                const dx = tank.x - activeTank.x;
                const dy = tank.y - activeTank.y;
                // Note: Math.sqrt is IEEE-754 correctly rounded across engines and is deliberately exempt
                const dist = Math.sqrt(dx * dx + dy * dy);
                if (dist < minDist) {
                  minDist = dist;
                  target = tank;
                }
              }
            });

            if (!target) return; // No targets available

            const isRight = target.x > activeTank.x;

            if (activeTank.type === 'Moron') {
              const baseAngle = isRight ? 45 : 135;
              const angle = baseAngle + gameplayRNG.range(-35, 35);
              const power = gameplayRNG.range(300, 700);
              activeTank.angle = Math.round(Math.min(180, Math.max(0, angle)));
              activeTank.power = Math.round(Math.min(1000, Math.max(0, power)));
            } else if (activeTank.type === 'Shooter') {
              const dx = target.x - activeTank.x;
              const dy = (target.y - 3) - (activeTank.y - 6);
              const startAngles = dx > 0 ? [60, 55, 65, 50, 70, 45, 75, 40, 80, 35, 85] : [120, 125, 115, 130, 110, 135, 105, 140, 100, 145, 95];
              let solvedAngle = null;
              let solvedPower = null;
              const g = this.gravity;

              for (let angle of startAngles) {
                const angleRad = (angle * Math.PI) / 180;
                const T = detTan(angleRad);
                const denom = dy + dx * T;
                if (denom > 0) {
                  const v2 = (g * dx * dx * (1 + T * T)) / (2 * denom);
                  if (v2 > 0) {
                    const v = Math.sqrt(v2);
                    if (v >= 200 && v <= 1000) {
                      solvedAngle = angle;
                      solvedPower = v;
                      break;
                    }
                  }
                }
              }

              if (solvedAngle === null) {
                solvedAngle = dx > 0 ? 45 : 135;
                solvedPower = 500;
              }

              activeTank.angle = Math.round(Math.min(180, Math.max(0, solvedAngle + gameplayRNG.range(-4, 4))));
              activeTank.power = Math.round(Math.min(1000, Math.max(0, solvedPower + gameplayRNG.range(-15, 15))));
            } else if (activeTank.type === 'Poolshark') {
              let dx = target.x - activeTank.x;
              const dy = (target.y - 3) - (activeTank.y - 6);
              if (this.wallType === 'rubber') {
                if (target.x > activeTank.x) {
                  dx = -target.x - activeTank.x;
                } else {
                  dx = (2 * CONST.WORLD_W - target.x) - activeTank.x;
                }
              }

              const shootRight = dx > 0;
              const startAngles = shootRight ? [60, 55, 65, 50, 70, 45, 75, 40, 80, 35, 85] : [120, 125, 115, 130, 110, 135, 105, 140, 100, 145, 95];
              let solvedAngle = null;
              let solvedPower = null;
              const g = this.gravity;

              for (let angle of startAngles) {
                const angleRad = (angle * Math.PI) / 180;
                const T = detTan(angleRad);
                const denom = dy + dx * T;
                if (denom > 0) {
                  const v2 = (g * dx * dx * (1 + T * T)) / (2 * denom);
                  if (v2 > 0) {
                    const v = Math.sqrt(v2);
                    if (v >= 200 && v <= 1000) {
                      solvedAngle = angle;
                      solvedPower = v;
                      break;
                    }
                  }
                }
              }

              if (solvedAngle === null) {
                solvedAngle = shootRight ? 45 : 135;
                solvedPower = 500;
              }

              activeTank.angle = Math.round(Math.min(180, Math.max(0, solvedAngle + gameplayRNG.range(-2, 2))));
              activeTank.power = Math.round(Math.min(1000, Math.max(0, solvedPower + gameplayRNG.range(-10, 10))));
            } else if (activeTank.type === 'Cyborg') {
              // Select the most damaging affordable weapon from inventory
              let bestWeaponId = 'Baby Missile';
              let maxDamage = 0;
              for (const weaponId in activeTank.inventory) {
                if (activeTank.inventory[weaponId] > 0) {
                  const wConf = WEAPONS.find(w => w.id === weaponId);
                  if (wConf && wConf.damage > maxDamage) {
                    maxDamage = wConf.damage;
                    bestWeaponId = weaponId;
                  }
                }
              }
              activeTank.selectedWeapon = bestWeaponId;

              // Apply telemetry correction
              let aimX = target.x;
              if (activeTank.telemetry && activeTank.telemetry[target.name]) {
                const tel = activeTank.telemetry[target.name];
                const errorX = tel.landX - tel.aimX;
                aimX = target.x - errorX;
              }
              activeTank.lastTargetName = target.name;
              activeTank.lastAimX = aimX;

              const dx = aimX - activeTank.x;
              const dy = (target.y - 3) - (activeTank.y - 6);
              const shootRight = dx > 0;
              const startAngles = shootRight ? [60, 55, 65, 50, 70, 45, 75, 40, 80, 35, 85] : [120, 125, 115, 130, 110, 135, 105, 140, 100, 145, 95];
              let solvedAngle = null;
              let solvedPower = null;
              const aw = this.wind || 0;
              const g = this.gravity;

              for (let angle of startAngles) {
                const angleRad = (angle * Math.PI) / 180;
                const T = detTan(angleRad);
                const denom = g + aw * T;
                const numer = dy + dx * T;
                if (denom > 0 && numer > 0) {
                  const t2 = (2 * numer) / denom;
                  if (t2 > 0) {
                    const t = Math.sqrt(t2);
                    const vx = dx / t - 0.5 * aw * t;
                    if ((shootRight && vx > 0) || (!shootRight && vx < 0)) {
                      const vy = -vx * T;
                      const v = Math.sqrt(vx * vx + vy * vy);
                      if (v >= 200 && v <= 1000) {
                        solvedAngle = angle;
                        solvedPower = v;
                        break;
                      }
                    }
                  }
                }
              }

              if (solvedAngle === null) {
                solvedAngle = shootRight ? 45 : 135;
                solvedPower = 500;
              }

              activeTank.angle = Math.round(solvedAngle);
              activeTank.power = Math.round(solvedPower);
            }

            this.fireActiveWeapon();
          }
        }

        // Auto Defense: when a shield collapses, immediately raise the best
        // replacement still in inventory. Called from every path that can drop a
        // shield to zero (blast damage, napalm burn, magnetic deflection).
        raiseAutoDefenseShield(tank) {
          if (!tank.inventory || !(tank.inventory['Auto Defense'] > 0)) return;
          this.raiseBestShield(tank);
        }

        // Spends and returns the trigger arming this shot, or null. A trigger
        // governs WHEN the shell first detonates, not what the explosion then
        // does: a Contact-triggered LeapFrog still hops afterwards, it just
        // does not roll, dig or tunnel before the first blast.
        armTrigger(tank) {
          if (!tank || !tank.inventory) return null;
          for (const t of TRIGGER_PRIORITY) {
            if (tank.inventory[t.item] > 0) {
              tank.inventory[t.item]--;
              return t.trigger;
            }
          }
          return null;
        }

        // Single entry point for damaging a tank. Every damage source must route
        // through here so shield absorption, Auto Defense and score accounting stay
        // consistent. Returns true if this hit is what killed the tank.
        applyDamageToTank(tank, amount, shooter) {
          if (!tank || tank.hp <= 0) return false;

          let remaining = Math.max(0, amount);
          if (remaining <= 0) return false;

          // Damage dealt counts the full hit, including whatever the shield eats
          if (shooter) {
            shooter.damageDealt = (shooter.damageDealt || 0) + remaining;
          }

          // Shield damage absorption
          let shieldAbsorbed = 0;
          if (tank.shield && tank.shield.hp > 0) {
            const shieldDmg = Math.min(tank.shield.hp, remaining);
            tank.shield.hp -= shieldDmg;
            remaining -= shieldDmg;
            shieldAbsorbed = shieldDmg;
            if (!this.headless && shieldDmg > 0 && typeof sfx === 'function') sfx('shieldHit');
            if (tank.shield.hp <= 0) {
              tank.shield = null;
              this.raiseAutoDefenseShield(tank);
            }
          }

          const prevHp = tank.hp;
          tank.hp = Math.max(0, tank.hp - remaining);

          if (!this.headless && this.damageNumbers) {
            if (shieldAbsorbed > 0) {
              this.damageNumbers.push({ x: tank.x, y: tank.y - 15, text: shieldAbsorbed.toFixed(0), color: '#00ffff', life: 60 });
            }
            if (remaining > 0) {
              this.damageNumbers.push({ x: tank.x, y: tank.y, text: remaining.toFixed(0), color: '#ff0000', life: 60 });
              if (typeof sfx === 'function') sfx('hit');
            }
          }

          // Mark dead and credit kill
          if (prevHp > 0 && tank.hp <= 0) {
            if (!this.headless && typeof sfx === 'function') sfx('death');
            if (shooter) {
              shooter.kills = (shooter.kills || 0) + 1;
            }
            return true;
          }
          return false;
        }

        // opts.carve === false leaves the terrain untouched (Plasma Blast is
        // pure energy — it cooks tanks without moving a grain of dirt).
        explosion(x, y, radius, damage, shooterIdx, opts) {
          opts = opts || {};

          // 1. Carve terrain
          if (opts.carve !== false) {
            this.terrain.carve(x, y, radius);
          }

          // Track newly killed tanks to trigger chain reaction explosions
          const deadTanksToExplode = [];

          // 2. Apply falloff damage to every tank inside the radius
          if (this.roster) {
            const shooter = (shooterIdx !== undefined && shooterIdx !== null) ? this.roster[shooterIdx] : null;

            this.roster.forEach((tank, idx) => {
              if (tank.hp <= 0) return;

              // Distance from explosion center (x, y) to tank center (tank.x, tank.y - 3)
              const dx = tank.x - x;
              const dy = (tank.y - 3) - y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < radius) {
                const dmg = damage * (1 - dist / radius);
                const clampedDmg = Math.max(0, dmg);

                if (this.applyDamageToTank(tank, clampedDmg, shooter)) {
                  deadTanksToExplode.push({ tank, idx });
                }
              }
            });
          }

          // 3. Audio/Visual effects
          if (!this.headless) {
            sfx('explode', { radius });

            // Push expanding fireball ring
            if (this.explosions) {
              this.explosions.push({
                x: x,
                y: y,
                maxRadius: radius,
                currentRadius: 0,
                life: 0.5,
                maxLife: 0.5
              });
            }

            // Spawn smoke and debris particles
            this.spawnCraterEffects(x, y, radius);
          }

          // 4. Chain reactions: dead tanks explode sequentially
          deadTanksToExplode.forEach(item => {
            this.explosion(item.tank.x, item.tank.y - 3, 35, 50, shooterIdx);
          });
          
          this.terrain.settle();
        }

        reSeatTanks() {
          if (!this.roster) return;
          this.roster.forEach(tank => {
            if (tank.hp <= 0) return;
            const groundY = CONST.WORLD_H - this.terrain.heightAt(tank.x);
            if (tank.y < groundY - 0.01) {
              tank.falling = true;
              if (tank.vy === undefined || tank.vy === null) {
                tank.vy = 0;
              }
            } else {
              tank.y = groundY;
              tank.falling = false;
              tank.vy = 0;
            }
          });
        }

        // A LeapFrog detonation throws the round forward for another hop. Every
        // number here is fixed, not drawn from a stream: the hop distance is the
        // same on every client, so an unlucky RNG-ordering difference can never
        // land the second explosion in a different crater on two screens.
        spawnLeapFrogHop(x, y, weaponId, shooterIdx, proj) {
          const wConf = WEAPONS_BY_ID.get(weaponId);
          const maxHops = (wConf && wConf.hops) || 0;
          const hopsLeft = (proj && proj.hopsLeft !== undefined) ? proj.hopsLeft : maxHops;
          if (hopsLeft <= 0) return;

          // Direction is fixed at the first detonation and carried through every
          // hop after it. Re-deriving it from vx each time would let a strong
          // headwind flip a hop backwards mid-sequence, which reads as a bug.
          const dir = (proj && proj.hopDir !== undefined)
            ? proj.hopDir
            : ((proj && proj.vx < 0) ? -1 : 1);

          this.projectiles.push({
            x: x,
            y: y - 10,
            vx: dir * 110,
            vy: -170,
            weapon: weaponId,
            hopsLeft: hopsLeft - 1,
            hopDir: dir,
            shooterIdx: shooterIdx
          });
        }

        // Visual only — a Smoke Tracer's landing marker. Runs off visualRNG,
        // which no simulation state ever reads, so it cannot affect a replay.
        spawnSmokePuff(x, y) {
          for (let i = 0; i < 12; i++) {
            this.spawnParticle(
              'smoke',
              x + visualRNG.range(-6, 6),
              y + visualRNG.range(-6, 6),
              visualRNG.range(-12, 12),
              visualRNG.range(-26, -6),
              '#cccccc',
              visualRNG.range(1.4, 2.6),
              visualRNG.range(2, 4)
            );
          }
        }

        // `proj` is the projectile that just died, when there was one. Only the
        // hop-and-re-explode weapons need it (they carry their travel direction
        // and remaining hop count into the next detonation); every other weapon
        // is fully described by x/y/weapon, so the argument stays optional.
        onImpact(x, y, weapon, shooterIdx, proj) {
          if (shooterIdx !== undefined && this.roster) {
            const shooter = this.roster[shooterIdx];
            if (shooter && shooter.type === 'Cyborg' && shooter.lastTargetName) {
              shooter.telemetry = shooter.telemetry || {};
              shooter.telemetry[shooter.lastTargetName] = {
                aimX: shooter.lastAimX,
                landX: x
              };
            }
          }

          const wp = weapon || 'Baby Missile';
          // Find weapon config
          const wConf = WEAPONS.find(w => w.id === wp) || { blast: 30, damage: 60 };
          let radius = wConf.blast;
          let damage = wConf.damage;

          // Helper/Sub projectiles
          if (wp === 'MIRV Sub') { radius = 25; damage = 50; }
          else if (wp === "Death's Head Sub") { radius = 35; damage = 70; }
          else if (wp === 'Cluster Bomblet') { radius = 12; damage = 24; }
          else if (wp === 'Funky Bomblet') { radius = 15; damage = 30; }

          this.lastShooterIdx = shooterIdx;

          const kind = wConf.kind;

          // Perform specific actions based on weapon type
          if (kind === 'dirt') {
            // The dirt-delivery tier ADDS terrain. No damage at all: being
            // buried is the punishment, and a buried tank digs itself out with
            // fuel or a Riot charge.
            this.terrain.deposit(x, y, radius);
            if (!this.headless) {
              sfx('explode', { radius });
              this.spawnCraterEffects(x, y, radius);
            }
          } else if (kind === 'riot') {
            // Clears dirt, harms nobody — deliberately routed around
            // explosion() so there is no code path that can damage a tank.
            this.terrain.carve(x, y, radius);
            if (!this.headless) {
              sfx('explode', { radius });
              this.spawnCraterEffects(x, y, radius);
            }
          } else if (kind === 'plasma') {
            // Energy blast: huge damage radius, terrain left intact.
            this.explosion(x, y, radius, damage, shooterIdx, { carve: false });
          } else if (kind === 'disrupter') {
            // Ordinary blast, plus a narrow shaft punched all the way down to
            // bedrock — the classic way to drop a hilltop tank into a pit.
            this.explosion(x, y, radius, damage, shooterIdx);
            // The shaft is cut to bedrock across a solid core and tapered at the
            // edges, wide enough that settle() cannot simply pour it shut again.
            const coreHalfWidth = 22;
            const shaftHalfWidth = 40;
            const floor = CONST.WORLD_H * 0.15;
            const startCol = Math.max(0, Math.floor(x - shaftHalfWidth));
            const endCol = Math.min(CONST.WORLD_W - 1, Math.ceil(x + shaftHalfWidth));
            for (let col = startCol; col <= endCol; col++) {
              const d = Math.abs(col - x);
              const cut = d <= coreHalfWidth
                ? 1
                : 1 - (d - coreHalfWidth) / (shaftHalfWidth - coreHalfWidth);
              if (cut <= 0) continue;
              const target = floor + (this.terrain.heights[col] - floor) * (1 - cut);
              if (target < this.terrain.heights[col]) {
                this.terrain.heights[col] = target;
              }
            }
          } else if (kind === 'leapfrog') {
            this.explosion(x, y, radius, damage, shooterIdx);
            this.spawnLeapFrogHop(x, y, wp, shooterIdx, proj);
          } else if (wp === 'Dirt Detonator') {
            // collapse deposited dirt: flatten heights within radius 40
            const collapseRadius = 40;
            const startCol = Math.max(0, Math.floor(x - collapseRadius));
            const endCol = Math.min(CONST.WORLD_W - 1, Math.ceil(x + collapseRadius));
            for (let col = startCol; col <= endCol; col++) {
              const dx = col - x;
              if (Math.abs(dx) < collapseRadius) {
                this.terrain.heights[col] = Math.max(CONST.WORLD_H * 0.15, this.terrain.heights[col] - 25 * (1 - Math.abs(dx) / collapseRadius));
              }
            }
            this.explosion(x, y, radius, damage, shooterIdx);
          } else if (wp === 'Sandstorm') {
            // redistributing terrain
            const redistributionRadius = 200;
            const startCol = Math.max(0, Math.floor(x - redistributionRadius));
            const endCol = Math.min(CONST.WORLD_W - 1, Math.ceil(x + redistributionRadius));
            const copy = new Float32Array(this.terrain.heights);
            for (let col = startCol; col <= endCol; col++) {
              const shift = Math.round((this.wind || 0) * 0.15 + detSin(col * 0.05) * 12);
              const srcCol = Math.max(0, Math.min(CONST.WORLD_W - 1, col - shift));
              this.terrain.heights[col] = copy[srcCol];
            }
            if (!this.headless) {
              sfx('explode', { radius: 50 });
            }
          } else if (isTracer(wp)) {
            // Tracers deal exactly zero damage and zero blast
            if (wp === 'Smoke Tracer' && !this.headless) {
              this.spawnSmokePuff(x, y);
            }
          } else {
            // standard explosion
            this.explosion(x, y, radius, damage, shooterIdx);
          }

          this.terrain.settle();
          this.reSeatTanks();

          // Spawning post-impact sub-projectiles (e.g. Cluster Bomb / Funky Bomb / Liquid)
          if (wp === 'Cluster Bomb') {
            for (let i = 0; i < 5; i++) {
              const angle = Math.PI * (0.2 + 0.6 * (i / 4));
              const speed = gameplayRNG.range(120, 200);
              const vx = speed * detCos(angle);
              const vy = -speed * detSin(angle);
              this.projectiles.push({
                x: x,
                y: y - 5,
                vx: vx,
                vy: vy,
                weapon: 'Cluster Bomblet',
                shooterIdx: shooterIdx
              });
            }
          } else if (wp === 'Funky Bomb') {
            for (let i = 0; i < 4; i++) {
              const angle = Math.PI * (0.2 + 0.6 * (i / 3));
              const speed = gameplayRNG.range(120, 200);
              const vx = speed * detCos(angle);
              const vy = -speed * detSin(angle);
              this.projectiles.push({
                x: x,
                y: y - 5,
                vx: vx,
                vy: vy,
                weapon: 'Funky Bomblet',
                timer: 120,
                bounces: 0,
                shooterIdx: shooterIdx
              });
            }
          } else if (wp === 'Napalm' || wp === 'Hot Napalm' || wp === 'Liquid Dirt') {
            const subWeapon = wp === 'Napalm' ? 'Napalm Particle' : (wp === 'Hot Napalm' ? 'Hot Napalm Particle' : 'Liquid Dirt Particle');
            for (let i = 0; i < 15; i++) {
              const angle = Math.PI * (0.1 + 0.8 * (i / 14));
              const speed = gameplayRNG.range(50, 150);
              const vx = speed * detCos(angle);
              const vy = -speed * detSin(angle);
              this.projectiles.push({
                x: x,
                y: y - 5,
                vx: vx,
                vy: vy,
                weapon: subWeapon,
                shooterIdx: shooterIdx,
                timer: 120,
                liquid: true
              });
            }
          }

          if (this.config && typeof this.config.onImpact === 'function') {
            this.config.onImpact(x, y);
          }
        }

        anyTankFalling() {
          if (!this.roster) return false;
          return this.roster.some(tank => tank.hp > 0 && tank.falling);
        }

        stepPhysics(dt) {
          if (this.roundOver) return;
          this.roundState.ticks++;

          // Update falling tanks
          if (this.roster) {
            this.roster.forEach(tank => {
              if (tank.hp <= 0) return;
              const groundY = CONST.WORLD_H - this.terrain.heightAt(tank.x);

              if (tank.y < groundY - 0.01) {
                if (!tank.falling) {
                  tank.falling = true;
                  tank.vy = 0;
                }
                tank.vy += this.gravity * dt;
                tank.y += tank.vy * dt;

                const newGroundY = CONST.WORLD_H - this.terrain.heightAt(tank.x);
                if (tank.y >= newGroundY) {
                  tank.y = newGroundY;
                  tank.falling = false;
                  const impactVy = tank.vy;
                  tank.vy = 0;

                  // Parachute consumption check defensively
                  const hasParachute = tank.inventory && tank.inventory['Parachute'] > 0;
                  if (hasParachute) {
                    tank.inventory['Parachute']--;
                  } else {
                    // Drop damage proportional to impact velocity, capped
                    const dropDmg = Math.min(80, Math.max(0, impactVy * 0.15));
                    if (dropDmg > 5) {
                      const prevHp = tank.hp;
                      tank.hp = Math.max(0, tank.hp - dropDmg);
                      if (prevHp > 0 && tank.hp <= 0) {
                        if (this.lastShooterIdx !== undefined && this.roster[this.lastShooterIdx]) {
                          this.roster[this.lastShooterIdx].kills = (this.roster[this.lastShooterIdx].kills || 0) + 1;
                        }
                      }
                    }
                  }
                }
              } else {
                if (tank.y > groundY) {
                  tank.y = groundY;
                }
                tank.falling = false;
                tank.vy = 0;
              }
            });
          }

          // If active player is dead, skip to next living player
          if (this.roster && this.activePlayerIdx !== undefined) {
            const activeTank = this.roster[this.activePlayerIdx];
            if (activeTank && activeTank.hp <= 0) {
              this.nextTurn();
            }
          }

          // If no projectile is live, and the active player is AI, trigger its shot deterministically
          if (!this.projectile && !this.anyTankFalling() && this.roster && this.activePlayerIdx !== undefined) {
            const activeTank = this.roster[this.activePlayerIdx];
            if (activeTank && activeTank.hp > 0 && activeTank.type !== 'Human') {
              if (this.headless) {
                this.checkAIShot();
              } else {
                if (this.aiTimer === undefined) {
                  this.aiTimer = 0;
                }
                this.aiTimer += dt;
                if (this.aiTimer >= 0.7) {
                  this.checkAIShot();
                  this.aiTimer = 0;
                }
              }
            }
          }

          if (this.projectiles && this.projectiles.length > 0) {
            // Keep a copy because we might modify this.projectiles
            const activeProjs = [...this.projectiles];
            for (let pIdx = 0; pIdx < activeProjs.length; pIdx++) {
              const proj = activeProjs[pIdx];
              if (!this.projectiles.includes(proj)) continue;

              // Normalize: the loop does name matching with .includes(), which throws
              // on a projectile spawned without a weapon name
              if (typeof proj.weapon !== 'string') proj.weapon = '';

              proj.flightTicks = (proj.flightTicks || 0) + 1;
              if (proj.flightTicks > CONST.MAX_FLIGHT_TICKS) {
                if (isTracer(proj.weapon) && proj.path) {
                  this.persistentTracers = this.persistentTracers || [];
                  this.persistentTracers.push(proj.path);
                }
                this.projectiles = this.projectiles.filter(p => p !== proj);
                this.onImpact(proj.x, proj.y, proj.weapon, proj.shooterIdx, proj);
                if (this.projectiles.length === 0) {
                  this.nextTurn();
                }
                continue;
              }

              // 1. Check Roller custom downhill logic
              if (proj.rolling) {
                proj.x += proj.vx * dt;
                proj.y = CONST.WORLD_H - this.terrain.heightAt(proj.x);

                let detonate = false;
                if (proj.x < 0 || proj.x > CONST.WORLD_W) {
                  detonate = true;
                } else {
                  // Check local minimum
                  const hL = this.terrain.heightAt(proj.x - 2);
                  const hR = this.terrain.heightAt(proj.x + 2);
                  const hC = this.terrain.heightAt(proj.x);
                  if (proj.vx < 0 && hL >= hC) {
                    detonate = true;
                  } else if (proj.vx > 0 && hR >= hC) {
                    detonate = true;
                  }

                  // Check tank collision
                  if (this.roster) {
                    for (let i = 0; i < this.roster.length; i++) {
                      const tank = this.roster[i];
                      if (tank.hp > 0 && Math.abs(proj.x - tank.x) <= 8 && Math.abs(proj.y - tank.y) <= 8) {
                        detonate = true;
                        break;
                      }
                    }
                  }
                }

                if (detonate) {
                  this.projectiles = this.projectiles.filter(p => p !== proj);
                  this.onImpact(proj.x, proj.y, proj.weapon, proj.shooterIdx, proj);
                  if (this.projectiles.length === 0) {
                    this.nextTurn();
                  }
                }
                continue;
              }

              // 2. Liquid Particle custom slide downhill logic
              if (proj.liquid) {
                proj.timer--;
                if (proj.timer <= 0) {
                  this.projectiles = this.projectiles.filter(p => p !== proj);
                  if (this.projectiles.length === 0) {
                    this.nextTurn();
                  }
                  continue;
                }

                const groundY = CONST.WORLD_H - this.terrain.heightAt(proj.x);
                if (proj.y < groundY - 1) {
                  // In air, apply gravity
                  proj.vy += this.gravity * dt;
                  proj.x += proj.vx * dt;
                  proj.y += proj.vy * dt;
                } else {
                  // On ground, flow downhill
                  proj.y = groundY;
                  proj.vy = 0;
                  const hL = this.terrain.heightAt(proj.x - 2);
                  const hR = this.terrain.heightAt(proj.x + 2);
                  if (hL < hR) {
                    proj.vx = -60;
                  } else if (hR < hL) {
                    proj.vx = 60;
                  } else {
                    proj.vx = 0;
                  }
                  proj.x += proj.vx * dt;

                  // Deposit dirt for Liquid Dirt
                  if (proj.weapon === 'Liquid Dirt Particle') {
                    const tx = Math.floor(proj.x);
                    if (tx >= 0 && tx < CONST.WORLD_W) {
                      this.terrain.heights[tx] += 0.4;
                    }
                  } else if (proj.weapon.includes('Napalm')) {
                    // Napalm damage over time — routed through applyDamageToTank so the
                    // burn is absorbed by shields exactly like blast damage is
                    const burnDmg = proj.weapon.includes('Hot') ? 0.3 : 0.15;
                    const shooter = (proj.shooterIdx !== undefined && this.roster) ? this.roster[proj.shooterIdx] : null;
                    if (this.roster) {
                      this.roster.forEach(tank => {
                        if (tank.hp > 0 && Math.abs(proj.x - tank.x) < 12 && Math.abs(proj.y - tank.y) < 12) {
                          this.applyDamageToTank(tank, burnDmg, shooter);
                        }
                      });
                    }
                  }
                }

                // Visual trails
                if (!this.headless) {
                  const col = proj.weapon.includes('Liquid Dirt') ? '#735035' : '#ff5500';
                  this.spawnParticle('spark', proj.x, proj.y, visualRNG.range(-3, 3), visualRNG.range(-8, -2), col, 0.2, 1.5);
                }
                continue;
              }

              // 3. Funky Bomblet custom timer bounce logic
              if (proj.weapon === 'Funky Bomblet') {
                proj.timer--;
                if (proj.timer <= 0) {
                  this.projectiles = this.projectiles.filter(p => p !== proj);
                  this.onImpact(proj.x, proj.y, 'Funky Bomblet', proj.shooterIdx);
                  if (this.projectiles.length === 0) {
                    this.nextTurn();
                  }
                  continue;
                }
              }

              // 4. Trace line path recording
              if (isTracer(proj.weapon)) {
                proj.path = proj.path || [];
                proj.path.push({ x: proj.x, y: proj.y });
              }

              // 5. Standard projectile gravity & wind integration.
              // A Laser is a beam, not a shell: it ignores both, so it flies
              // the straight line the barrel was pointing along.
              const isLaser = proj.weapon === 'Laser';
              const prevVy = proj.vy;
              if (!isLaser) {
                proj.vy += this.gravity * dt;
                proj.vx += (this.wind || 0) * dt;
              }

              // Trajectory apex split trigger for MIRV and Death's Head
              if ((proj.weapon === 'MIRV' || proj.weapon === "Death's Head") && !proj.split && prevVy < 0 && proj.vy >= 0) {
                proj.split = true;
                this.projectiles = this.projectiles.filter(p => p !== proj);

                const numSub = proj.weapon === 'MIRV' ? 5 : 9;
                const subWeapon = proj.weapon === 'MIRV' ? 'MIRV Sub' : "Death's Head Sub";
                for (let i = 0; i < numSub; i++) {
                  const t = (i - (numSub - 1) / 2) / ((numSub - 1) / 2 || 1);
                  const sub_vx = proj.vx + t * 60;
                  const sub_vy = proj.vy + Math.abs(t) * 15;
                  this.projectiles.push({
                    x: proj.x,
                    y: proj.y,
                    vx: sub_vx,
                    vy: sub_vy,
                    weapon: subWeapon,
                    shooterIdx: proj.shooterIdx
                  });
                }
                continue;
              }

              let step_vx = proj.vx;
              let step_vy = proj.vy;

              // The beam covers ground fast enough to read as a beam. This is a
              // fixed multiple of the server-minted launch vector, so every
              // client scales the identical doubles by the identical constant.
              if (isLaser) {
                step_vx *= 2.5;
                step_vy *= 2.5;
              }

              if (proj.digging) {
                step_vx = 0;
                step_vy = 30; // constant burrow speed
                proj.digDepth += step_vy * dt;

                // A Sandhog carves the shaft it is descending; a Digger just
                // burrows through and leaves the dirt where it was.
                if (proj.tunnelling) {
                  this.terrain.carve(proj.x, proj.y, CONST.SANDHOG_SHAFT_RADIUS);
                }

                // Check if it reached max depth
                const maxDepth = proj.maxDigDepth !== undefined
                  ? proj.maxDigDepth
                  : (proj.weapon === 'Heavy Digger' ? 80 : 40);
                if (proj.digDepth > maxDepth) {
                  this.projectiles = this.projectiles.filter(p => p !== proj);
                  this.onImpact(proj.x, proj.y, proj.weapon, proj.shooterIdx, proj);
                  if (this.projectiles.length === 0) {
                    this.nextTurn();
                  }
                  continue; // skip the rest of physics steps
                }
              }

              const speed = Math.sqrt(step_vx * step_vx + step_vy * step_vy);
              const numSteps = Math.max(10, Math.ceil(speed * dt));
              const sdt = dt / numSteps;

              let impacted = false;

              for (let s = 0; s < numSteps; s++) {
                if (impacted || !this.projectiles.includes(proj)) break;

                proj.x += step_vx * sdt;
                proj.y += step_vy * sdt;

                // Spawn trail particle
                if (!this.headless) {
                  const col = visualRNG.choice(['#ff3300', '#ffaa00', '#ffff00', '#ff6600']);
                  const jx = visualRNG.range(-5, 5);
                  const jy = visualRNG.range(-5, 5);
                  this.spawnParticle(
                    'spark',
                    proj.x,
                    proj.y,
                    -step_vx * 0.05 + jx,
                    -step_vy * 0.05 + jy,
                    col,
                    visualRNG.range(0.2, 0.4),
                    visualRNG.range(1.0, 2.5)
                  );
                }

                // Walls boundaries
                if (this.wallType === 'off') {
                  if (proj.x < 0 || proj.x > CONST.WORLD_W) {
                    if (isTracer(proj.weapon) && proj.path) {
                      this.persistentTracers = this.persistentTracers || [];
                      this.persistentTracers.push(proj.path);
                    }
                    this.projectiles = this.projectiles.filter(p => p !== proj);
                    if (this.projectiles.length === 0) {
                      this.nextTurn();
                    }
                    impacted = true;
                    break;
                  }
                } else if (this.wallType === 'rubber') {
                  if (proj.x < 0) {
                    proj.vx = -proj.vx;
                    step_vx = -step_vx;
                    proj.x = -proj.x;
                    proj.bounces = (proj.bounces || 0) + 1;
                    if (!this.headless) sfx('bounce');
                  } else if (proj.x > CONST.WORLD_W) {
                    proj.vx = -proj.vx;
                    step_vx = -step_vx;
                    proj.x = CONST.WORLD_W - (proj.x - CONST.WORLD_W);
                    proj.bounces = (proj.bounces || 0) + 1;
                    if (!this.headless) sfx('bounce');
                  }
                } else if (this.wallType === 'wrap') {
                  proj.x = (proj.x % CONST.WORLD_W + CONST.WORLD_W) % CONST.WORLD_W;
                } else if (this.wallType === 'concrete') {
                  if (proj.x < 0) {
                    proj.vx = -proj.vx;
                    step_vx = -step_vx;
                    proj.x = -proj.x;
                    proj.bounces = (proj.bounces || 0) + 1;
                    if (!this.headless) sfx('bounce');
                  } else if (proj.x > CONST.WORLD_W) {
                    proj.vx = -proj.vx;
                    step_vx = -step_vx;
                    proj.x = CONST.WORLD_W - (proj.x - CONST.WORLD_W);
                    proj.bounces = (proj.bounces || 0) + 1;
                    if (!this.headless) sfx('bounce');
                  }
                  if (proj.y < 0) {
                    proj.vy = -proj.vy;
                    step_vy = -step_vy;
                    proj.y = -proj.y;
                    proj.bounces = (proj.bounces || 0) + 1;
                    if (!this.headless) sfx('bounce');
                  }
                }

                // Proximity Fuse: an air burst as the shell passes an enemy
                // hull, instead of sailing over it for a near miss. The SHOOTER
                // is excluded or the shell would trip on its own tank 12px off
                // the barrel; tracers are excluded because detonating an aiming
                // aid early just loses the trace you fired it for.
                //
                // Determinism: roster index order, and only + - * and a
                // comparison, so every client trips on the same substep.
                if (proj.trigger === 'proximity' && !isTracer(proj.weapon) && this.roster) {
                  let tripped = false;
                  for (let i = 0; i < this.roster.length; i++) {
                    if (i === proj.shooterIdx) continue;
                    const near = this.roster[i];
                    if (!near || near.hp <= 0) continue;
                    const pdx = proj.x - near.x;
                    const pdy = proj.y - (near.y - 3);
                    if (pdx * pdx + pdy * pdy <= PROXIMITY_FUSE_RADIUS * PROXIMITY_FUSE_RADIUS) {
                      tripped = true;
                      break;
                    }
                  }
                  if (tripped) {
                    this.projectiles = this.projectiles.filter(p => p !== proj);
                    this.onImpact(proj.x, proj.y, proj.weapon, proj.shooterIdx, proj);
                    if (this.projectiles.length === 0) {
                      this.nextTurn();
                    }
                    impacted = true;
                    break;
                  }
                }

                // Below screen bottom
                if (proj.y > CONST.WORLD_H) {
                  if (isTracer(proj.weapon) && proj.path) {
                    this.persistentTracers = this.persistentTracers || [];
                    this.persistentTracers.push(proj.path);
                  }
                  this.projectiles = this.projectiles.filter(p => p !== proj);
                  if (this.projectiles.length === 0) {
                    this.nextTurn();
                  }
                  impacted = true;
                  break;
                }

                // Terrain Collision
                const terrainX = Math.floor(proj.x);
                if (terrainX >= 0 && terrainX < CONST.WORLD_W) {
                  const groundY = CONST.WORLD_H - this.terrain.heightAt(proj.x);
                  if (proj.y >= groundY) {
                    // A Contact Trigger detonates the shell where it lands.
                    // Every check below this line is a family that would
                    // otherwise DELAY the first detonation — roll downhill,
                    // bounce, dig, tunnel — so contact skips all of them.
                    const contactArmed = proj.trigger === 'contact';

                    // Check roller trigger
                    if (!contactArmed && proj.weapon.includes('Roller') && !proj.rolling) {
                      proj.rolling = true;
                      proj.vy = 0;
                      proj.y = groundY;
                      const hL = this.terrain.heightAt(proj.x - 2);
                      const hR = this.terrain.heightAt(proj.x + 2);
                      proj.vx = hL < hR ? -80 : 80;
                      impacted = true;
                      break;
                    }

                    // Check Funky Bomblet bounce trigger
                    if (!contactArmed && proj.weapon === 'Funky Bomblet') {
                      proj.vy = -Math.abs(proj.vy) * 0.6;
                      proj.vx *= 0.8;
                      proj.y = groundY - 2;
                      if (!this.headless) sfx('bounce');
                      impacted = true;
                      break;
                    }

                    // Check Digger trigger
                    if (!contactArmed && proj.weapon.includes('Digger') && !proj.digging) {
                      proj.digging = true;
                      proj.digDepth = 0;
                      impacted = true;
                      break;
                    }

                    // Check Sandhog trigger: tunnels down through the dirt,
                    // carving as it goes, and detonates at the bottom.
                    const hitConf = WEAPONS_BY_ID.get(proj.weapon);
                    if (!contactArmed && hitConf && hitConf.kind === 'sandhog' && !proj.digging) {
                      proj.digging = true;
                      proj.tunnelling = true;
                      proj.digDepth = 0;
                      proj.maxDigDepth = hitConf.tunnel;
                      impacted = true;
                      break;
                    }

                    // Normal impact
                    if (isTracer(proj.weapon) && proj.path) {
                      this.persistentTracers = this.persistentTracers || [];
                      this.persistentTracers.push(proj.path);
                    }
                    this.projectiles = this.projectiles.filter(p => p !== proj);
                    this.onImpact(proj.x, proj.y, proj.weapon, proj.shooterIdx, proj);
                    if (this.projectiles.length === 0) {
                      this.nextTurn();
                    }
                    impacted = true;
                    break;
                  }
                }

                // Collision with tank hulls
                let hitTank = false;
                if (this.roster) {
                  for (let i = 0; i < this.roster.length; i++) {
                    const tank = this.roster[i];
                    if (tank.hp > 0) {
                      if (proj.x >= tank.x - 8 && proj.x <= tank.x + 8 &&
                          proj.y >= tank.y - 6 && proj.y <= tank.y) {

                        // Deflector shields bounce the shell instead of eating
                        // it. Which types deflect is SHIELD_TYPES' business, not
                        // a name comparison here.
                        if (tank.shield && tank.shield.hp > 0 && shieldDeflects(tank.shield.type)) {
                          const dx = proj.x - tank.x;
                          const dy = proj.y - (tank.y - 3);
                          let dist = Math.sqrt(dx * dx + dy * dy);
                          if (dist === 0) dist = 1;
                          const nx = dx / dist;
                          const ny = dy / dist;
                          const dot = proj.vx * nx + proj.vy * ny;
                          proj.vx = proj.vx - 2 * dot * nx;
                          proj.vy = proj.vy - 2 * dot * ny;
                          proj.x = tank.x + nx * 12;
                          proj.y = (tank.y - 3) + ny * 12;
                          tank.shield.hp -= 50;
                          if (!this.headless) sfx('bounce');
                          if (tank.shield.hp <= 0) {
                            tank.shield = null;
                            this.raiseAutoDefenseShield(tank);
                          }
                          hitTank = false; // Reflected, don't detonate!
                          break;
                        } else {
                          // Normal impact on tank
                          if (isTracer(proj.weapon) && proj.path) {
                            this.persistentTracers = this.persistentTracers || [];
                            this.persistentTracers.push(proj.path);
                          }
                          this.projectiles = this.projectiles.filter(p => p !== proj);
                          this.onImpact(proj.x, proj.y, proj.weapon, proj.shooterIdx, proj);
                          if (this.projectiles.length === 0) {
                            this.nextTurn();
                          }
                          hitTank = true;
                          impacted = true;
                          break;
                        }
                      }
                    }
                  }
                }
                if (hitTank) break;
              }
            }
          }

          if (!this.roundOver && this.projectiles.length === 0 && !this.anyTankFalling() && this.roster) {
            const livingTanks = this.roster.filter(t => t.hp > 0);
            if (livingTanks.length <= 1) {
              this.handleRoundEnd();
            }
          }
        }

        spawnParticle(type, x, y, vx, vy, color, maxLife, size) {
          if (this.headless || !this.particlePool) return;
          const p = this.particlePool.find(item => !item.active);
          if (!p) return; // Hard cap near 600 reached
          p.active = true;
          p.type = type;
          p.x = x;
          p.y = y;
          p.vx = vx;
          p.vy = vy;
          p.color = color;
          p.life = maxLife;
          p.maxLife = maxLife;
          p.size = size || 2;
          p.bounces = 0;
        }

        updateParticles(dt) {
          if (this.headless || !this.particlePool) return;
          for (let i = 0; i < this.particlePool.length; i++) {
            const p = this.particlePool[i];
            if (!p.active) continue;

            p.life -= dt;
            if (p.life <= 0) {
              p.active = false;
              continue;
            }

            if (p.type === 'spark') {
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vx *= 0.95;
              p.vy *= 0.95;
            } else if (p.type === 'smoke') {
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vy -= 10 * dt; // Smoke rises slightly
            } else if (p.type === 'debris') {
              p.vy += this.gravity * dt;
              p.x += p.vx * dt;
              p.y += p.vy * dt;

              if (p.x < 0 || p.x > CONST.WORLD_W) {
                p.active = false;
                continue;
              }

              const groundY = CONST.WORLD_H - this.terrain.heightAt(p.x);
              if (p.y >= groundY) {
                p.y = groundY;
                p.vy = -p.vy * 0.4;
                p.vx *= 0.5;
                p.bounces++;
                if (Math.abs(p.vy) < 10 || p.bounces > 4) {
                  p.vy = 0;
                  p.vx = 0;
                  p.y = groundY;
                }
              }
            }
          }

          if (!this.headless && this.damageNumbers) {
            for (let i = this.damageNumbers.length - 1; i >= 0; i--) {
              const dn = this.damageNumbers[i];
              dn.life -= 1;
              dn.y -= 0.5; // float up
              if (dn.life <= 0) {
                this.damageNumbers.splice(i, 1);
              }
            }
          }
        }

        drawParticles(ctx) {
          if (this.headless || !this.particlePool) return;
          for (let i = 0; i < this.particlePool.length; i++) {
            const p = this.particlePool[i];
            if (!p.active) continue;

            ctx.save();
            const alpha = Math.max(0, Math.min(1, p.life / p.maxLife));
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            if (p.type === 'smoke') {
              ctx.arc(p.x, p.y, p.size * (1 + (1 - p.life / p.maxLife) * 1.5), 0, Math.PI * 2);
            } else {
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            }
            ctx.fill();
            ctx.restore();
          }
        }

        // === END SIMULATION PATH ===
        spawnCraterEffects(x, y, radius) {
          if (this.headless) return;
          const smokeCount = Math.floor(radius / 2);
          for (let i = 0; i < smokeCount; i++) {
            const angle = visualRNG.range(0, Math.PI * 2);
            const r = visualRNG.range(0, radius * 0.8);
            const px = x + r * Math.cos(angle);
            const py = y + r * Math.sin(angle);

            const vx = visualRNG.range(-15, 15);
            const vy = visualRNG.range(-30, -10);

            const size = visualRNG.range(3, 8);
            const maxLife = visualRNG.range(0.8, 1.5);
            const colors = ['#555555', '#777777', '#999999', '#333333'];
            const color = visualRNG.choice(colors);

            this.spawnParticle('smoke', px, py, vx, vy, color, maxLife, size);
          }

          const debrisCount = Math.floor(radius / 3);
          for (let i = 0; i < debrisCount; i++) {
            const angle = visualRNG.range(-Math.PI * 0.8, -Math.PI * 0.2);
            const speed = visualRNG.range(50, 150);
            const vx = speed * Math.cos(angle);
            const vy = speed * Math.sin(angle);

            const maxLife = visualRNG.range(2.0, 4.0);
            const size = visualRNG.range(1.5, 3.5);
            const colors = ['#8b5a2b', '#5c3a21', '#3d2514', '#4a4a4a'];
            const color = visualRNG.choice(colors);

            this.spawnParticle('debris', x, y - 2, vx, vy, color, maxLife, size);
          }
        }

        updateExplosions(dt) {
          if (this.headless || !this.explosions) return;
          for (let i = this.explosions.length - 1; i >= 0; i--) {
            const exp = this.explosions[i];
            exp.life -= dt;
            const progress = 1 - (exp.life / exp.maxLife);
            exp.currentRadius = exp.maxRadius * progress;
            if (exp.life <= 0) {
              this.explosions.splice(i, 1);
            }
          }
        }

        drawExplosions(ctx) {
          if (this.headless || !this.explosions) return;
          for (let i = 0; i < this.explosions.length; i++) {
            const exp = this.explosions[i];
            ctx.save();
            const alpha = Math.max(0, Math.min(1, exp.life / exp.maxLife));
            ctx.globalAlpha = alpha;

            ctx.strokeStyle = '#ff3300';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(exp.x, exp.y, exp.currentRadius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#ffaa00';
            ctx.beginPath();
            ctx.arc(exp.x, exp.y, exp.currentRadius * 0.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(exp.x, exp.y, exp.currentRadius * 0.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
          }
        }

        update(dt) {
          if (this.roundOver) return;
          this.stepPhysics(dt);
          if (!this.headless) {
            this.updateParticles(dt);
            this.updateExplosions(dt);
          }
        }

        handleRoundEnd() {
          this.roundOver = true;
          if (!this.headless && typeof sfx === 'function') sfx('roundEnd');

          // 1. Calculate and apply payouts
          if (this.roster) {
            this.roster.forEach(tank => {
              tank.cumulativeKills = (tank.cumulativeKills || 0) + (tank.kills || 0);
              tank.cumulativeDamage = (tank.cumulativeDamage || 0) + (tank.damageDealt || 0);

              const damagePayout = Math.floor(tank.damageDealt || 0);
              const killPayout = (tank.kills || 0) * 500;
              const survivalBonus = tank.hp > 0 ? (100 * this.currentRound) : 0;

              tank.cash += damagePayout + killPayout + survivalBonus;

              // Reset round-level stats
              tank.damageDealt = 0;
              tank.kills = 0;
            });
          }

          // Online, payouts are all this function does. The server owns round
          // structure — whether a shop intermission follows, and when the next
          // round starts — and drives it through applyRoundEnd(). Falling into
          // the local branch below would have each client advancing its own
          // rounds independently of the server and of each other.
          if (this.mode === 'online') {
            return;
          }

          // 2. Check if this was the final round
          if (this.currentRound >= this.rounds) {
            if (!this.headless) {
              this.showMatchSummary();
            }
          } else {
            if (this.headless) {
              // In headless mode, automatically advance to next round
              this.roster.forEach(player => {
                if (player.type !== 'Human') {
                  this.handleAIPurchases(player);
                }
              });
              this.startNextRound();
            } else {
              // In browser, start shop intermission for the first player
              this.startShopIntermission();
            }
          }
        }

        startNextRound() {
          this.currentRound++;
          this.roundOver = false;

          // Generate fresh terrain and wind for the new round
          this.newRound(this.seed + this.currentRound);

          // Restore tanks to full hp, clear shields, reposition
          if (this.roster) {
            const N = this.roster.length;
            const zoneW = CONST.WORLD_W / N;
            const margin = 40;
            this.roster.forEach((tank, i) => {
              tank.hp = 100;
              tank.shield = null;
              this.grantRoundFuel(tank);

              // Fresh random position within player zone
              const minX = zoneW * i + margin;
              const maxX = zoneW * (i + 1) - margin;
              tank.x = gameplayRNG.range(minX, maxX);
            });
            this.snapTanksToTerrain();
          }

          this.activePlayerIdx = 0;
          this.projectile = null;
          this.raiseShieldForActivePlayer();

          if (!this.headless) {
            const shopEl = document.getElementById('shop');
            if (shopEl) {
              shopEl.hidden = true;
            }
            this.updateHUD();
          }
        }

        buy(tank, id, packs = 1) {
          const weapon = WEAPONS.find(w => w.id === id);
          const item = ITEMS.find(i => i.id === id);
          const config = weapon || item;
          if (!config) return false;

          const totalCost = config.cost * packs;
          if (tank.cash < totalCost) {
            return false;
          }

          tank.cash -= totalCost;
          if (!tank.inventory) {
            tank.inventory = {};
          }
          if (tank.inventory[id] === undefined) {
            tank.inventory[id] = 0;
          }
          tank.inventory[id] += (config.packSize * packs);

          if (!this.headless) {
            sfx('buy');
          }
          return true;
        }

        sell(tank, id, itemsToSell = 1) {
          const config = WEAPONS.find(w => w.id === id) || ITEMS.find(i => i.id === id);
          if (!config) return false;

          tank.inventory = tank.inventory || {};
          const owned = tank.inventory[id] || 0;
          if (owned < itemsToSell) return false;

          // Sell price is proportional to pack size.
          const pricePerItem = Math.floor(config.cost / config.packSize);
          tank.cash += (pricePerItem * itemsToSell);
          tank.inventory[id] -= itemsToSell;

          if (!this.headless) {
            sfx('buy');
          }
          return true;
        }

        // Is this room running the restricted "Basic" tier? Every consumer of
        // the tier asks here. Inlining the comparison a third time is what
        // stranded the `isBasicOnly` reference in the shop's sell button.
        isBasicTier() {
          return !!(this.config && this.config.weaponsAvailability === 'basic');
        }

        // The weapons this room's tier allows. One definition for the shop and
        // the AI buyer, which used to hold a copy of the basic list each.
        availableWeapons() {
          if (this.isBasicTier()) {
            return WEAPONS.filter(w => BASIC_WEAPON_IDS.includes(w.id));
          }
          return WEAPONS.slice();
        }

        handleAIPurchases(player) {
          if (player.type === 'Cyborg') {
            const availableWeapons = this.availableWeapons();
            // Sort by damage descending
            const sortedWeapons = [...availableWeapons].sort((a, b) => b.damage - a.damage);
            const bestWeapon = sortedWeapons.find(w => player.cash >= w.cost);
            if (bestWeapon) {
              this.buy(player, bestWeapon.id);
            }
          }
        }

        startShopIntermission() {
          this.shoppingPlayerIdx = 0;
          this.showShopForPlayer(this.shoppingPlayerIdx);
        }

        // opts.onDone replaces the hot-seat "next player, then start the round"
        // behaviour — online, DONE means "tell the server I am ready" and the
        // server starts the round when everyone has. opts.standings renders the
        // between-round table above the grid.
        showShopForPlayer(playerIdx, opts) {
          opts = opts || {};
          if (this.headless) return;
          const shopEl = document.getElementById('shop');
          if (!shopEl) return;

          const player = this.roster[playerIdx];
          if (player.type !== 'Human') {
            this.handleAIPurchases(player);
            this.shoppingPlayerIdx++;
            if (this.shoppingPlayerIdx < this.roster.length) {
              this.showShopForPlayer(this.shoppingPlayerIdx, opts);
            } else {
              this.startNextRound();
            }
            return;
          }

          shopEl.hidden = false;

          // Clear and rebuild shop content
          shopEl.innerHTML = '';

          // Create container
          const container = document.createElement('div');
          container.className = 'shop-container';
          container.style.background = '#181818';
          container.style.border = '3px double ' + player.color;
          container.style.padding = '20px';
          container.style.width = '90%';
          container.style.maxWidth = '800px';
          container.style.margin = '20px auto';
          container.style.boxShadow = '0 0 20px ' + player.color;
          container.style.maxHeight = '90vh';
          container.style.display = 'flex';
          container.style.flexDirection = 'column';

          // Header
          const header = document.createElement('div');
          header.style.borderBottom = '2px solid ' + player.color;
          header.style.paddingBottom = '10px';
          header.style.marginBottom = '15px';
          header.style.display = 'flex';
          header.style.justifyContent = 'space-between';
          header.style.alignItems = 'center';

          const title = document.createElement('h2');
          title.textContent = player.name.toUpperCase();
          title.style.color = player.color;
          title.style.margin = '0';
          title.style.letterSpacing = '2px';

          const info = document.createElement('div');
          info.style.textAlign = 'right';
          info.style.color = '#00ff00';
          info.innerHTML = `
            <div style="font-weight: bold; font-size: 18px;">CASH: $${player.cash}</div>
            <div style="font-size: 14px; color: #888;">Round ${this.currentRound} of ${this.rounds}</div>
          `;

          header.appendChild(title);
          header.appendChild(info);
          container.appendChild(header);

          // Between-round standings. Only rendered when a caller supplies them
          // (the online intermission does; the local hot-seat shop does not,
          // because every player is looking at the same screen anyway).
          if (Array.isArray(opts.standings) && opts.standings.length) {
            const standingsBox = document.createElement('div');
            standingsBox.style.marginBottom = '15px';
            standingsBox.style.border = '1px solid #333';
            standingsBox.style.padding = '10px';
            standingsBox.style.background = '#111';

            const sTitle = document.createElement('div');
            sTitle.textContent = 'STANDINGS';
            sTitle.style.color = '#888';
            sTitle.style.fontSize = '12px';
            sTitle.style.letterSpacing = '2px';
            sTitle.style.marginBottom = '6px';
            standingsBox.appendChild(sTitle);

            opts.standings.forEach((s, i) => {
              const row = document.createElement('div');
              row.style.display = 'flex';
              row.style.justifyContent = 'space-between';
              row.style.fontSize = '14px';
              row.style.padding = '2px 0';
              row.style.color = s.colour || '#fff';

              const left = document.createElement('span');
              left.textContent = `#${i + 1} ${String(s.name || ('SLOT ' + s.slot)).toUpperCase()}`
                + (s.slot === this.mySlot ? ' (YOU)' : '')
                + (s.connected === false ? ' [DISCONNECTED]' : '');

              const right = document.createElement('span');
              right.textContent = `ROUNDS WON: ${s.roundsWon || 0}`;
              right.style.color = '#fff';

              row.appendChild(left);
              row.appendChild(right);
              standingsBox.appendChild(row);
            });
            container.appendChild(standingsBox);
          }

          // Bulk toggle
          opts.bulkMultiplier = opts.bulkMultiplier || 1;
          const bulkDiv = document.createElement('div');
          bulkDiv.style.marginBottom = '10px';
          bulkDiv.style.display = 'flex';
          bulkDiv.style.gap = '10px';
          bulkDiv.style.alignItems = 'center';

          const bulkLabel = document.createElement('span');
          bulkLabel.textContent = 'QUANTITY:';
          bulkLabel.style.color = '#888';
          bulkLabel.style.fontWeight = 'bold';

          bulkDiv.appendChild(bulkLabel);

          [1, 5, 10].forEach(mult => {
            const mBtn = document.createElement('button');
            mBtn.textContent = `x${mult}`;
            mBtn.style.fontFamily = 'inherit';
            mBtn.style.padding = '4px 12px';
            mBtn.style.cursor = 'pointer';
            mBtn.style.border = '1px solid ' + (opts.bulkMultiplier === mult ? player.color : '#444');
            mBtn.style.background = opts.bulkMultiplier === mult ? player.color : 'transparent';
            mBtn.style.color = opts.bulkMultiplier === mult ? '#000' : '#888';

            mBtn.addEventListener('click', () => {
              opts.bulkMultiplier = mult;
              this.showShopForPlayer(playerIdx, opts);
            });
            bulkDiv.appendChild(mBtn);
          });

          container.appendChild(bulkDiv);

          // Grid container (scrollable)
          const gridWrapper = document.createElement('div');
          gridWrapper.style.flex = '1 1 auto';
