<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scorched Earth</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c0c0c;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    #hud {
      flex: 0 0 auto;
      height: 40px;
      background: #141414;
      border-bottom: 2px solid #333;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }
    #game {
      flex: 1 1 auto;
      display: block;
      width: 100%;
      height: calc(100% - 40px);
    }
    /* Setup Modal styling */
    #setup {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(12, 12, 12, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    #setup[hidden] {
      display: none !important;
    }
    .setup-container {
      background: #181818;
      border: 3px double #00ff00;
      padding: 20px;
      width: 90%;
      max-width: 650px;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
      max-height: 95vh;
      overflow-y: auto;
    }
    .setup-container h2 {
      margin-top: 0;
      text-align: center;
      color: #00ff00;
      border-bottom: 2px solid #00ff00;
      padding-bottom: 10px;
      letter-spacing: 2px;
    }
    .form-group {
      margin-bottom: 15px;
      display: flex;
      align-items: center;
    }
    .form-group label {
      width: 150px;
      color: #00ff00;
      font-weight: bold;
    }
    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group select {
      flex: 1;
      background: #000;
      border: 1px solid #00ff00;
      color: #00ff00;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    .form-group select option {
      background: #000;
      color: #00ff00;
    }
    .form-group input:focus,
    .form-group select:focus {
      box-shadow: 0 0 5px #00ff00;
    }
    .player-row {
      border: 1px dashed #333;
      padding: 10px;
      margin-bottom: 15px;
      background: #111;
    }
    .player-row .form-group {
      margin-bottom: 8px;
    }
    .player-row .form-group:last-child {
      margin-bottom: 0;
    }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      border-top: 2px solid #333;
      padding-top: 15px;
      margin-top: 15px;
    }
    .settings-grid .form-group {
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 0;
    }
    .settings-grid .form-group label {
      width: 100%;
      margin-bottom: 5px;
    }
    .settings-grid .form-group input,
    .settings-grid .form-group select {
      width: 100%;
    }
    .checkbox-group .radio-options {
      display: flex;
      gap: 15px;
      width: 100%;
      margin-top: 5px;
    }
    .checkbox-group .radio-options label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: normal;
      cursor: pointer;
      width: auto;
    }
    .checkbox-group input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border: 1px solid #00ff00;
      background: #000;
      display: inline-block;
      position: relative;
      cursor: pointer;
      outline: none;
    }
    .checkbox-group input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 6px;
      height: 6px;
      background: #00ff00;
    }
    .error-msg {
      color: #ff5555;
      text-align: center;
      font-weight: bold;
      margin: 15px 0;
      min-height: 20px;
    }
    #start-btn {
      display: block;
      width: 100%;
      background: #00ff00;
      color: #000;
      border: none;
      padding: 12px;
      font-family: inherit;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #start-btn:hover {
      background: #33ff33;
      box-shadow: 0 0 10px #33ff33;
    }
    #shop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(12, 12, 12, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 90;
    }
    #shop[hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="hud"></div>
  <canvas id="game"></canvas>
  <div id="setup">
    <div class="setup-container">
      <h2>SCORCHED EARTH SETUP</h2>

      <div class="form-group">
        <label for="player-count">Players:</label>
        <select id="player-count">
          <option value="2">2 Players</option>
          <option value="3">3 Players</option>
          <option value="4" selected>4 Players</option>
        </select>
      </div>

      <div id="player-slots"></div>

      <div class="settings-grid">
        <div class="form-group">
          <label for="rounds">Rounds (1-20):</label>
          <input type="number" id="rounds" min="1" max="20" value="5">
        </div>
        <div class="form-group">
          <label for="starting-cash">Starting Cash:</label>
          <input type="number" id="starting-cash" min="0" value="10000">
        </div>
        <div class="form-group">
          <label for="wall-type">Wall Type:</label>
          <select id="wall-type">
            <option value="off">Off (Wrap-around / None)</option>
            <option value="rubber">Rubber (Bouncing)</option>
            <option value="wrap">Wrap (Screen wrap)</option>
            <option value="concrete">Concrete (Solid)</option>
          </select>
        </div>
        <div class="form-group checkbox-group">
          <label>Weapons:</label>
          <div class="radio-options">
            <label>
              <input type="radio" name="weapon-availability" value="all" checked>
              All Weapons
            </label>
            <label>
              <input type="radio" name="weapon-availability" value="basic">
              Basic Only
            </label>
          </div>
        </div>
      </div>

      <div id="error-msg" class="error-msg"></div>

      <button id="start-btn">START GAME</button>
    </div>
  </div>
  <div id="shop" hidden></div>
  <script>
    (function() {
      'use strict';

      const CONST = {
        WORLD_W: 1200,
        WORLD_H: 700,
        GRAVITY: 260,
        TICK: 1/60
      };

      const WEAPONS = [
        { id: 'Baby Missile', name: 'Baby Missile', cost: 0, packSize: 1, blast: 30, damage: 60, kind: 'explosive' },
        { id: 'Missile', name: 'Missile', cost: 500, packSize: 5, blast: 40, damage: 80, kind: 'explosive' },
        { id: 'Baby Nuke', name: 'Baby Nuke', cost: 2000, packSize: 1, blast: 60, damage: 120, kind: 'explosive' },
        { id: 'Nuke', name: 'Nuke', cost: 5000, packSize: 1, blast: 100, damage: 200, kind: 'explosive' },
        { id: 'Meganuke', name: 'Meganuke', cost: 10000, packSize: 1, blast: 150, damage: 300, kind: 'explosive' },
        { id: 'MIRV', name: 'MIRV', cost: 3000, packSize: 2, blast: 25, damage: 50, kind: 'multi' },
        { id: "Death's Head", name: "Death's Head", cost: 6000, packSize: 1, blast: 35, damage: 70, kind: 'multi' },
        { id: 'Cluster Bomb', name: 'Cluster Bomb', cost: 2000, packSize: 3, blast: 20, damage: 40, kind: 'pattern' },
        { id: 'Funky Bomb', name: 'Funky Bomb', cost: 3000, packSize: 2, blast: 25, damage: 50, kind: 'pattern' },
        { id: 'Baby Roller', name: 'Baby Roller', cost: 1000, packSize: 5, blast: 20, damage: 40, kind: 'pattern' },
        { id: 'Roller', name: 'Roller', cost: 2000, packSize: 3, blast: 30, damage: 60, kind: 'pattern' },
        { id: 'Heavy Roller', name: 'Heavy Roller', cost: 4000, packSize: 2, blast: 45, damage: 90, kind: 'pattern' },
        { id: 'Napalm', name: 'Napalm', cost: 1500, packSize: 3, blast: 15, damage: 5, kind: 'liquid' },
        { id: 'Hot Napalm', name: 'Hot Napalm', cost: 3000, packSize: 2, blast: 20, damage: 10, kind: 'liquid' },
        { id: 'Liquid Dirt', name: 'Liquid Dirt', cost: 1000, packSize: 4, blast: 15, damage: 0, kind: 'liquid' },
        { id: 'Dirt Bomb', name: 'Dirt Bomb', cost: 1500, packSize: 3, blast: 30, damage: 0, kind: 'utility' },
        { id: 'Dirt Detonator', name: 'Dirt Detonator', cost: 1000, packSize: 5, blast: 0, damage: 50, kind: 'utility' },
        { id: 'Sandstorm', name: 'Sandstorm', cost: 2000, packSize: 3, blast: 0, damage: 0, kind: 'utility' },
        { id: 'Tracer', name: 'Tracer', cost: 100, packSize: 10, blast: 0, damage: 0, kind: 'utility' }
      ];

      const ITEMS = [
        { id: 'Shield', name: 'Shield', cost: 1000, packSize: 1, kind: 'shield', strength: 100 },
        { id: 'Heavy Shield', name: 'Heavy Shield', cost: 2500, packSize: 1, kind: 'shield', strength: 200 },
        { id: 'Magnetic Shield', name: 'Magnetic Shield', cost: 4000, packSize: 1, kind: 'shield', strength: 150 },
        { id: 'Battery', name: 'Battery', cost: 500, packSize: 2, kind: 'battery' },
        { id: 'Parachute', name: 'Parachute', cost: 500, packSize: 3, kind: 'parachute' },
        { id: 'Guidance Computer', name: 'Guidance Computer', cost: 2000, packSize: 1, kind: 'utility' },
        { id: 'Auto Defense', name: 'Auto Defense', cost: 3000, packSize: 1, kind: 'utility' }
      ];

      // Deterministic mulberry32 generator
      let state = 1;
      const rng = {
        seed(n) {
          state = n >>> 0;
        },
        next() {
          let t = (state += 0x6D2B79F5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        },
        range(a, b) {
          return a + (b - a) * this.next();
        },
        int(a, b) {
          return Math.floor(this.range(a, b));
        }
      };

      // Isolated generator for visual-only non-gameplay deterministic randomness
      let visualState = 12345;
      const visualRNG = {
        next() {
          visualState = (visualState * 1664525 + 1013904223) | 0;
          return (visualState >>> 0) / 4294967296;
        },
        range(a, b) {
          return a + (b - a) * this.next();
        },
        choice(arr) {
          const idx = Math.floor(this.range(0, arr.length));
          return arr[idx];
        }
      };

      // Sizing function supporting zero-size layout and high DPI screens
      function resize() {
        if (typeof document === 'undefined' || typeof window === 'undefined') return;
        const canvas = document.getElementById('game');
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const width = rect.width || window.innerWidth || 0;
        const height = rect.height || (window.innerHeight - 40) || 0;
        if (width === 0 || height === 0) return;

        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;

        const ctx = canvas.getContext('2d');
        if (ctx) {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
      }

      // Lazily created AudioContext and mute controller
      let audioCtx = null;
      let masterGain = null;
      let isMuted = false;

      function initAudio() {
        if (audioCtx) return;
        const AudioContextClass = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
        if (!AudioContextClass) return;
        try {
          audioCtx = new AudioContextClass();
          masterGain = audioCtx.createGain();
          masterGain.gain.setValueAtTime(isMuted ? 0 : 1, audioCtx.currentTime);
          masterGain.connect(audioCtx.destination);
        } catch (e) {
          // Silent catch
        }
      }

      function sfx(name, opts = {}) {
        initAudio();
        if (!audioCtx || isMuted) return;

        if (audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }

        try {
          if (name === 'launch') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
          } else if (name === 'bounce') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.setValueAtTime(300, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
          } else if (name === 'explode') {
            try {
              const bufferSize = audioCtx.sampleRate * 0.5;
              const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
              const data = buffer.getChannelData(0);
              let nSeed = 12345;
              for (let i = 0; i < bufferSize; i++) {
                nSeed = (nSeed * 1664525 + 1013904223) | 0;
                const r = (nSeed >>> 0) / 4294967296;
                data[i] = (r * 2 - 1) * 0.2;
              }
              const noise = audioCtx.createBufferSource();
              noise.buffer = buffer;
              const filter = audioCtx.createBiquadFilter();
              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(800, audioCtx.currentTime);
              filter.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
              const gain = audioCtx.createGain();
              gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
              gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
              noise.connect(filter);
              filter.connect(gain);
              gain.connect(masterGain);
              noise.start();
              noise.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(100, audioCtx.currentTime);
              osc.frequency.linearRampToValueAtTime(10, audioCtx.currentTime + 0.5);
              gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
              gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
              osc.connect(gain);
              gain.connect(masterGain);
              osc.start();
              osc.stop(audioCtx.currentTime + 0.5);
            }
          } else if (name === 'buy') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
          }
        } catch (e) {
          // Silent catch
        }
      }

      if (typeof window !== 'undefined') {
        window.addEventListener('keydown', (e) => {
          if (e.key === 'm' || e.key === 'M') {
            isMuted = !isMuted;
            if (masterGain && audioCtx) {
              masterGain.gain.setValueAtTime(isMuted ? 0 : 1, audioCtx.currentTime);
            }
          }
        });
      }

      class Terrain {
        constructor() {
          this.heights = new Float32Array(CONST.WORLD_W);
        }

        generate(seed) {
          rng.seed(seed);
          const minH = CONST.WORLD_H * 0.15;
          const maxH = CONST.WORLD_H * 0.80;

          // Standard midpoint displacement for 1D
          const heights = this.heights;
          const N = heights.length;

          heights[0] = rng.range(minH + (maxH - minH) * 0.2, maxH - (maxH - minH) * 0.2);
          heights[N - 1] = rng.range(minH + (maxH - minH) * 0.2, maxH - (maxH - minH) * 0.2);

          // Roughness controls the initial displacement size
          let roughness = 0.35;

          function displace(left, right, r) {
            if (right - left <= 1) return;
            const mid = Math.floor((left + right) / 2);
            // Height is the average of endpoints + random offset proportional to interval length
            const avg = (heights[left] + heights[right]) / 2;
            const rangeVal = (right - left) * r;
            const offset = rng.range(-rangeVal, rangeVal);
            heights[mid] = avg + offset;

            displace(left, mid, r * 0.55);
            displace(mid, right, r * 0.55);
          }

          displace(0, N - 1, roughness);

          // Smoothing pass: 5-point moving average, run 4 times
          const temp = new Float32Array(N);
          for (let pass = 0; pass < 4; pass++) {
            for (let i = 0; i < N; i++) {
              let sum = 0;
              let count = 0;
              for (let di = -2; di <= 2; di++) {
                const idx = i + di;
                if (idx >= 0 && idx < N) {
                  sum += heights[idx];
                  count++;
                }
              }
              temp[i] = sum / count;
            }
            heights.set(temp);
          }

          // Clamp to safety range
          for (let i = 0; i < N; i++) {
            if (heights[i] < minH) heights[i] = minH;
            if (heights[i] > maxH) heights[i] = maxH;
          }
        }

        heightAt(x) {
          const N = this.heights.length;
          // Clamped lookup
          const cx = Math.max(0, Math.min(N - 1, x));
          const x0 = Math.floor(cx);
          const x1 = Math.min(N - 1, x0 + 1);
          const t = cx - x0;
          return this.heights[x0] * (1 - t) + this.heights[x1] * t;
        }

        carve(x, y, r) {
          const N = this.heights.length;
          const cy_height = CONST.WORLD_H - y;
          const startCol = Math.max(0, Math.floor(x - r));
          const endCol = Math.min(N - 1, Math.ceil(x + r));

          for (let col = startCol; col <= endCol; col++) {
            const dx = col - x;
            if (Math.abs(dx) < r) {
              const dy = Math.sqrt(r * r - dx * dx);
              const y1 = cy_height - dy;
              const y2 = cy_height + dy;
              if (this.heights[col] > y1) {
                const overlap = Math.min(this.heights[col], y2) - y1;
                if (overlap > 0) {
                  this.heights[col] -= overlap;
                }
              }
            }
          }
        }

        deposit(x, y, r) {
          const N = this.heights.length;
          const cy_height = CONST.WORLD_H - y;
          const startCol = Math.max(0, Math.floor(x - r));
          const endCol = Math.min(N - 1, Math.ceil(x + r));

          for (let col = startCol; col <= endCol; col++) {
            const dx = col - x;
            if (Math.abs(dx) < r) {
              const dy = Math.sqrt(r * r - dx * dx);
              const y1 = cy_height - dy;
              const y2 = cy_height + dy;
              const overlap = Math.max(0, y2 - Math.max(this.heights[col], y1));
              if (overlap > 0) {
                this.heights[col] += overlap;
              }
            }
          }
        }

        settle() {
          const N = this.heights.length;
          const max_slope = 1.0;
          // Perform multiple sliding passes to let soil flow down slopes
          for (let pass = 0; pass < 20; pass++) {
            let changed = false;
            for (let i = 0; i < N - 1; i++) {
              const diff = this.heights[i] - this.heights[i + 1];
              if (diff > max_slope) {
                const excess = diff - max_slope;
                const move = excess / 2;
                this.heights[i] -= move;
                this.heights[i + 1] += move;
                changed = true;
              } else if (diff < -max_slope) {
                const excess = -diff - max_slope;
                const move = excess / 2;
                this.heights[i] += move;
                this.heights[i + 1] -= move;
                changed = true;
              }
            }
            if (!changed) break;
          }

          // Finally, clamp every column back into range
          const minH = CONST.WORLD_H * 0.15;
          const maxH = CONST.WORLD_H * 0.80;
          for (let i = 0; i < N; i++) {
            if (this.heights[i] < minH) this.heights[i] = minH;
            if (this.heights[i] > maxH) this.heights[i] = maxH;
          }
        }

        draw(ctx) {
          if (!ctx) return;

          // Sky gradient
          const skyGrad = ctx.createLinearGradient(0, 0, 0, CONST.WORLD_H);
          skyGrad.addColorStop(0, '#020010');
          skyGrad.addColorStop(1, '#1b1b3a');
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, CONST.WORLD_W, CONST.WORLD_H);

          // Ground fill: darker body
          ctx.beginPath();
          ctx.moveTo(0, CONST.WORLD_H);
          for (let i = 0; i < this.heights.length; i++) {
            ctx.lineTo(i, CONST.WORLD_H - this.heights[i]);
          }
          ctx.lineTo(CONST.WORLD_W, CONST.WORLD_H);
          ctx.closePath();

          const groundGrad = ctx.createLinearGradient(0, CONST.WORLD_H * 0.15, 0, CONST.WORLD_H);
          groundGrad.addColorStop(0, '#5a3d28');
          groundGrad.addColorStop(1, '#1f140c');
          ctx.fillStyle = groundGrad;
          ctx.fill();

          // Ground surface line: lighter surface line
          ctx.beginPath();
          ctx.moveTo(0, CONST.WORLD_H - this.heights[0]);
          for (let i = 1; i < this.heights.length; i++) {
            ctx.lineTo(i, CONST.WORLD_H - this.heights[i]);
          }
          ctx.strokeStyle = '#2d8a2d';
          ctx.lineWidth = 3;
          ctx.stroke();
        }
      }

      class Game {
        constructor(opts = {}) {
          this.headless = !!opts.headless;
          this.seed = opts.seed !== undefined ? opts.seed : 42;
          this.roundState = {
            ticks: 0
          };

          this.projectiles = [];
          this.terrain = new Terrain();
          this.newRound(this.seed);

          if (!this.headless) {
            if (typeof document !== 'undefined') {
              this.canvas = document.getElementById('game');
              this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
              if (typeof window !== 'undefined') {
                window.addEventListener('resize', () => resize());
                resize();
              }
              this.setupInput();
            }

            // Particle pool initialization (600 particles hard cap)
            this.particlePool = Array.from({ length: 600 }, () => ({
              active: false,
              x: 0,
              y: 0,
              vx: 0,
              vy: 0,
              color: '#ffffff',
              life: 0,
              maxLife: 0,
              size: 2,
              type: '',
              bounces: 0
            }));
            this.explosions = [];
          }
        }

        get projectile() {
          return this.projectiles && this.projectiles.length > 0 ? this.projectiles[0] : null;
        }

        set projectile(val) {
          if (!this.projectiles) {
            this.projectiles = [];
          }
          if (val === null) {
            this.projectiles = [];
          } else {
            this.projectiles = [val];
          }
        }

        setupInput() {
          window.addEventListener('keydown', (e) => {
            if (!this.roster || this.activePlayerIdx === undefined) return;
            const activeTank = this.roster[this.activePlayerIdx];
            if (!activeTank || activeTank.hp <= 0 || activeTank.type !== 'Human') return;
            if (this.projectile || this.anyTankFalling()) return; // Ignore while projectile is live or tanks are falling

            let changed = false;
            if (e.key === 'ArrowLeft') {
              const diff = e.shiftKey ? 5 : 1;
              activeTank.angle = Math.min(180, Math.max(0, activeTank.angle + diff));
              changed = true;
            } else if (e.key === 'ArrowRight') {
              const diff = e.shiftKey ? 5 : 1;
              activeTank.angle = Math.min(180, Math.max(0, activeTank.angle - diff));
              changed = true;
            } else if (e.key === 'ArrowUp') {
              const diff = e.shiftKey ? 25 : 5;
              activeTank.power = Math.min(1000, Math.max(0, activeTank.power + diff));
              changed = true;
            } else if (e.key === 'ArrowDown') {
              const diff = e.shiftKey ? 25 : 5;
              activeTank.power = Math.min(1000, Math.max(0, activeTank.power - diff));
              changed = true;
            } else if (e.key === ' ' || e.code === 'Space') {
              this.fireActiveWeapon();
              e.preventDefault();
            } else if (e.key === '[' || e.key === ']' || e.key === 'Tab') {
              this.cycleWeapon(e.key === '[' ? -1 : 1);
              e.preventDefault();
            }

            if (changed) {
              this.updateHUD();
            }
          });
        }

        fireActiveWeapon() {
          if (!this.roster || this.activePlayerIdx === undefined) return;
          const activeTank = this.roster[this.activePlayerIdx];
          if (!activeTank || activeTank.hp <= 0 || this.projectile) return;

          // Check ammo if any (here infinite for Baby Missile)
          const weapon = activeTank.selectedWeapon || 'Baby Missile';
          const ammo = activeTank.inventory[weapon];
          if (ammo !== undefined && ammo <= 0) return;

          if (ammo !== undefined && ammo !== Infinity) {
            activeTank.inventory[weapon]--;
          }

          const angleRad = (activeTank.angle * Math.PI) / 180;
          const barrelLen = 12;
          const startX = activeTank.x + barrelLen * Math.cos(angleRad);
          const startY = activeTank.y - 6 - barrelLen * Math.sin(angleRad);

          // Velocity is proportional to power
          const vx = activeTank.power * Math.cos(angleRad);
          const vy = -activeTank.power * Math.sin(angleRad);

          this.projectile = {
            x: startX,
            y: startY,
            vx: vx,
            vy: vy,
            weapon: weapon,
            shooterIdx: this.activePlayerIdx
          };

          if (!this.headless) {
            sfx('launch');
          }
        }

        cycleWeapon(dir) {
          if (!this.roster || this.activePlayerIdx === undefined) return;
          const activeTank = this.roster[this.activePlayerIdx];
          if (!activeTank) return;

          const weapons = Object.keys(activeTank.inventory);
          if (weapons.length <= 1) return;

          let idx = weapons.indexOf(activeTank.selectedWeapon);
          idx = (idx + dir + weapons.length) % weapons.length;
          activeTank.selectedWeapon = weapons[idx];
          this.updateHUD();
        }

        newRound(roundSeed) {
          this.seed = roundSeed;
          this.roundOver = false;
          this.terrain.generate(roundSeed);
          this.persistentTracers = [];
          // Regenerate wind: signed horizontal acceleration, let's say between -150 and 150
          this.wind = rng.range(-150, 150);

          if (!this.headless) {
            if (this.particlePool) {
              this.particlePool.forEach(p => { p.active = false; });
            }
            if (this.explosions) {
              this.explosions.length = 0;
            }
          }
        }

        snapTanksToTerrain() {
          if (!this.roster) return;
          this.roster.forEach(tank => {
            tank.y = CONST.WORLD_H - this.terrain.heightAt(tank.x);
          });
        }

        updateHUD() {
          if (this.headless) return;
          const hud = document.getElementById('hud');
          if (!hud) return;

          if (!this.roster || this.activePlayerIdx === undefined) {
            hud.textContent = 'No active player';
            return;
          }

          const activeTank = this.roster[this.activePlayerIdx];
          if (!activeTank) {
            hud.textContent = 'No active player';
            return;
          }

          const weapon = activeTank.selectedWeapon || 'Baby Missile';
          const ammoVal = activeTank.inventory[weapon];
          const ammoStr = ammoVal === Infinity ? 'INF' : ammoVal;

          const windSpeed = Math.round(Math.abs(this.wind || 0));
          const windDir = (this.wind || 0) < 0 ? '←' : '→';

          // Inline styling using helper elements or just setting textContent in a safe and structured way
          // Let's create static sub-elements once or update textContent using an elegant formatting scheme.
          // To ensure we update textContent with inline styles only, never rebuilding innerHTML per frame:
          // We can construct text contents for specific parts, or structure hud cleanly.
          // Let's check how the instructions specify: "fill #hud with the active tank's name in its colour, hp, angle, power, selected weapon with remaining ammo, cash, wind as a direction arrow beside its speed value, plus a compact controls legend. updateHUD() writes textContent with inline styles only, never rebuilding innerHTML per frame, returning immediately when headless. Call it on every input, on every turn change."
          // Since we want inline styles (like text color), we can create sub elements in DOMContentLoaded or lazily if not present, and update their textContent. Let's do lazy creation of sub-span elements inside #hud if #hud is empty or has wrong children. This is extremely fast and avoids innerHTML rebuilds.

          let nameSpan = hud.querySelector('.hud-name');
          let hpSpan = hud.querySelector('.hud-hp');
          let angleSpan = hud.querySelector('.hud-angle');
          let powerSpan = hud.querySelector('.hud-power');
          let weaponSpan = hud.querySelector('.hud-weapon');
          let cashSpan = hud.querySelector('.hud-cash');
          let windSpan = hud.querySelector('.hud-wind');
          let legendSpan = hud.querySelector('.hud-legend');

          if (!nameSpan) {
            hud.innerHTML = ''; // Initial clear

            nameSpan = document.createElement('span');
            nameSpan.className = 'hud-name';
            nameSpan.style.fontWeight = 'bold';
            nameSpan.style.marginRight = '15px';

            hpSpan = document.createElement('span');
            hpSpan.className = 'hud-hp';
            hpSpan.style.marginRight = '15px';

            angleSpan = document.createElement('span');
            angleSpan.className = 'hud-angle';
            angleSpan.style.marginRight = '15px';

            powerSpan = document.createElement('span');
            powerSpan.className = 'hud-power';
            powerSpan.style.marginRight = '15px';

            weaponSpan = document.createElement('span');
            weaponSpan.className = 'hud-weapon';
            weaponSpan.style.marginRight = '15px';

            cashSpan = document.createElement('span');
            cashSpan.className = 'hud-cash';
            cashSpan.style.marginRight = '15px';

            windSpan = document.createElement('span');
            windSpan.className = 'hud-wind';
            windSpan.style.marginRight = '15px';

            legendSpan = document.createElement('span');
            legendSpan.className = 'hud-legend';
            legendSpan.style.color = '#888';
            legendSpan.style.fontSize = '12px';
            legendSpan.style.marginLeft = 'auto';

            hud.appendChild(nameSpan);
            hud.appendChild(hpSpan);
            hud.appendChild(angleSpan);
            hud.appendChild(powerSpan);
            hud.appendChild(weaponSpan);
            hud.appendChild(cashSpan);
            hud.appendChild(windSpan);
            hud.appendChild(legendSpan);
          }

          nameSpan.textContent = activeTank.name.toUpperCase();
          nameSpan.style.color = activeTank.color;

          hpSpan.textContent = `HP: ${activeTank.hp}`;
          angleSpan.textContent = `ANG: ${activeTank.angle}°`;
          powerSpan.textContent = `PWR: ${activeTank.power}`;
          weaponSpan.textContent = `WEAP: ${weapon} (${ammoStr})`;
          cashSpan.textContent = `CASH: $${activeTank.cash}`;
          windSpan.textContent = `WIND: ${windDir} ${windSpeed}`;

          legendSpan.textContent = 'L/R: Angle | U/D: Power | Space: Fire | [/]: Weapon | Shift: Coarse';
        }

        start(config) {
          this.config = config;
          this.currentRound = 1;
          this.rounds = config.rounds !== undefined ? config.rounds : 5;
          this.wallType = config.wallType || 'off';
          this.startingCash = config.startingCash !== undefined ? config.startingCash : 10000;

          // Begin round 1 (generates terrain and seeds RNG)
          this.newRound(this.seed);

          // Build roster using the newly-seeded generator
          const players = config.players || [];
          const N = players.length;
          const zoneW = CONST.WORLD_W / N;
          const margin = 40;

          this.roster = players.map((p, i) => {
            const minX = zoneW * i + margin;
            const maxX = zoneW * (i + 1) - margin;
            const x = rng.range(minX, maxX);
            return {
              name: p.name,
              color: p.color,
              type: p.type,
              hp: 100,
              angle: 45,
              power: 500,
              cash: this.startingCash,
              inventory: { 'Baby Missile': Infinity },
              selectedWeapon: 'Baby Missile',
              shield: null,
              x: x,
              y: 0,
              damageDealt: 0,
              kills: 0
            };
          });

          this.snapTanksToTerrain();
          this.activePlayerIdx = 0;
          this.projectile = null; // Will store active projectile { x, y, vx, vy, ... }
          this.raiseShieldForActivePlayer();

          if (!this.headless && typeof document !== 'undefined') {
            const setupEl = document.getElementById('setup');
            if (setupEl) {
              setupEl.hidden = true;
            }
            this.updateHUD();
          }
        }

        raiseShieldForActivePlayer() {
          if (!this.roster || this.activePlayerIdx === undefined) return;
          const activeTank = this.roster[this.activePlayerIdx];
          if (!activeTank || activeTank.hp <= 0) return;

          // Battery logic: "Battery restoring hp or recharging a raised shield."
          if (activeTank.inventory && activeTank.inventory['Battery'] > 0) {
            if (activeTank.shield && activeTank.shield.hp < (activeTank.shield.type === 'Heavy Shield' ? 200 : (activeTank.shield.type === 'Magnetic Shield' ? 150 : 100))) {
              activeTank.shield.hp = Math.min(
                activeTank.shield.type === 'Heavy Shield' ? 200 : (activeTank.shield.type === 'Magnetic Shield' ? 150 : 100),
                activeTank.shield.hp + 50
              );
              activeTank.inventory['Battery']--;
            } else if (activeTank.hp < 100) {
              activeTank.hp = Math.min(100, activeTank.hp + 30);
              activeTank.inventory['Battery']--;
            }
          }

          // Raise shield from inventory if none is active
          if (!activeTank.shield || activeTank.shield.hp <= 0) {
            activeTank.shield = null;
            if (activeTank.inventory) {
              if (activeTank.inventory['Heavy Shield'] > 0) {
                activeTank.shield = { type: 'Heavy Shield', hp: 200 };
                activeTank.inventory['Heavy Shield']--;
              } else if (activeTank.inventory['Magnetic Shield'] > 0) {
                activeTank.shield = { type: 'Magnetic Shield', hp: 150 };
                activeTank.inventory['Magnetic Shield']--;
              } else if (activeTank.inventory['Shield'] > 0) {
                activeTank.shield = { type: 'Shield', hp: 100 };
                activeTank.inventory['Shield']--;
              }
            }
          }
        }

        nextTurn() {
          if (!this.roster || this.roster.length === 0) return;
          let nextIdx = this.activePlayerIdx;
          for (let i = 0; i < this.roster.length; i++) {
            nextIdx = (nextIdx + 1) % this.roster.length;
            if (this.roster[nextIdx].hp > 0) {
              this.activePlayerIdx = nextIdx;
              this.raiseShieldForActivePlayer();
              this.updateHUD();
              this.aiTimer = 0;
              return;
            }
          }
          this.updateHUD();
          this.aiTimer = 0;
        }

        checkAIShot() {
          if (!this.roster || this.activePlayerIdx === undefined) return;
          const activeTank = this.roster[this.activePlayerIdx];
          if (activeTank && activeTank.hp > 0 && activeTank.type !== 'Human' && !this.projectile) {
            // Find nearest living opponent
            let target = null;
            let minDist = Infinity;
            this.roster.forEach((tank, idx) => {
              if (idx !== this.activePlayerIdx && tank.hp > 0) {
                const dist = Math.hypot(tank.x - activeTank.x, tank.y - activeTank.y);
                if (dist < minDist) {
                  minDist = dist;
                  target = tank;
                }
              }
            });

            if (!target) return; // No targets available

            const isRight = target.x > activeTank.x;

            if (activeTank.type === 'Moron') {
              const baseAngle = isRight ? 45 : 135;
              const angle = baseAngle + rng.range(-35, 35);
              const power = rng.range(300, 700);
              activeTank.angle = Math.round(Math.min(180, Math.max(0, angle)));
              activeTank.power = Math.round(Math.min(1000, Math.max(0, power)));
            } else if (activeTank.type === 'Shooter') {
              const dx = target.x - activeTank.x;
              const dy = (target.y - 3) - (activeTank.y - 6);
              const startAngles = dx > 0 ? [60, 55, 65, 50, 70, 45, 75, 40, 80, 35, 85] : [120, 125, 115, 130, 110, 135, 105, 140, 100, 145, 95];
              let solvedAngle = null;
              let solvedPower = null;
              const g = CONST.GRAVITY;

              for (let angle of startAngles) {
                const angleRad = (angle * Math.PI) / 180;
                const T = Math.tan(angleRad);
                const denom = dy + dx * T;
                if (denom > 0) {
                  const v2 = (g * dx * dx * (1 + T * T)) / (2 * denom);
                  if (v2 > 0) {
                    const v = Math.sqrt(v2);
                    if (v >= 200 && v <= 1000) {
                      solvedAngle = angle;
                      solvedPower = v;
                      break;
                    }
                  }
                }
              }

              if (solvedAngle === null) {
                solvedAngle = dx > 0 ? 45 : 135;
                solvedPower = 500;
              }

              activeTank.angle = Math.round(Math.min(180, Math.max(0, solvedAngle + rng.range(-4, 4))));
              activeTank.power = Math.round(Math.min(1000, Math.max(0, solvedPower + rng.range(-15, 15))));
            } else if (activeTank.type === 'Poolshark') {
              let dx = target.x - activeTank.x;
              const dy = (target.y - 3) - (activeTank.y - 6);
              if (this.wallType === 'rubber') {
                if (target.x > activeTank.x) {
                  dx = -target.x - activeTank.x;
                } else {
                  dx = (2 * CONST.WORLD_W - target.x) - activeTank.x;
                }
              }

              const shootRight = dx > 0;
              const startAngles = shootRight ? [60, 55, 65, 50, 70, 45, 75, 40, 80, 35, 85] : [120, 125, 115, 130, 110, 135, 105, 140, 100, 145, 95];
              let solvedAngle = null;
              let solvedPower = null;
              const g = CONST.GRAVITY;

              for (let angle of startAngles) {
                const angleRad = (angle * Math.PI) / 180;
                const T = Math.tan(angleRad);
                const denom = dy + dx * T;
                if (denom > 0) {
                  const v2 = (g * dx * dx * (1 + T * T)) / (2 * denom);
                  if (v2 > 0) {
                    const v = Math.sqrt(v2);
                    if (v >= 200 && v <= 1000) {
                      solvedAngle = angle;
                      solvedPower = v;
                      break;
                    }
                  }
                }
              }

              if (solvedAngle === null) {
                solvedAngle = shootRight ? 45 : 135;
                solvedPower = 500;
              }

              activeTank.angle = Math.round(Math.min(180, Math.max(0, solvedAngle + rng.range(-2, 2))));
              activeTank.power = Math.round(Math.min(1000, Math.max(0, solvedPower + rng.range(-10, 10))));
            } else if (activeTank.type === 'Cyborg') {
              // Select the most damaging affordable weapon from inventory
              let bestWeaponId = 'Baby Missile';
              let maxDamage = 0;
              for (const weaponId in activeTank.inventory) {
                if (activeTank.inventory[weaponId] > 0) {
                  const wConf = WEAPONS.find(w => w.id === weaponId);
                  if (wConf && wConf.damage > maxDamage) {
                    maxDamage = wConf.damage;
                    bestWeaponId = weaponId;
                  }
                }
              }
              activeTank.selectedWeapon = bestWeaponId;

              // Apply telemetry correction
              let aimX = target.x;
              if (activeTank.telemetry && activeTank.telemetry[target.name]) {
                const tel = activeTank.telemetry[target.name];
                const errorX = tel.landX - tel.aimX;
                aimX = target.x - errorX;
              }
              activeTank.lastTargetName = target.name;
              activeTank.lastAimX = aimX;

              const dx = aimX - activeTank.x;
              const dy = (target.y - 3) - (activeTank.y - 6);
              const shootRight = dx > 0;
              const startAngles = shootRight ? [60, 55, 65, 50, 70, 45, 75, 40, 80, 35, 85] : [120, 125, 115, 130, 110, 135, 105, 140, 100, 145, 95];
              let solvedAngle = null;
              let solvedPower = null;
              const aw = this.wind || 0;
              const g = CONST.GRAVITY;

              for (let angle of startAngles) {
                const angleRad = (angle * Math.PI) / 180;
                const T = Math.tan(angleRad);
                const denom = g + aw * T;
                const numer = dy + dx * T;
                if (denom > 0 && numer > 0) {
                  const t2 = (2 * numer) / denom;
                  if (t2 > 0) {
                    const t = Math.sqrt(t2);
                    const vx = dx / t - 0.5 * aw * t;
                    if ((shootRight && vx > 0) || (!shootRight && vx < 0)) {
                      const vy = -vx * T;
                      const v = Math.sqrt(vx * vx + vy * vy);
                      if (v >= 200 && v <= 1000) {
                        solvedAngle = angle;
                        solvedPower = v;
                        break;
                      }
                    }
                  }
                }
              }

              if (solvedAngle === null) {
                solvedAngle = shootRight ? 45 : 135;
                solvedPower = 500;
              }

              activeTank.angle = Math.round(solvedAngle);
              activeTank.power = Math.round(solvedPower);
            }

            this.fireActiveWeapon();
          }
        }

        // Auto Defense: when a shield collapses, immediately raise the best
        // replacement still in inventory. Called from every path that can drop a
        // shield to zero (blast damage, napalm burn, magnetic deflection).
        raiseAutoDefenseShield(tank) {
          if (!tank.inventory || !(tank.inventory['Auto Defense'] > 0)) return;
          if (tank.inventory['Heavy Shield'] > 0) {
            tank.shield = { type: 'Heavy Shield', hp: 200 };
            tank.inventory['Heavy Shield']--;
          } else if (tank.inventory['Magnetic Shield'] > 0) {
            tank.shield = { type: 'Magnetic Shield', hp: 150 };
            tank.inventory['Magnetic Shield']--;
          } else if (tank.inventory['Shield'] > 0) {
            tank.shield = { type: 'Shield', hp: 100 };
            tank.inventory['Shield']--;
          }
        }

        // Single entry point for damaging a tank. Every damage source must route
        // through here so shield absorption, Auto Defense and score accounting stay
        // consistent. Returns true if this hit is what killed the tank.
        applyDamageToTank(tank, amount, shooter) {
          if (!tank || tank.hp <= 0) return false;

          let remaining = Math.max(0, amount);
          if (remaining <= 0) return false;

          // Damage dealt counts the full hit, including whatever the shield eats
          if (shooter) {
            shooter.damageDealt = (shooter.damageDealt || 0) + remaining;
          }

          // Shield damage absorption
          if (tank.shield && tank.shield.hp > 0) {
            const shieldDmg = Math.min(tank.shield.hp, remaining);
            tank.shield.hp -= shieldDmg;
            remaining -= shieldDmg;
            if (tank.shield.hp <= 0) {
              tank.shield = null;
              this.raiseAutoDefenseShield(tank);
            }
          }

          const prevHp = tank.hp;
          tank.hp = Math.max(0, tank.hp - remaining);

          // Mark dead and credit kill
          if (prevHp > 0 && tank.hp <= 0) {
            if (shooter) {
              shooter.kills = (shooter.kills || 0) + 1;
            }
            return true;
          }
          return false;
        }

        explosion(x, y, radius, damage, shooterIdx) {
          // 1. Carve terrain
          this.terrain.carve(x, y, radius);

          // Track newly killed tanks to trigger chain reaction explosions
          const deadTanksToExplode = [];

          // 2. Apply falloff damage to every tank inside the radius
          if (this.roster) {
            const shooter = (shooterIdx !== undefined && shooterIdx !== null) ? this.roster[shooterIdx] : null;

            this.roster.forEach((tank, idx) => {
              if (tank.hp <= 0) return;

              // Distance from explosion center (x, y) to tank center (tank.x, tank.y - 3)
              const dx = tank.x - x;
              const dy = (tank.y - 3) - y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < radius) {
                const dmg = damage * (1 - dist / radius);
                const clampedDmg = Math.max(0, dmg);

                if (this.applyDamageToTank(tank, clampedDmg, shooter)) {
                  deadTanksToExplode.push({ tank, idx });
                }
              }
            });
          }

          // 3. Audio/Visual effects
          if (!this.headless) {
            sfx('explode', { radius });

            // Push expanding fireball ring
            if (this.explosions) {
              this.explosions.push({
                x: x,
                y: y,
                maxRadius: radius,
                currentRadius: 0,
                life: 0.5,
                maxLife: 0.5
              });
            }

            // Spawn smoke and debris particles
            this.spawnCraterEffects(x, y, radius);
          }

          // 4. Chain reactions: dead tanks explode sequentially
          deadTanksToExplode.forEach(item => {
            this.explosion(item.tank.x, item.tank.y - 3, 35, 50, shooterIdx);
          });
        }

        reSeatTanks() {
          if (!this.roster) return;
          this.roster.forEach(tank => {
            if (tank.hp <= 0) return;
            const groundY = CONST.WORLD_H - this.terrain.heightAt(tank.x);
            if (tank.y < groundY - 0.01) {
              tank.falling = true;
              if (tank.vy === undefined || tank.vy === null) {
                tank.vy = 0;
              }
            } else {
              tank.y = groundY;
              tank.falling = false;
              tank.vy = 0;
            }
          });
        }

        onImpact(x, y, weapon, shooterIdx) {
          if (shooterIdx !== undefined && this.roster) {
            const shooter = this.roster[shooterIdx];
            if (shooter && shooter.type === 'Cyborg' && shooter.lastTargetName) {
              shooter.telemetry = shooter.telemetry || {};
              shooter.telemetry[shooter.lastTargetName] = {
                aimX: shooter.lastAimX,
                landX: x
              };
            }
          }

          const wp = weapon || 'Baby Missile';
          // Find weapon config
          const wConf = WEAPONS.find(w => w.id === wp) || { blast: 30, damage: 60 };
          let radius = wConf.blast;
          let damage = wConf.damage;

          // Helper/Sub projectiles
          if (wp === 'MIRV Sub') { radius = 25; damage = 50; }
          else if (wp === "Death's Head Sub") { radius = 35; damage = 70; }
          else if (wp === 'Cluster Bomblet') { radius = 12; damage = 24; }
          else if (wp === 'Funky Bomblet') { radius = 15; damage = 30; }

          this.lastShooterIdx = shooterIdx;

          // Perform specific actions based on weapon type
          if (wp === 'Dirt Bomb') {
            this.terrain.deposit(x, y, radius);
            if (!this.headless) {
              sfx('explode', { radius });
              this.spawnCraterEffects(x, y, radius);
            }
          } else if (wp === 'Dirt Detonator') {
            // collapse deposited dirt: flatten heights within radius 40
            const collapseRadius = 40;
            const startCol = Math.max(0, Math.floor(x - collapseRadius));
            const endCol = Math.min(CONST.WORLD_W - 1, Math.ceil(x + collapseRadius));
            for (let col = startCol; col <= endCol; col++) {
              const dx = col - x;
              if (Math.abs(dx) < collapseRadius) {
                this.terrain.heights[col] = Math.max(CONST.WORLD_H * 0.15, this.terrain.heights[col] - 25 * (1 - Math.abs(dx) / collapseRadius));
              }
            }
            this.explosion(x, y, radius, damage, shooterIdx);
          } else if (wp === 'Sandstorm') {
            // redistributing terrain
            const redistributionRadius = 200;
            const startCol = Math.max(0, Math.floor(x - redistributionRadius));
            const endCol = Math.min(CONST.WORLD_W - 1, Math.ceil(x + redistributionRadius));
            const copy = new Float32Array(this.terrain.heights);
            for (let col = startCol; col <= endCol; col++) {
              const shift = Math.round((this.wind || 0) * 0.15 + Math.sin(col * 0.05) * 12);
              const srcCol = Math.max(0, Math.min(CONST.WORLD_W - 1, col - shift));
              this.terrain.heights[col] = copy[srcCol];
            }
            if (!this.headless) {
              sfx('explode', { radius: 50 });
            }
          } else if (wp === 'Tracer') {
            // Tracer deals exactly zero damage and zero blast
          } else {
            // standard explosion
            this.explosion(x, y, radius, damage, shooterIdx);
          }

          this.terrain.settle();
          this.reSeatTanks();

          // Spawning post-impact sub-projectiles (e.g. Cluster Bomb / Funky Bomb / Liquid)
          if (wp === 'Cluster Bomb') {
            for (let i = 0; i < 5; i++) {
              const angle = Math.PI * (0.2 + 0.6 * (i / 4));
              const speed = rng.range(120, 200);
              const vx = speed * Math.cos(angle);
              const vy = -speed * Math.sin(angle);
              this.projectiles.push({
                x: x,
                y: y - 5,
                vx: vx,
                vy: vy,
                weapon: 'Cluster Bomblet',
                shooterIdx: shooterIdx
              });
            }
          } else if (wp === 'Funky Bomb') {
            for (let i = 0; i < 4; i++) {
              const angle = Math.PI * (0.2 + 0.6 * (i / 3));
              const speed = rng.range(120, 200);
              const vx = speed * Math.cos(angle);
              const vy = -speed * Math.sin(angle);
              this.projectiles.push({
                x: x,
                y: y - 5,
                vx: vx,
                vy: vy,
                weapon: 'Funky Bomblet',
                timer: 120,
                bounces: 0,
                shooterIdx: shooterIdx
              });
            }
          } else if (wp === 'Napalm' || wp === 'Hot Napalm' || wp === 'Liquid Dirt') {
            const subWeapon = wp === 'Napalm' ? 'Napalm Particle' : (wp === 'Hot Napalm' ? 'Hot Napalm Particle' : 'Liquid Dirt Particle');
            for (let i = 0; i < 15; i++) {
              const angle = Math.PI * (0.1 + 0.8 * (i / 14));
              const speed = rng.range(50, 150);
              const vx = speed * Math.cos(angle);
              const vy = -speed * Math.sin(angle);
              this.projectiles.push({
                x: x,
                y: y - 5,
                vx: vx,
                vy: vy,
                weapon: subWeapon,
                shooterIdx: shooterIdx,
                timer: 120,
                liquid: true
              });
            }
          }

          if (this.config && typeof this.config.onImpact === 'function') {
            this.config.onImpact(x, y);
          }
        }

        anyTankFalling() {
          if (!this.roster) return false;
          return this.roster.some(tank => tank.hp > 0 && tank.falling);
        }

        stepPhysics(dt) {
          if (this.roundOver) return;
          this.roundState.ticks++;

          // Update falling tanks
          if (this.roster) {
            this.roster.forEach(tank => {
              if (tank.hp <= 0) return;
              const groundY = CONST.WORLD_H - this.terrain.heightAt(tank.x);

              if (tank.y < groundY - 0.01) {
                if (!tank.falling) {
                  tank.falling = true;
                  tank.vy = 0;
                }
                tank.vy += CONST.GRAVITY * dt;
                tank.y += tank.vy * dt;

                const newGroundY = CONST.WORLD_H - this.terrain.heightAt(tank.x);
                if (tank.y >= newGroundY) {
                  tank.y = newGroundY;
                  tank.falling = false;
                  const impactVy = tank.vy;
                  tank.vy = 0;

                  // Parachute consumption check defensively
                  const hasParachute = tank.inventory && tank.inventory['Parachute'] > 0;
                  if (hasParachute) {
                    tank.inventory['Parachute']--;
                  } else {
                    // Drop damage proportional to impact velocity, capped
                    const dropDmg = Math.min(80, Math.max(0, impactVy * 0.15));
                    if (dropDmg > 5) {
                      const prevHp = tank.hp;
                      tank.hp = Math.max(0, tank.hp - dropDmg);
                      if (prevHp > 0 && tank.hp <= 0) {
                        if (this.lastShooterIdx !== undefined && this.roster[this.lastShooterIdx]) {
                          this.roster[this.lastShooterIdx].kills = (this.roster[this.lastShooterIdx].kills || 0) + 1;
                        }
                      }
                    }
                  }
                }
              } else {
                if (tank.y > groundY) {
                  tank.y = groundY;
                }
                tank.falling = false;
                tank.vy = 0;
              }
            });
          }

          // If active player is dead, skip to next living player
          if (this.roster && this.activePlayerIdx !== undefined) {
            const activeTank = this.roster[this.activePlayerIdx];
            if (activeTank && activeTank.hp <= 0) {
              this.nextTurn();
            }
          }

          // If no projectile is live, and the active player is AI, trigger its shot deterministically
          if (!this.projectile && !this.anyTankFalling() && this.roster && this.activePlayerIdx !== undefined) {
            const activeTank = this.roster[this.activePlayerIdx];
            if (activeTank && activeTank.hp > 0 && activeTank.type !== 'Human') {
              if (this.headless) {
                this.checkAIShot();
              } else {
                if (this.aiTimer === undefined) {
                  this.aiTimer = 0;
                }
                this.aiTimer += dt;
                if (this.aiTimer >= 0.7) {
                  this.checkAIShot();
                  this.aiTimer = 0;
                }
              }
            }
          }

          if (this.projectiles && this.projectiles.length > 0) {
            // Keep a copy because we might modify this.projectiles
            const activeProjs = [...this.projectiles];
            for (let pIdx = 0; pIdx < activeProjs.length; pIdx++) {
              const proj = activeProjs[pIdx];
              if (!this.projectiles.includes(proj)) continue;

              proj.flightTicks = (proj.flightTicks || 0) + 1;
              if (proj.flightTicks > 500) {
                this.projectiles = this.projectiles.filter(p => p !== proj);
                if (this.projectiles.length === 0) {
                  this.nextTurn();
                }
                continue;
              }

              // Normalize: the loop does name matching with .includes(), which throws
              // on a projectile spawned without a weapon name
              if (typeof proj.weapon !== 'string') proj.weapon = '';

              // 1. Check Roller custom downhill logic
              if (proj.rolling) {
                proj.x += proj.vx * dt;
                proj.y = CONST.WORLD_H - this.terrain.heightAt(proj.x);

                let detonate = false;
                if (proj.x < 0 || proj.x > CONST.WORLD_W) {
                  detonate = true;
                } else {
                  // Check local minimum
                  const hL = this.terrain.heightAt(proj.x - 2);
                  const hR = this.terrain.heightAt(proj.x + 2);
                  const hC = this.terrain.heightAt(proj.x);
                  if (proj.vx < 0 && hL >= hC) {
                    detonate = true;
                  } else if (proj.vx > 0 && hR >= hC) {
                    detonate = true;
                  }

                  // Check tank collision
                  if (this.roster) {
                    for (let i = 0; i < this.roster.length; i++) {
                      const tank = this.roster[i];
                      if (tank.hp > 0 && Math.abs(proj.x - tank.x) <= 8 && Math.abs(proj.y - tank.y) <= 8) {
                        detonate = true;
                        break;
                      }
                    }
                  }
                }

                if (detonate) {
                  this.projectiles = this.projectiles.filter(p => p !== proj);
                  this.onImpact(proj.x, proj.y, proj.weapon, proj.shooterIdx);
                  if (this.projectiles.length === 0) {
                    this.nextTurn();
                  }
                }
                continue;
              }

              // 2. Liquid Particle custom slide downhill logic
              if (proj.liquid) {
                proj.timer--;
                if (proj.timer <= 0) {
                  this.projectiles = this.projectiles.filter(p => p !== proj);
                  if (this.projectiles.length === 0) {
                    this.nextTurn();
                  }
                  continue;
                }

                const groundY = CONST.WORLD_H - this.terrain.heightAt(proj.x);
                if (proj.y < groundY - 1) {
                  // In air, apply gravity
                  proj.vy += CONST.GRAVITY * dt;
                  proj.x += proj.vx * dt;
                  proj.y += proj.vy * dt;
                } else {
                  // On ground, flow downhill
                  proj.y = groundY;
                  proj.vy = 0;
                  const hL = this.terrain.heightAt(proj.x - 2);
                  const hR = this.terrain.heightAt(proj.x + 2);
                  if (hL < hR) {
                    proj.vx = -60;
                  } else if (hR < hL) {
                    proj.vx = 60;
                  } else {
                    proj.vx = 0;
                  }
                  proj.x += proj.vx * dt;

                  // Deposit dirt for Liquid Dirt
                  if (proj.weapon === 'Liquid Dirt Particle') {
                    const tx = Math.floor(proj.x);
                    if (tx >= 0 && tx < CONST.WORLD_W) {
                      this.terrain.heights[tx] += 0.4;
                    }
                  } else if (proj.weapon.includes('Napalm')) {
                    // Napalm damage over time — routed through applyDamageToTank so the
                    // burn is absorbed by shields exactly like blast damage is
                    const burnDmg = proj.weapon.includes('Hot') ? 0.3 : 0.15;
                    const shooter = (proj.shooterIdx !== undefined && this.roster) ? this.roster[proj.shooterIdx] : null;
                    if (this.roster) {
                      this.roster.forEach(tank => {
                        if (tank.hp > 0 && Math.abs(proj.x - tank.x) < 12 && Math.abs(proj.y - tank.y) < 12) {
                          this.applyDamageToTank(tank, burnDmg, shooter);
                        }
                      });
                    }
                  }
                }

                // Visual trails
                if (!this.headless) {
                  const col = proj.weapon.includes('Liquid Dirt') ? '#735035' : '#ff5500';
                  this.spawnParticle('spark', proj.x, proj.y, visualRNG.range(-3, 3), visualRNG.range(-8, -2), col, 0.2, 1.5);
                }
                continue;
              }

              // 3. Funky Bomblet custom timer bounce logic
              if (proj.weapon === 'Funky Bomblet') {
                proj.timer--;
                if (proj.timer <= 0) {
                  this.projectiles = this.projectiles.filter(p => p !== proj);
                  this.onImpact(proj.x, proj.y, 'Funky Bomblet', proj.shooterIdx);
                  if (this.projectiles.length === 0) {
                    this.nextTurn();
                  }
                  continue;
                }
              }

              // 4. Trace line path recording
              if (proj.weapon === 'Tracer') {
                proj.path = proj.path || [];
                proj.path.push({ x: proj.x, y: proj.y });
              }

              // 5. Standard projectile gravity & wind integration
              const prevVy = proj.vy;
              proj.vy += CONST.GRAVITY * dt;
              proj.vx += (this.wind || 0) * dt;

              // Trajectory apex split trigger for MIRV and Death's Head
              if ((proj.weapon === 'MIRV' || proj.weapon === "Death's Head") && !proj.split && prevVy < 0 && proj.vy >= 0) {
                proj.split = true;
                this.projectiles = this.projectiles.filter(p => p !== proj);

                const numSub = proj.weapon === 'MIRV' ? 5 : 9;
                const subWeapon = proj.weapon === 'MIRV' ? 'MIRV Sub' : "Death's Head Sub";
                for (let i = 0; i < numSub; i++) {
                  const t = (i - (numSub - 1) / 2) / ((numSub - 1) / 2 || 1);
                  const sub_vx = proj.vx + t * 60;
                  const sub_vy = proj.vy + Math.abs(t) * 15;
                  this.projectiles.push({
                    x: proj.x,
                    y: proj.y,
                    vx: sub_vx,
                    vy: sub_vy,
                    weapon: subWeapon,
                    shooterIdx: proj.shooterIdx
                  });
                }
                continue;
              }

              const step_vx = proj.vx;
              const step_vy = proj.vy;
              const speed = Math.sqrt(step_vx * step_vx + step_vy * step_vy);
              const numSteps = Math.max(10, Math.ceil(speed * dt));
              const sdt = dt / numSteps;

              let impacted = false;

              for (let s = 0; s < numSteps; s++) {
                if (impacted || !this.projectiles.includes(proj)) break;

                proj.x += step_vx * sdt;
                proj.y += step_vy * sdt;

                // Spawn trail particle
                if (!this.headless) {
                  const col = visualRNG.choice(['#ff3300', '#ffaa00', '#ffff00', '#ff6600']);
                  const jx = visualRNG.range(-5, 5);
                  const jy = visualRNG.range(-5, 5);
                  this.spawnParticle(
                    'spark',
                    proj.x,
                    proj.y,
                    -step_vx * 0.05 + jx,
                    -step_vy * 0.05 + jy,
                    col,
                    visualRNG.range(0.2, 0.4),
                    visualRNG.range(1.0, 2.5)
                  );
                }

                // Walls boundaries
                if (this.wallType === 'off') {
                  if (proj.x < 0 || proj.x > CONST.WORLD_W) {
                    if (proj.weapon === 'Tracer' && proj.path) {
                      this.persistentTracers = this.persistentTracers || [];
                      this.persistentTracers.push(proj.path);
                    }
                    this.projectiles = this.projectiles.filter(p => p !== proj);
                    if (this.projectiles.length === 0) {
                      this.nextTurn();
                    }
                    impacted = true;
                    break;
                  }
                } else if (this.wallType === 'rubber') {
                  if (proj.x < 0) {
                    proj.vx = -proj.vx;
                    proj.x = -proj.x;
                    proj.bounces = (proj.bounces || 0) + 1;
                    if (!this.headless) sfx('bounce');
                  } else if (proj.x > CONST.WORLD_W) {
                    proj.vx = -proj.vx;
                    proj.x = CONST.WORLD_W - (proj.x - CONST.WORLD_W);
                    proj.bounces = (proj.bounces || 0) + 1;
                    if (!this.headless) sfx('bounce');
                  }
                } else if (this.wallType === 'wrap') {
                  proj.x = (proj.x % CONST.WORLD_W + CONST.WORLD_W) % CONST.WORLD_W;
                } else if (this.wallType === 'concrete') {
                  if (proj.x < 0) {
                    proj.vx = -proj.vx;
                    proj.x = -proj.x;
                    proj.bounces = (proj.bounces || 0) + 1;
                    if (!this.headless) sfx('bounce');
                  } else if (proj.x > CONST.WORLD_W) {
                    proj.vx = -proj.vx;
                    proj.x = CONST.WORLD_W - (proj.x - CONST.WORLD_W);
                    proj.bounces = (proj.bounces || 0) + 1;
                    if (!this.headless) sfx('bounce');
                  }
                  if (proj.y < 0) {
                    proj.vy = -proj.vy;
                    proj.y = -proj.y;
                    proj.bounces = (proj.bounces || 0) + 1;
                    if (!this.headless) sfx('bounce');
                  }
                }

                // Below screen bottom
                if (proj.y > CONST.WORLD_H) {
                  if (proj.weapon === 'Tracer' && proj.path) {
                    this.persistentTracers = this.persistentTracers || [];
                    this.persistentTracers.push(proj.path);
                  }
                  this.projectiles = this.projectiles.filter(p => p !== proj);
                  if (this.projectiles.length === 0) {
                    this.nextTurn();
                  }
                  impacted = true;
                  break;
                }

                // Terrain Collision
                const terrainX = Math.floor(proj.x);
                if (terrainX >= 0 && terrainX < CONST.WORLD_W) {
                  const groundY = CONST.WORLD_H - this.terrain.heightAt(proj.x);
                  if (proj.y >= groundY) {
                    // Check roller trigger
                    if (proj.weapon.includes('Roller') && !proj.rolling) {
                      proj.rolling = true;
                      proj.vy = 0;
                      proj.y = groundY;
                      const hL = this.terrain.heightAt(proj.x - 2);
                      const hR = this.terrain.heightAt(proj.x + 2);
                      proj.vx = hL < hR ? -80 : 80;
                      impacted = true;
                      break;
                    }

                    // Check Funky Bomblet bounce trigger
                    if (proj.weapon === 'Funky Bomblet') {
                      proj.vy = -Math.abs(proj.vy) * 0.6;
                      proj.vx *= 0.8;
                      proj.y = groundY - 2;
                      if (!this.headless) sfx('bounce');
                      impacted = true;
                      break;
                    }

                    // Normal impact
                    if (proj.weapon === 'Tracer' && proj.path) {
                      this.persistentTracers = this.persistentTracers || [];
                      this.persistentTracers.push(proj.path);
                    }
                    this.projectiles = this.projectiles.filter(p => p !== proj);
                    this.onImpact(proj.x, proj.y, proj.weapon, proj.shooterIdx);
                    if (this.projectiles.length === 0) {
                      this.nextTurn();
                    }
                    impacted = true;
                    break;
                  }
                }

                // Collision with tank hulls
                let hitTank = false;
                if (this.roster) {
                  for (let i = 0; i < this.roster.length; i++) {
                    const tank = this.roster[i];
                    if (tank.hp > 0) {
                      if (proj.x >= tank.x - 8 && proj.x <= tank.x + 8 &&
                          proj.y >= tank.y - 6 && proj.y <= tank.y) {

                        // Magnetic Shield Reflection check!
                        if (tank.shield && tank.shield.type === 'Magnetic Shield' && tank.shield.hp > 0) {
                          const dx = proj.x - tank.x;
                          const dy = proj.y - (tank.y - 3);
                          let dist = Math.sqrt(dx * dx + dy * dy);
                          if (dist === 0) dist = 1;
                          const nx = dx / dist;
                          const ny = dy / dist;
                          const dot = proj.vx * nx + proj.vy * ny;
                          proj.vx = proj.vx - 2 * dot * nx;
                          proj.vy = proj.vy - 2 * dot * ny;
                          proj.x = tank.x + nx * 12;
                          proj.y = (tank.y - 3) + ny * 12;
                          tank.shield.hp -= 50;
                          if (!this.headless) sfx('bounce');
                          if (tank.shield.hp <= 0) {
                            tank.shield = null;
                            this.raiseAutoDefenseShield(tank);
                          }
                          hitTank = false; // Reflected, don't detonate!
                          break;
                        } else {
                          // Normal impact on tank
                          if (proj.weapon === 'Tracer' && proj.path) {
                            this.persistentTracers = this.persistentTracers || [];
                            this.persistentTracers.push(proj.path);
                          }
                          this.projectiles = this.projectiles.filter(p => p !== proj);
                          this.onImpact(proj.x, proj.y, proj.weapon, proj.shooterIdx);
                          if (this.projectiles.length === 0) {
                            this.nextTurn();
                          }
                          hitTank = true;
                          impacted = true;
                          break;
                        }
                      }
                    }
                  }
                }
                if (hitTank) break;
              }
            }
          }

          if (!this.roundOver && this.projectiles.length === 0 && !this.anyTankFalling() && this.roster) {
            const livingTanks = this.roster.filter(t => t.hp > 0);
            if (livingTanks.length <= 1) {
              this.handleRoundEnd();
            }
          }
        }

        spawnParticle(type, x, y, vx, vy, color, maxLife, size) {
          if (this.headless || !this.particlePool) return;
          const p = this.particlePool.find(item => !item.active);
          if (!p) return; // Hard cap near 600 reached
          p.active = true;
          p.type = type;
          p.x = x;
          p.y = y;
          p.vx = vx;
          p.vy = vy;
          p.color = color;
          p.life = maxLife;
          p.maxLife = maxLife;
          p.size = size || 2;
          p.bounces = 0;
        }

        updateParticles(dt) {
          if (this.headless || !this.particlePool) return;
          for (let i = 0; i < this.particlePool.length; i++) {
            const p = this.particlePool[i];
            if (!p.active) continue;

            p.life -= dt;
            if (p.life <= 0) {
              p.active = false;
              continue;
            }

            if (p.type === 'spark') {
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vx *= 0.95;
              p.vy *= 0.95;
            } else if (p.type === 'smoke') {
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vy -= 10 * dt; // Smoke rises slightly
            } else if (p.type === 'debris') {
              p.vy += CONST.GRAVITY * dt;
              p.x += p.vx * dt;
              p.y += p.vy * dt;

              if (p.x < 0 || p.x > CONST.WORLD_W) {
                p.active = false;
                continue;
              }

              const groundY = CONST.WORLD_H - this.terrain.heightAt(p.x);
              if (p.y >= groundY) {
                p.y = groundY;
                p.vy = -p.vy * 0.4;
                p.vx *= 0.5;
                p.bounces++;
                if (Math.abs(p.vy) < 10 || p.bounces > 4) {
                  p.vy = 0;
                  p.vx = 0;
                  p.y = groundY;
                }
              }
            }
          }
        }

        drawParticles(ctx) {
          if (this.headless || !this.particlePool) return;
          for (let i = 0; i < this.particlePool.length; i++) {
            const p = this.particlePool[i];
            if (!p.active) continue;

            ctx.save();
            const alpha = Math.max(0, Math.min(1, p.life / p.maxLife));
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            if (p.type === 'smoke') {
              ctx.arc(p.x, p.y, p.size * (1 + (1 - p.life / p.maxLife) * 1.5), 0, Math.PI * 2);
            } else {
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            }
            ctx.fill();
            ctx.restore();
          }
        }

        spawnCraterEffects(x, y, radius) {
          if (this.headless) return;
          const smokeCount = Math.floor(radius / 2);
          for (let i = 0; i < smokeCount; i++) {
            const angle = visualRNG.range(0, Math.PI * 2);
            const r = visualRNG.range(0, radius * 0.8);
            const px = x + r * Math.cos(angle);
            const py = y + r * Math.sin(angle);

            const vx = visualRNG.range(-15, 15);
            const vy = visualRNG.range(-30, -10);

            const size = visualRNG.range(3, 8);
            const maxLife = visualRNG.range(0.8, 1.5);
            const colors = ['#555555', '#777777', '#999999', '#333333'];
            const color = visualRNG.choice(colors);

            this.spawnParticle('smoke', px, py, vx, vy, color, maxLife, size);
          }

          const debrisCount = Math.floor(radius / 3);
          for (let i = 0; i < debrisCount; i++) {
            const angle = visualRNG.range(-Math.PI * 0.8, -Math.PI * 0.2);
            const speed = visualRNG.range(50, 150);
            const vx = speed * Math.cos(angle);
            const vy = speed * Math.sin(angle);

            const maxLife = visualRNG.range(2.0, 4.0);
            const size = visualRNG.range(1.5, 3.5);
            const colors = ['#8b5a2b', '#5c3a21', '#3d2514', '#4a4a4a'];
            const color = visualRNG.choice(colors);

            this.spawnParticle('debris', x, y - 2, vx, vy, color, maxLife, size);
          }
        }

        updateExplosions(dt) {
          if (this.headless || !this.explosions) return;
          for (let i = this.explosions.length - 1; i >= 0; i--) {
            const exp = this.explosions[i];
            exp.life -= dt;
            const progress = 1 - (exp.life / exp.maxLife);
            exp.currentRadius = exp.maxRadius * progress;
            if (exp.life <= 0) {
              this.explosions.splice(i, 1);
            }
          }
        }

        drawExplosions(ctx) {
          if (this.headless || !this.explosions) return;
          for (let i = 0; i < this.explosions.length; i++) {
            const exp = this.explosions[i];
            ctx.save();
            const alpha = Math.max(0, Math.min(1, exp.life / exp.maxLife));
            ctx.globalAlpha = alpha;

            ctx.strokeStyle = '#ff3300';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(exp.x, exp.y, exp.currentRadius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#ffaa00';
            ctx.beginPath();
            ctx.arc(exp.x, exp.y, exp.currentRadius * 0.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(exp.x, exp.y, exp.currentRadius * 0.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
          }
        }

        update(dt) {
          if (this.roundOver) return;
          this.stepPhysics(dt);
          if (!this.headless) {
            this.updateParticles(dt);
            this.updateExplosions(dt);
          }
        }

        handleRoundEnd() {
          this.roundOver = true;

          // 1. Calculate and apply payouts
          if (this.roster) {
