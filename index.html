<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scorched Earth</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c0c0c;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    #hud {
      flex: 0 0 auto;
      height: 40px;
      background: #141414;
      border-bottom: 2px solid #333;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }
    #game {
      flex: 1 1 auto;
      display: block;
      width: 100%;
      height: calc(100% - 40px);
    }
    /* Setup Modal styling */
    #setup {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(12, 12, 12, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    #setup[hidden] {
      display: none !important;
    }
    .setup-container {
      background: #181818;
      border: 3px double #00ff00;
      padding: 20px;
      width: 90%;
      max-width: 650px;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
      max-height: 95vh;
      overflow-y: auto;
    }
    .setup-container h2 {
      margin-top: 0;
      text-align: center;
      color: #00ff00;
      border-bottom: 2px solid #00ff00;
      padding-bottom: 10px;
      letter-spacing: 2px;
    }
    .form-group {
      margin-bottom: 15px;
      display: flex;
      align-items: center;
    }
    .form-group label {
      width: 150px;
      color: #00ff00;
      font-weight: bold;
    }
    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group select {
      flex: 1;
      background: #000;
      border: 1px solid #00ff00;
      color: #00ff00;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    .form-group select option {
      background: #000;
      color: #00ff00;
    }
    .form-group input:focus,
    .form-group select:focus {
      box-shadow: 0 0 5px #00ff00;
    }
    .player-row {
      border: 1px dashed #333;
      padding: 10px;
      margin-bottom: 15px;
      background: #111;
    }
    .player-row .form-group {
      margin-bottom: 8px;
    }
    .player-row .form-group:last-child {
      margin-bottom: 0;
    }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      border-top: 2px solid #333;
      padding-top: 15px;
      margin-top: 15px;
    }
    .settings-grid .form-group {
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 0;
    }
    .settings-grid .form-group label {
      width: 100%;
      margin-bottom: 5px;
    }
    .settings-grid .form-group input,
    .settings-grid .form-group select {
      width: 100%;
    }
    .checkbox-group .radio-options {
      display: flex;
      gap: 15px;
      width: 100%;
      margin-top: 5px;
    }
    .checkbox-group .radio-options label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: normal;
      cursor: pointer;
      width: auto;
    }
    .checkbox-group input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border: 1px solid #00ff00;
      background: #000;
      display: inline-block;
      position: relative;
      cursor: pointer;
      outline: none;
    }
    .checkbox-group input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 6px;
      height: 6px;
      background: #00ff00;
    }
    .error-msg {
      color: #ff5555;
      text-align: center;
      font-weight: bold;
      margin: 15px 0;
      min-height: 20px;
    }
    #start-btn {
      display: block;
      width: 100%;
      background: #00ff00;
      color: #000;
      border: none;
      padding: 12px;
      font-family: inherit;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #start-btn:hover {
      background: #33ff33;
      box-shadow: 0 0 10px #33ff33;
    }
  </style>
</head>
<body>
  <div id="hud"></div>
  <canvas id="game"></canvas>
  <div id="setup">
    <div class="setup-container">
      <h2>SCORCHED EARTH SETUP</h2>

      <div class="form-group">
        <label for="player-count">Players:</label>
        <select id="player-count">
          <option value="2">2 Players</option>
          <option value="3">3 Players</option>
          <option value="4" selected>4 Players</option>
        </select>
      </div>

      <div id="player-slots"></div>

      <div class="settings-grid">
        <div class="form-group">
          <label for="rounds">Rounds (1-20):</label>
          <input type="number" id="rounds" min="1" max="20" value="5">
        </div>
        <div class="form-group">
          <label for="starting-cash">Starting Cash:</label>
          <input type="number" id="starting-cash" min="0" value="10000">
        </div>
        <div class="form-group">
          <label for="wall-type">Wall Type:</label>
          <select id="wall-type">
            <option value="off">Off (Wrap-around / None)</option>
            <option value="rubber">Rubber (Bouncing)</option>
            <option value="wrap">Wrap (Screen wrap)</option>
            <option value="concrete">Concrete (Solid)</option>
          </select>
        </div>
        <div class="form-group checkbox-group">
          <label>Weapons:</label>
          <div class="radio-options">
            <label>
              <input type="radio" name="weapon-availability" value="all" checked>
              All Weapons
            </label>
            <label>
              <input type="radio" name="weapon-availability" value="basic">
              Basic Only
            </label>
          </div>
        </div>
      </div>

      <div id="error-msg" class="error-msg"></div>

      <button id="start-btn">START GAME</button>
    </div>
  </div>
  <div id="shop" hidden></div>
  <script>
    (function() {
      'use strict';

      const CONST = {
        WORLD_W: 1200,
        WORLD_H: 700,
        GRAVITY: 260,
        TICK: 1/60
      };

      // Deterministic mulberry32 generator
      let state = 1;
      const rng = {
        seed(n) {
          state = n >>> 0;
        },
        next() {
          let t = (state += 0x6D2B79F5);
          t = Math.imul(t ^ (t >>> 15), t | 1);
          t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        },
        range(a, b) {
          return a + (b - a) * this.next();
        },
        int(a, b) {
          return Math.floor(this.range(a, b));
        }
      };

      // Isolated generator for visual-only non-gameplay deterministic randomness
      let visualState = 12345;
      const visualRNG = {
        next() {
          visualState = (visualState * 1664525 + 1013904223) | 0;
          return (visualState >>> 0) / 4294967296;
        },
        range(a, b) {
          return a + (b - a) * this.next();
        },
        choice(arr) {
          const idx = Math.floor(this.range(0, arr.length));
          return arr[idx];
        }
      };

      // Sizing function supporting zero-size layout and high DPI screens
      function resize() {
        if (typeof document === 'undefined' || typeof window === 'undefined') return;
        const canvas = document.getElementById('game');
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const width = rect.width || window.innerWidth || 0;
        const height = rect.height || (window.innerHeight - 40) || 0;
        if (width === 0 || height === 0) return;

        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;

        const ctx = canvas.getContext('2d');
        if (ctx) {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
      }

      // Lazily created AudioContext and mute controller
      let audioCtx = null;
      let masterGain = null;
      let isMuted = false;

      function initAudio() {
        if (audioCtx) return;
        const AudioContextClass = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
        if (!AudioContextClass) return;
        try {
          audioCtx = new AudioContextClass();
          masterGain = audioCtx.createGain();
          masterGain.gain.setValueAtTime(isMuted ? 0 : 1, audioCtx.currentTime);
          masterGain.connect(audioCtx.destination);
        } catch (e) {
          // Silent catch
        }
      }

      function sfx(name, opts = {}) {
        initAudio();
        if (!audioCtx || isMuted) return;

        if (audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }

        try {
          if (name === 'launch') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
          } else if (name === 'bounce') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.setValueAtTime(300, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
          } else if (name === 'explode') {
            try {
              const bufferSize = audioCtx.sampleRate * 0.5;
              const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
              const data = buffer.getChannelData(0);
              let nSeed = 12345;
              for (let i = 0; i < bufferSize; i++) {
                nSeed = (nSeed * 1664525 + 1013904223) | 0;
                const r = (nSeed >>> 0) / 4294967296;
                data[i] = (r * 2 - 1) * 0.2;
              }
              const noise = audioCtx.createBufferSource();
              noise.buffer = buffer;
              const filter = audioCtx.createBiquadFilter();
              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(800, audioCtx.currentTime);
              filter.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
              const gain = audioCtx.createGain();
              gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
              gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
              noise.connect(filter);
              filter.connect(gain);
              gain.connect(masterGain);
              noise.start();
              noise.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(100, audioCtx.currentTime);
              osc.frequency.linearRampToValueAtTime(10, audioCtx.currentTime + 0.5);
              gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
              gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
              osc.connect(gain);
              gain.connect(masterGain);
              osc.start();
              osc.stop(audioCtx.currentTime + 0.5);
            }
          } else if (name === 'buy') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.2);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);
          }
        } catch (e) {
          // Silent catch
        }
      }

      if (typeof window !== 'undefined') {
        window.addEventListener('keydown', (e) => {
          if (e.key === 'm' || e.key === 'M') {
            isMuted = !isMuted;
            if (masterGain && audioCtx) {
              masterGain.gain.setValueAtTime(isMuted ? 0 : 1, audioCtx.currentTime);
            }
          }
        });
      }

      class Terrain {
        constructor() {
          this.heights = new Float32Array(CONST.WORLD_W);
        }

        generate(seed) {
          rng.seed(seed);
          const minH = CONST.WORLD_H * 0.15;
          const maxH = CONST.WORLD_H * 0.80;

          // Standard midpoint displacement for 1D
          const heights = this.heights;
          const N = heights.length;

          heights[0] = rng.range(minH + (maxH - minH) * 0.2, maxH - (maxH - minH) * 0.2);
          heights[N - 1] = rng.range(minH + (maxH - minH) * 0.2, maxH - (maxH - minH) * 0.2);

          // Roughness controls the initial displacement size
          let roughness = 0.35;

          function displace(left, right, r) {
            if (right - left <= 1) return;
            const mid = Math.floor((left + right) / 2);
            // Height is the average of endpoints + random offset proportional to interval length
            const avg = (heights[left] + heights[right]) / 2;
            const rangeVal = (right - left) * r;
            const offset = rng.range(-rangeVal, rangeVal);
            heights[mid] = avg + offset;

            displace(left, mid, r * 0.55);
            displace(mid, right, r * 0.55);
          }

          displace(0, N - 1, roughness);

          // Smoothing pass: 5-point moving average, run 4 times
          const temp = new Float32Array(N);
          for (let pass = 0; pass < 4; pass++) {
            for (let i = 0; i < N; i++) {
              let sum = 0;
              let count = 0;
              for (let di = -2; di <= 2; di++) {
                const idx = i + di;
                if (idx >= 0 && idx < N) {
                  sum += heights[idx];
                  count++;
                }
              }
              temp[i] = sum / count;
            }
            heights.set(temp);
          }

          // Clamp to safety range
          for (let i = 0; i < N; i++) {
            if (heights[i] < minH) heights[i] = minH;
            if (heights[i] > maxH) heights[i] = maxH;
          }
        }

        heightAt(x) {
          const N = this.heights.length;
          // Clamped lookup
          const cx = Math.max(0, Math.min(N - 1, x));
          const x0 = Math.floor(cx);
          const x1 = Math.min(N - 1, x0 + 1);
          const t = cx - x0;
          return this.heights[x0] * (1 - t) + this.heights[x1] * t;
        }

        carve(x, y, r) {
          const N = this.heights.length;
          const cy_height = CONST.WORLD_H - y;
          const startCol = Math.max(0, Math.floor(x - r));
          const endCol = Math.min(N - 1, Math.ceil(x + r));

          for (let col = startCol; col <= endCol; col++) {
            const dx = col - x;
            if (Math.abs(dx) < r) {
              const dy = Math.sqrt(r * r - dx * dx);
              const y1 = cy_height - dy;
              const y2 = cy_height + dy;
              if (this.heights[col] > y1) {
                const overlap = Math.min(this.heights[col], y2) - y1;
                if (overlap > 0) {
                  this.heights[col] -= overlap;
                }
              }
            }
          }
        }

        deposit(x, y, r) {
          const N = this.heights.length;
          const cy_height = CONST.WORLD_H - y;
          const startCol = Math.max(0, Math.floor(x - r));
          const endCol = Math.min(N - 1, Math.ceil(x + r));

          for (let col = startCol; col <= endCol; col++) {
            const dx = col - x;
            if (Math.abs(dx) < r) {
              const dy = Math.sqrt(r * r - dx * dx);
              const y1 = cy_height - dy;
              const y2 = cy_height + dy;
              const overlap = Math.max(0, y2 - Math.max(this.heights[col], y1));
              if (overlap > 0) {
                this.heights[col] += overlap;
              }
            }
          }
        }

        settle() {
          const N = this.heights.length;
          const max_slope = 1.0;
          // Perform multiple sliding passes to let soil flow down slopes
          for (let pass = 0; pass < 20; pass++) {
            let changed = false;
            for (let i = 0; i < N - 1; i++) {
              const diff = this.heights[i] - this.heights[i + 1];
              if (diff > max_slope) {
                const excess = diff - max_slope;
                const move = excess / 2;
                this.heights[i] -= move;
                this.heights[i + 1] += move;
                changed = true;
              } else if (diff < -max_slope) {
                const excess = -diff - max_slope;
                const move = excess / 2;
                this.heights[i] += move;
                this.heights[i + 1] -= move;
                changed = true;
              }
            }
            if (!changed) break;
          }

          // Finally, clamp every column back into range
          const minH = CONST.WORLD_H * 0.15;
          const maxH = CONST.WORLD_H * 0.80;
          for (let i = 0; i < N; i++) {
            if (this.heights[i] < minH) this.heights[i] = minH;
            if (this.heights[i] > maxH) this.heights[i] = maxH;
          }
        }

        draw(ctx) {
          if (!ctx) return;

          // Sky gradient
          const skyGrad = ctx.createLinearGradient(0, 0, 0, CONST.WORLD_H);
          skyGrad.addColorStop(0, '#020010');
          skyGrad.addColorStop(1, '#1b1b3a');
          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, CONST.WORLD_W, CONST.WORLD_H);

          // Ground fill: darker body
          ctx.beginPath();
          ctx.moveTo(0, CONST.WORLD_H);
          for (let i = 0; i < this.heights.length; i++) {
            ctx.lineTo(i, CONST.WORLD_H - this.heights[i]);
          }
          ctx.lineTo(CONST.WORLD_W, CONST.WORLD_H);
          ctx.closePath();

          const groundGrad = ctx.createLinearGradient(0, CONST.WORLD_H * 0.15, 0, CONST.WORLD_H);
          groundGrad.addColorStop(0, '#5a3d28');
          groundGrad.addColorStop(1, '#1f140c');
          ctx.fillStyle = groundGrad;
          ctx.fill();

          // Ground surface line: lighter surface line
          ctx.beginPath();
          ctx.moveTo(0, CONST.WORLD_H - this.heights[0]);
          for (let i = 1; i < this.heights.length; i++) {
            ctx.lineTo(i, CONST.WORLD_H - this.heights[i]);
          }
          ctx.strokeStyle = '#2d8a2d';
          ctx.lineWidth = 3;
          ctx.stroke();
        }
      }

      class Game {
        constructor(opts = {}) {
          this.headless = !!opts.headless;
          this.seed = opts.seed !== undefined ? opts.seed : 42;
          this.roundState = {
            ticks: 0
          };

          this.terrain = new Terrain();
          this.newRound(this.seed);

          if (!this.headless) {
            if (typeof document !== 'undefined') {
              this.canvas = document.getElementById('game');
              this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
              if (typeof window !== 'undefined') {
                window.addEventListener('resize', () => resize());
                resize();
              }
              this.setupInput();
            }

            // Particle pool initialization (600 particles hard cap)
            this.particlePool = Array.from({ length: 600 }, () => ({
              active: false,
              x: 0,
              y: 0,
              vx: 0,
              vy: 0,
              color: '#ffffff',
              life: 0,
              maxLife: 0,
              size: 2,
              type: '',
              bounces: 0
            }));
            this.explosions = [];
          }
        }

        setupInput() {
          window.addEventListener('keydown', (e) => {
            if (!this.roster || this.activePlayerIdx === undefined) return;
            const activeTank = this.roster[this.activePlayerIdx];
            if (!activeTank || activeTank.hp <= 0 || activeTank.type !== 'Human') return;
            if (this.projectile || this.anyTankFalling()) return; // Ignore while projectile is live or tanks are falling

            let changed = false;
            if (e.key === 'ArrowLeft') {
              const diff = e.shiftKey ? 5 : 1;
              activeTank.angle = Math.min(180, Math.max(0, activeTank.angle + diff));
              changed = true;
            } else if (e.key === 'ArrowRight') {
              const diff = e.shiftKey ? 5 : 1;
              activeTank.angle = Math.min(180, Math.max(0, activeTank.angle - diff));
              changed = true;
            } else if (e.key === 'ArrowUp') {
              const diff = e.shiftKey ? 25 : 5;
              activeTank.power = Math.min(1000, Math.max(0, activeTank.power + diff));
              changed = true;
            } else if (e.key === 'ArrowDown') {
              const diff = e.shiftKey ? 25 : 5;
              activeTank.power = Math.min(1000, Math.max(0, activeTank.power - diff));
              changed = true;
            } else if (e.key === ' ' || e.code === 'Space') {
              this.fireActiveWeapon();
              e.preventDefault();
            } else if (e.key === '[' || e.key === ']' || e.key === 'Tab') {
              this.cycleWeapon(e.key === '[' ? -1 : 1);
              e.preventDefault();
            }

            if (changed) {
              this.updateHUD();
            }
          });
        }

        fireActiveWeapon() {
          if (!this.roster || this.activePlayerIdx === undefined) return;
          const activeTank = this.roster[this.activePlayerIdx];
          if (!activeTank || activeTank.hp <= 0 || this.projectile) return;

          // Check ammo if any (here infinite for Baby Missile)
          const weapon = activeTank.selectedWeapon || 'Baby Missile';
          const ammo = activeTank.inventory[weapon];
          if (ammo !== undefined && ammo <= 0) return;

          if (ammo !== undefined && ammo !== Infinity) {
            activeTank.inventory[weapon]--;
          }

          const angleRad = (activeTank.angle * Math.PI) / 180;
          const barrelLen = 12;
          const startX = activeTank.x + barrelLen * Math.cos(angleRad);
          const startY = activeTank.y - 6 - barrelLen * Math.sin(angleRad);

          // Velocity is proportional to power
          const vx = activeTank.power * Math.cos(angleRad);
          const vy = -activeTank.power * Math.sin(angleRad);

          this.projectile = {
            x: startX,
            y: startY,
            vx: vx,
            vy: vy,
            weapon: weapon,
            shooterIdx: this.activePlayerIdx
          };

          if (!this.headless) {
            sfx('launch');
          }
        }

        cycleWeapon(dir) {
          if (!this.roster || this.activePlayerIdx === undefined) return;
          const activeTank = this.roster[this.activePlayerIdx];
          if (!activeTank) return;

          const weapons = Object.keys(activeTank.inventory);
          if (weapons.length <= 1) return;

          let idx = weapons.indexOf(activeTank.selectedWeapon);
          idx = (idx + dir + weapons.length) % weapons.length;
          activeTank.selectedWeapon = weapons[idx];
          this.updateHUD();
        }

        newRound(roundSeed) {
          this.seed = roundSeed;
          this.terrain.generate(roundSeed);
          // Regenerate wind: signed horizontal acceleration, let's say between -150 and 150
          this.wind = rng.range(-150, 150);

          if (!this.headless) {
            if (this.particlePool) {
              this.particlePool.forEach(p => { p.active = false; });
            }
            if (this.explosions) {
              this.explosions.length = 0;
            }
          }
        }

        snapTanksToTerrain() {
          if (!this.roster) return;
          this.roster.forEach(tank => {
            tank.y = CONST.WORLD_H - this.terrain.heightAt(tank.x);
          });
        }

        updateHUD() {
          if (this.headless) return;
          const hud = document.getElementById('hud');
          if (!hud) return;

          if (!this.roster || this.activePlayerIdx === undefined) {
            hud.textContent = 'No active player';
            return;
          }

          const activeTank = this.roster[this.activePlayerIdx];
          if (!activeTank) {
            hud.textContent = 'No active player';
            return;
          }

          const weapon = activeTank.selectedWeapon || 'Baby Missile';
          const ammoVal = activeTank.inventory[weapon];
          const ammoStr = ammoVal === Infinity ? 'INF' : ammoVal;

          const windSpeed = Math.round(Math.abs(this.wind || 0));
          const windDir = (this.wind || 0) < 0 ? '←' : '→';

          // Inline styling using helper elements or just setting textContent in a safe and structured way
          // Let's create static sub-elements once or update textContent using an elegant formatting scheme.
          // To ensure we update textContent with inline styles only, never rebuilding innerHTML per frame:
          // We can construct text contents for specific parts, or structure hud cleanly.
          // Let's check how the instructions specify: "fill #hud with the active tank's name in its colour, hp, angle, power, selected weapon with remaining ammo, cash, wind as a direction arrow beside its speed value, plus a compact controls legend. updateHUD() writes textContent with inline styles only, never rebuilding innerHTML per frame, returning immediately when headless. Call it on every input, on every turn change."
          // Since we want inline styles (like text color), we can create sub elements in DOMContentLoaded or lazily if not present, and update their textContent. Let's do lazy creation of sub-span elements inside #hud if #hud is empty or has wrong children. This is extremely fast and avoids innerHTML rebuilds.

          let nameSpan = hud.querySelector('.hud-name');
          let hpSpan = hud.querySelector('.hud-hp');
          let angleSpan = hud.querySelector('.hud-angle');
          let powerSpan = hud.querySelector('.hud-power');
          let weaponSpan = hud.querySelector('.hud-weapon');
          let cashSpan = hud.querySelector('.hud-cash');
          let windSpan = hud.querySelector('.hud-wind');
          let legendSpan = hud.querySelector('.hud-legend');

          if (!nameSpan) {
            hud.innerHTML = ''; // Initial clear

            nameSpan = document.createElement('span');
            nameSpan.className = 'hud-name';
            nameSpan.style.fontWeight = 'bold';
            nameSpan.style.marginRight = '15px';

            hpSpan = document.createElement('span');
            hpSpan.className = 'hud-hp';
            hpSpan.style.marginRight = '15px';

            angleSpan = document.createElement('span');
            angleSpan.className = 'hud-angle';
            angleSpan.style.marginRight = '15px';

            powerSpan = document.createElement('span');
            powerSpan.className = 'hud-power';
            powerSpan.style.marginRight = '15px';

            weaponSpan = document.createElement('span');
            weaponSpan.className = 'hud-weapon';
            weaponSpan.style.marginRight = '15px';

            cashSpan = document.createElement('span');
            cashSpan.className = 'hud-cash';
            cashSpan.style.marginRight = '15px';

            windSpan = document.createElement('span');
            windSpan.className = 'hud-wind';
            windSpan.style.marginRight = '15px';

            legendSpan = document.createElement('span');
            legendSpan.className = 'hud-legend';
            legendSpan.style.color = '#888';
            legendSpan.style.fontSize = '12px';
            legendSpan.style.marginLeft = 'auto';

            hud.appendChild(nameSpan);
            hud.appendChild(hpSpan);
            hud.appendChild(angleSpan);
            hud.appendChild(powerSpan);
            hud.appendChild(weaponSpan);
            hud.appendChild(cashSpan);
            hud.appendChild(windSpan);
            hud.appendChild(legendSpan);
          }

          nameSpan.textContent = activeTank.name.toUpperCase();
          nameSpan.style.color = activeTank.color;

          hpSpan.textContent = `HP: ${activeTank.hp}`;
          angleSpan.textContent = `ANG: ${activeTank.angle}°`;
          powerSpan.textContent = `PWR: ${activeTank.power}`;
          weaponSpan.textContent = `WEAP: ${weapon} (${ammoStr})`;
          cashSpan.textContent = `CASH: $${activeTank.cash}`;
          windSpan.textContent = `WIND: ${windDir} ${windSpeed}`;

          legendSpan.textContent = 'L/R: Angle | U/D: Power | Space: Fire | [/]: Weapon | Shift: Coarse';
        }

        start(config) {
          this.config = config;
          this.currentRound = 1;
          this.rounds = config.rounds !== undefined ? config.rounds : 5;
          this.wallType = config.wallType || 'off';
          this.startingCash = config.startingCash !== undefined ? config.startingCash : 10000;

          // Begin round 1 (generates terrain and seeds RNG)
          this.newRound(this.seed);

          // Build roster using the newly-seeded generator
          const players = config.players || [];
          const N = players.length;
          const zoneW = CONST.WORLD_W / N;
          const margin = 40;

          this.roster = players.map((p, i) => {
            const minX = zoneW * i + margin;
            const maxX = zoneW * (i + 1) - margin;
            const x = rng.range(minX, maxX);
            return {
              name: p.name,
              color: p.color,
              type: p.type,
              hp: 100,
              angle: 45,
              power: 500,
              cash: this.startingCash,
              inventory: { 'Baby Missile': Infinity },
              selectedWeapon: 'Baby Missile',
              shield: null,
              x: x,
              y: 0,
              damageDealt: 0,
              kills: 0
            };
          });

          this.snapTanksToTerrain();
          this.activePlayerIdx = 0;
          this.projectile = null; // Will store active projectile { x, y, vx, vy, ... }

          if (!this.headless && typeof document !== 'undefined') {
            const setupEl = document.getElementById('setup');
            if (setupEl) {
              setupEl.hidden = true;
            }
            this.updateHUD();
          }
        }

        nextTurn() {
          if (!this.roster || this.roster.length === 0) return;
          let nextIdx = this.activePlayerIdx;
          for (let i = 0; i < this.roster.length; i++) {
            nextIdx = (nextIdx + 1) % this.roster.length;
            if (this.roster[nextIdx].hp > 0) {
              this.activePlayerIdx = nextIdx;
              this.updateHUD();
              return;
            }
          }
          this.updateHUD();
        }

        checkAIShot() {
          if (!this.roster || this.activePlayerIdx === undefined) return;
          const activeTank = this.roster[this.activePlayerIdx];
          if (activeTank && activeTank.hp > 0 && activeTank.type !== 'Human' && !this.projectile) {
            // Pick deterministic angle and power using our rng
            activeTank.angle = Math.round(rng.range(30, 150));
            activeTank.power = Math.round(rng.range(200, 800));
            this.fireActiveWeapon();
          }
        }

        explosion(x, y, radius, damage, shooterIdx) {
          // 1. Carve terrain
          this.terrain.carve(x, y, radius);

          // Track newly killed tanks to trigger chain reaction explosions
          const deadTanksToExplode = [];

          // 2. Apply falloff damage to every tank inside the radius
          if (this.roster) {
            const shooter = (shooterIdx !== undefined && shooterIdx !== null) ? this.roster[shooterIdx] : null;

            this.roster.forEach((tank, idx) => {
              if (tank.hp <= 0) return;

              // Distance from explosion center (x, y) to tank center (tank.x, tank.y - 3)
              const dx = tank.x - x;
              const dy = (tank.y - 3) - y;
              const dist = Math.sqrt(dx * dx + dy * dy);

              if (dist < radius) {
                const dmg = damage * (1 - dist / radius);
                const clampedDmg = Math.max(0, dmg);

                if (clampedDmg > 0) {
                  // Accumulate damageDealt on the firing tank
                  if (shooter) {
                    shooter.damageDealt = (shooter.damageDealt || 0) + clampedDmg;
                  }

                  const prevHp = tank.hp;
                  tank.hp = Math.max(0, tank.hp - clampedDmg);

                  // Mark dead and credit kill
                  if (prevHp > 0 && tank.hp <= 0) {
                    if (shooter) {
                      shooter.kills = (shooter.kills || 0) + 1;
                    }
                    deadTanksToExplode.push({ tank, idx });
                  }
                }
              }
            });
          }

          // 3. Audio/Visual effects
          if (!this.headless) {
            sfx('explode', { radius });

            // Push expanding fireball ring
            if (this.explosions) {
              this.explosions.push({
                x: x,
                y: y,
                maxRadius: radius,
                currentRadius: 0,
                life: 0.5,
                maxLife: 0.5
              });
            }

            // Spawn smoke and debris particles
            this.spawnCraterEffects(x, y, radius);
          }

          // 4. Chain reactions: dead tanks explode sequentially
          deadTanksToExplode.forEach(item => {
            this.explosion(item.tank.x, item.tank.y - 3, 35, 50, shooterIdx);
          });
        }

        reSeatTanks() {
          if (!this.roster) return;
          this.roster.forEach(tank => {
            if (tank.hp <= 0) return;
            const groundY = CONST.WORLD_H - this.terrain.heightAt(tank.x);
            if (tank.y < groundY - 0.01) {
              tank.falling = true;
              if (tank.vy === undefined || tank.vy === null) {
                tank.vy = 0;
              }
            } else {
              tank.y = groundY;
              tank.falling = false;
              tank.vy = 0;
            }
          });
        }

        onImpact(x, y, weapon, shooterIdx) {
          const wp = weapon || 'Baby Missile';
          const radius = (wp === 'Baby Missile') ? 30 : 30;
          const damage = (wp === 'Baby Missile') ? 60 : 60;

          this.lastShooterIdx = shooterIdx;

          this.explosion(x, y, radius, damage, shooterIdx);

          this.terrain.settle();
          this.reSeatTanks();

          if (this.config && typeof this.config.onImpact === 'function') {
            this.config.onImpact(x, y);
          }
        }

        anyTankFalling() {
          if (!this.roster) return false;
          return this.roster.some(tank => tank.hp > 0 && tank.falling);
        }

        stepPhysics(dt) {
          this.roundState.ticks++;

          // Update falling tanks
          if (this.roster) {
            this.roster.forEach(tank => {
              if (tank.hp <= 0) return;
              const groundY = CONST.WORLD_H - this.terrain.heightAt(tank.x);

              if (tank.y < groundY - 0.01) {
                if (!tank.falling) {
                  tank.falling = true;
                  tank.vy = 0;
                }
                tank.vy += CONST.GRAVITY * dt;
                tank.y += tank.vy * dt;

                const newGroundY = CONST.WORLD_H - this.terrain.heightAt(tank.x);
                if (tank.y >= newGroundY) {
                  tank.y = newGroundY;
                  tank.falling = false;
                  const impactVy = tank.vy;
                  tank.vy = 0;

                  // Parachute consumption check defensively
                  const hasParachute = tank.inventory && tank.inventory['Parachute'] > 0;
                  if (hasParachute) {
                    tank.inventory['Parachute']--;
                  } else {
                    // Drop damage proportional to impact velocity, capped
                    const dropDmg = Math.min(80, Math.max(0, impactVy * 0.15));
                    if (dropDmg > 5) {
                      const prevHp = tank.hp;
                      tank.hp = Math.max(0, tank.hp - dropDmg);
                      if (prevHp > 0 && tank.hp <= 0) {
                        if (this.lastShooterIdx !== undefined && this.roster[this.lastShooterIdx]) {
                          this.roster[this.lastShooterIdx].kills = (this.roster[this.lastShooterIdx].kills || 0) + 1;
                        }
                      }
                    }
                  }
                }
              } else {
                if (tank.y > groundY) {
                  tank.y = groundY;
                }
                tank.falling = false;
                tank.vy = 0;
              }
            });
          }

          // If active player is dead, skip to next living player
          if (this.roster && this.activePlayerIdx !== undefined) {
            const activeTank = this.roster[this.activePlayerIdx];
            if (activeTank && activeTank.hp <= 0) {
              this.nextTurn();
            }
          }

          // If no projectile is live, and the active player is AI, trigger its shot deterministically
          if (!this.projectile && !this.anyTankFalling() && this.roster && this.activePlayerIdx !== undefined) {
            const activeTank = this.roster[this.activePlayerIdx];
            if (activeTank && activeTank.hp > 0 && activeTank.type !== 'Human') {
              this.checkAIShot();
            }
          }

          if (this.projectile) {
            // Apply wind and gravity once per tick
            this.projectile.vy += CONST.GRAVITY * dt;
            this.projectile.vx += (this.wind || 0) * dt;

            const step_vx = this.projectile.vx;
            const step_vy = this.projectile.vy;
            const speed = Math.sqrt(step_vx * step_vx + step_vy * step_vy);
            const numSteps = Math.max(10, Math.ceil(speed * dt));
            const sdt = dt / numSteps;

            for (let s = 0; s < numSteps; s++) {
              if (!this.projectile) break;

              this.projectile.x += step_vx * sdt;
              this.projectile.y += step_vy * sdt;

              // Spawn trail particle if not headless
              if (!this.headless) {
                const col = visualRNG.choice(['#ff3300', '#ffaa00', '#ffff00', '#ff6600']);
                const jx = visualRNG.range(-5, 5);
                const jy = visualRNG.range(-5, 5);
                this.spawnParticle(
                  'spark',
                  this.projectile.x,
                  this.projectile.y,
                  -step_vx * 0.05 + jx,
                  -step_vy * 0.05 + jy,
                  col,
                  visualRNG.range(0.2, 0.4),
                  visualRNG.range(1.0, 2.5)
                );
              }

              const px = this.projectile.x;
              const py = this.projectile.y;

              // Wall and ceiling boundaries checks based on wallType
              if (this.wallType === 'off') {
                if (px < 0 || px > CONST.WORLD_W) {
                  this.projectile = null;
                  this.nextTurn();
                  break;
                }
              } else if (this.wallType === 'rubber') {
                if (this.projectile.x < 0) {
                  this.projectile.vx = -this.projectile.vx;
                  this.projectile.x = -this.projectile.x;
                  if (!this.headless) sfx('bounce');
                } else if (this.projectile.x > CONST.WORLD_W) {
                  this.projectile.vx = -this.projectile.vx;
                  this.projectile.x = CONST.WORLD_W - (this.projectile.x - CONST.WORLD_W);
                  if (!this.headless) sfx('bounce');
                }
              } else if (this.wallType === 'wrap') {
                this.projectile.x = (this.projectile.x % CONST.WORLD_W + CONST.WORLD_W) % CONST.WORLD_W;
              } else if (this.wallType === 'concrete') {
                // Concrete bounces off left/right and ceiling
                if (this.projectile.x < 0) {
                  this.projectile.vx = -this.projectile.vx;
                  this.projectile.x = -this.projectile.x;
                  if (!this.headless) sfx('bounce');
                } else if (this.projectile.x > CONST.WORLD_W) {
                  this.projectile.vx = -this.projectile.vx;
                  this.projectile.x = CONST.WORLD_W - (this.projectile.x - CONST.WORLD_W);
                  if (!this.headless) sfx('bounce');
                }
                if (this.projectile.y < 0) {
                  this.projectile.vy = -this.projectile.vy;
                  this.projectile.y = -this.projectile.y;
                  if (!this.headless) sfx('bounce');
                }
              }

              // Check if projectile fell below world bottom
              if (this.projectile && this.projectile.y > CONST.WORLD_H) {
                this.projectile = null;
                this.nextTurn();
                break;
              }

              if (!this.projectile) break;

              // Collision with terrain
              const terrainX = Math.floor(this.projectile.x);
              if (terrainX >= 0 && terrainX < CONST.WORLD_W) {
                const groundY = CONST.WORLD_H - this.terrain.heightAt(this.projectile.x);
                if (this.projectile.y >= groundY) {
                  const impactX = this.projectile.x;
                  const impactY = this.projectile.y;
                  const weapon = this.projectile.weapon;
                  const shooterIdx = this.projectile.shooterIdx;
                  this.projectile = null;
                  this.onImpact(impactX, impactY, weapon, shooterIdx);
                  this.nextTurn();
                  break;
                }
              }

              // Collision with tank hulls
              let hitTank = false;
              for (let i = 0; i < this.roster.length; i++) {
                const tank = this.roster[i];
                if (tank.hp > 0) {
                  if (this.projectile.x >= tank.x - 8 && this.projectile.x <= tank.x + 8 &&
                      this.projectile.y >= tank.y - 6 && this.projectile.y <= tank.y) {
                    const impactX = this.projectile.x;
                    const impactY = this.projectile.y;
                    const weapon = this.projectile.weapon;
                    const shooterIdx = this.projectile.shooterIdx;
                    this.projectile = null;
                    this.onImpact(impactX, impactY, weapon, shooterIdx);
                    this.nextTurn();
                    hitTank = true;
                    break;
                  }
                }
              }
              if (hitTank) break;
            }
          }
        }

        spawnParticle(type, x, y, vx, vy, color, maxLife, size) {
          if (this.headless || !this.particlePool) return;
          const p = this.particlePool.find(item => !item.active);
          if (!p) return; // Hard cap near 600 reached
          p.active = true;
          p.type = type;
          p.x = x;
          p.y = y;
          p.vx = vx;
          p.vy = vy;
          p.color = color;
          p.life = maxLife;
          p.maxLife = maxLife;
          p.size = size || 2;
          p.bounces = 0;
        }

        updateParticles(dt) {
          if (this.headless || !this.particlePool) return;
          for (let i = 0; i < this.particlePool.length; i++) {
            const p = this.particlePool[i];
            if (!p.active) continue;

            p.life -= dt;
            if (p.life <= 0) {
              p.active = false;
              continue;
            }

            if (p.type === 'spark') {
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vx *= 0.95;
              p.vy *= 0.95;
            } else if (p.type === 'smoke') {
              p.x += p.vx * dt;
              p.y += p.vy * dt;
              p.vy -= 10 * dt; // Smoke rises slightly
            } else if (p.type === 'debris') {
              p.vy += CONST.GRAVITY * dt;
              p.x += p.vx * dt;
              p.y += p.vy * dt;

              if (p.x < 0 || p.x > CONST.WORLD_W) {
                p.active = false;
                continue;
              }

              const groundY = CONST.WORLD_H - this.terrain.heightAt(p.x);
              if (p.y >= groundY) {
                p.y = groundY;
                p.vy = -p.vy * 0.4;
                p.vx *= 0.5;
                p.bounces++;
                if (Math.abs(p.vy) < 10 || p.bounces > 4) {
                  p.vy = 0;
                  p.vx = 0;
                  p.y = groundY;
                }
              }
            }
          }
        }

        drawParticles(ctx) {
          if (this.headless || !this.particlePool) return;
          for (let i = 0; i < this.particlePool.length; i++) {
            const p = this.particlePool[i];
            if (!p.active) continue;

            ctx.save();
            const alpha = Math.max(0, Math.min(1, p.life / p.maxLife));
            ctx.globalAlpha = alpha;
            ctx.fillStyle = p.color;
            ctx.beginPath();
            if (p.type === 'smoke') {
              ctx.arc(p.x, p.y, p.size * (1 + (1 - p.life / p.maxLife) * 1.5), 0, Math.PI * 2);
            } else {
              ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
            }
            ctx.fill();
            ctx.restore();
          }
        }

        spawnCraterEffects(x, y, radius) {
          if (this.headless) return;
          const smokeCount = Math.floor(radius / 2);
          for (let i = 0; i < smokeCount; i++) {
            const angle = visualRNG.range(0, Math.PI * 2);
            const r = visualRNG.range(0, radius * 0.8);
            const px = x + r * Math.cos(angle);
            const py = y + r * Math.sin(angle);

            const vx = visualRNG.range(-15, 15);
            const vy = visualRNG.range(-30, -10);

            const size = visualRNG.range(3, 8);
            const maxLife = visualRNG.range(0.8, 1.5);
            const colors = ['#555555', '#777777', '#999999', '#333333'];
            const color = visualRNG.choice(colors);

            this.spawnParticle('smoke', px, py, vx, vy, color, maxLife, size);
          }

          const debrisCount = Math.floor(radius / 3);
          for (let i = 0; i < debrisCount; i++) {
            const angle = visualRNG.range(-Math.PI * 0.8, -Math.PI * 0.2);
            const speed = visualRNG.range(50, 150);
            const vx = speed * Math.cos(angle);
            const vy = speed * Math.sin(angle);

            const maxLife = visualRNG.range(2.0, 4.0);
            const size = visualRNG.range(1.5, 3.5);
            const colors = ['#8b5a2b', '#5c3a21', '#3d2514', '#4a4a4a'];
            const color = visualRNG.choice(colors);

            this.spawnParticle('debris', x, y - 2, vx, vy, color, maxLife, size);
          }
        }

        updateExplosions(dt) {
          if (this.headless || !this.explosions) return;
          for (let i = this.explosions.length - 1; i >= 0; i--) {
            const exp = this.explosions[i];
            exp.life -= dt;
            const progress = 1 - (exp.life / exp.maxLife);
            exp.currentRadius = exp.maxRadius * progress;
            if (exp.life <= 0) {
              this.explosions.splice(i, 1);
            }
          }
        }

        drawExplosions(ctx) {
          if (this.headless || !this.explosions) return;
          for (let i = 0; i < this.explosions.length; i++) {
            const exp = this.explosions[i];
            ctx.save();
            const alpha = Math.max(0, Math.min(1, exp.life / exp.maxLife));
            ctx.globalAlpha = alpha;

            ctx.strokeStyle = '#ff3300';
            ctx.lineWidth = 4;
            ctx.beginPath();
            ctx.arc(exp.x, exp.y, exp.currentRadius, 0, Math.PI * 2);
            ctx.stroke();

            ctx.fillStyle = '#ffaa00';
            ctx.beginPath();
            ctx.arc(exp.x, exp.y, exp.currentRadius * 0.8, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#ffff00';
            ctx.beginPath();
            ctx.arc(exp.x, exp.y, exp.currentRadius * 0.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.restore();
          }
        }

        update(dt) {
          this.stepPhysics(dt);
          if (!this.headless) {
            this.updateParticles(dt);
            this.updateExplosions(dt);
          }
        }

        draw() {
          if (this.headless) return;
          const ctx = this.ctx;
          if (!ctx) return;

          const dpr = window.devicePixelRatio || 1;
          // Reset transform to identity (device pixels) to clear the entire canvas
          ctx.setTransform(1, 0, 0, 1, 0, 0);
          ctx.clearRect(0, 0, this.canvas.width, this.canvas.height);

          // Restore dpr transform
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

          // Get CSS width and height of canvas
          const cssWidth = this.canvas.width / dpr;
          const cssHeight = this.canvas.height / dpr;

          // Draw the terrain scaled to fit the CSS bounds of the canvas
          ctx.save();
          ctx.scale(cssWidth / CONST.WORLD_W, cssHeight / CONST.WORLD_H);
          this.terrain.draw(ctx);

          // Draw tanks
          if (this.roster) {
            this.roster.forEach((tank, idx) => {
              if (tank.hp <= 0) return;

              ctx.fillStyle = tank.color;
              ctx.strokeStyle = tank.color;

              // Hull
              ctx.fillRect(tank.x - 8, tank.y - 6, 16, 6);

              // Dome
              ctx.beginPath();
              ctx.arc(tank.x, tank.y - 6, 4, Math.PI, 0);
              ctx.fill();

              // Barrel
              const angleRad = (tank.angle * Math.PI) / 180;
              const barrelLen = 12;
              const bx = tank.x + barrelLen * Math.cos(angleRad);
              const by = tank.y - 6 - barrelLen * Math.sin(angleRad);

              ctx.beginPath();
              ctx.moveTo(tank.x, tank.y - 6);
              ctx.lineTo(bx, by);
              ctx.lineWidth = 2;
              ctx.stroke();

              // Active player indicator (small triangle pointing down)
              if (idx === this.activePlayerIdx) {
                ctx.fillStyle = '#ffffff';
                ctx.beginPath();
                ctx.moveTo(tank.x - 4, tank.y - 20);
                ctx.lineTo(tank.x + 4, tank.y - 20);
                ctx.lineTo(tank.x, tank.y - 14);
                ctx.closePath();
                ctx.fill();
              }
            });
          }

          // Draw active projectile
          if (this.projectile) {
            ctx.fillStyle = '#ffffff';
            ctx.beginPath();
            ctx.arc(this.projectile.x, this.projectile.y, 3, 0, Math.PI * 2);
            ctx.fill();
          }

          // Draw particles
          this.drawParticles(ctx);

          // Draw explosions
          this.drawExplosions(ctx);

          ctx.restore();
        }
      }

      function createHeadlessGame(opts = {}) {
        return new Game({ headless: true, seed: opts.seed });
      }

      // Loop variables
      let lastTime = 0;
      let accumulator = 0;
      let gameInstance = null;

      function loop(time) {
        if (!lastTime) lastTime = time;
        let dt = (time - lastTime) / 1000;
        lastTime = time;

        if (dt > 0.25) dt = 0.25;

        accumulator += dt;
        while (accumulator >= CONST.TICK) {
          if (gameInstance) {
            gameInstance.update(CONST.TICK);
          }
          accumulator -= CONST.TICK;
        }

        if (gameInstance) {
          gameInstance.draw();
        }

        requestAnimationFrame(loop);
      }

      const RETRO_COLORS = [
        { value: '#ff00ff', name: 'Magenta' },
        { value: '#00ffff', name: 'Cyan' },
        { value: '#ff2222', name: 'Red' },
        { value: '#22ff22', name: 'Green' },
        { value: '#ffff00', name: 'Yellow' },
        { value: '#2222ff', name: 'Blue' },
        { value: '#ff8800', name: 'Orange' },
        { value: '#ffffff', name: 'White' }
      ];

      function renderPlayerSlots(count) {
        if (typeof document === 'undefined') return;
        const container = document.getElementById('player-slots');
        if (!container) return;

        const previousValues = [];
        const rows = container.querySelectorAll('.player-row');
        rows.forEach((row) => {
          const nameInput = row.querySelector('.player-name');
          const typeSelect = row.querySelector('.player-type');
          const colorSelect = row.querySelector('.player-color');
          previousValues.push({
            name: nameInput ? nameInput.value : '',
            type: typeSelect ? typeSelect.value : '',
            color: colorSelect ? colorSelect.value : ''
          });
        });

        container.innerHTML = '';

        const defaultTypes = ['Human', 'Moron', 'Shooter', 'Poolshark', 'Cyborg'];

        for (let i = 0; i < count; i++) {
          const prev = previousValues[i] || {};
          const defaultName = prev.name || `Player ${i + 1}`;
          const defaultType = prev.type || (i === 0 ? 'Human' : defaultTypes[i % defaultTypes.length]);
          const defaultColor = prev.color || RETRO_COLORS[i % RETRO_COLORS.length].value;

          const row = document.createElement('div');
          row.className = 'player-row';
          row.dataset.index = i;

          const colorOptionsHtml = RETRO_COLORS.map(c =>
            `<option value="${c.value}" ${c.value === defaultColor ? 'selected' : ''} style="color: ${c.value}; background: #000;">${c.name}</option>`
          ).join('');

          row.innerHTML = `
            <div style="font-weight: bold; margin-bottom: 8px; color: #00ff00;">PLAYER ${i + 1}</div>
            <div class="form-group">
              <label>Name:</label>
              <input type="text" class="player-name" value="${defaultName}">
            </div>
            <div class="form-group">
              <label>Type:</label>
              <select class="player-type">
                <option value="Human" ${defaultType === 'Human' ? 'selected' : ''}>Human</option>
                <option value="Moron" ${defaultType === 'Moron' ? 'selected' : ''}>Moron</option>
                <option value="Shooter" ${defaultType === 'Shooter' ? 'selected' : ''}>Shooter</option>
                <option value="Poolshark" ${defaultType === 'Poolshark' ? 'selected' : ''}>Poolshark</option>
                <option value="Cyborg" ${defaultType === 'Cyborg' ? 'selected' : ''}>Cyborg</option>
              </select>
            </div>
            <div class="form-group">
              <label>Color:</label>
              <select class="player-color" style="color: ${defaultColor}; font-weight: bold;">
                ${colorOptionsHtml}
              </select>
            </div>
          `;

          const colorSelect = row.querySelector('.player-color');
          colorSelect.addEventListener('change', (e) => {
            colorSelect.style.color = e.target.value;
          });

          container.appendChild(row);
        }
      }

      if (typeof document !== 'undefined') {
        document.addEventListener('DOMContentLoaded', () => {
          if (document.getElementById('game')) {
            gameInstance = new Game({ headless: false });
            if (typeof requestAnimationFrame !== 'undefined') {
              requestAnimationFrame(loop);
            }

            // Setup setup screen handlers
            const playerCountSelect = document.getElementById('player-count');
            if (playerCountSelect) {
              renderPlayerSlots(parseInt(playerCountSelect.value, 10));
              playerCountSelect.addEventListener('change', (e) => {
                renderPlayerSlots(parseInt(e.target.value, 10));
              });
            }

            const startBtn = document.getElementById('start-btn');
            const errorMsg = document.getElementById('error-msg');
            if (startBtn) {
              startBtn.addEventListener('click', () => {
                if (errorMsg) errorMsg.textContent = '';

                // Gather players
                const players = [];
                const rows = document.querySelectorAll('#player-slots .player-row');
                const colors = new Set();
                let duplicateColor = false;

                rows.forEach((row, idx) => {
                  const nameInput = row.querySelector('.player-name');
                  const typeSelect = row.querySelector('.player-type');
                  const colorSelect = row.querySelector('.player-color');

                  const name = nameInput ? nameInput.value.trim() : `Player ${idx + 1}`;
                  const type = typeSelect ? typeSelect.value : 'Human';
                  const color = colorSelect ? colorSelect.value : '#ff00ff';

                  if (colors.has(color)) {
                    duplicateColor = true;
                  }
                  colors.add(color);

                  players.push({ name, type, color });
                });

                if (duplicateColor) {
                  if (errorMsg) {
                    errorMsg.textContent = 'Error: Two or more players cannot share the same tank color!';
                  }
                  return;
                }

                // Gather settings
                const roundsInput = document.getElementById('rounds');
                const rounds = roundsInput ? Math.max(1, Math.min(20, parseInt(roundsInput.value, 10) || 5)) : 5;

                const cashInput = document.getElementById('starting-cash');
                const startingCash = cashInput ? Math.max(0, parseInt(cashInput.value, 10) || 10000) : 10000;

                const wallSelect = document.getElementById('wall-type');
                const wallType = wallSelect ? wallSelect.value : 'off';

                const weaponRadio = document.querySelector('input[name="weapon-availability"]:checked');
                const weaponsAvailability = weaponRadio ? weaponRadio.value : 'all';

                const config = {
                  players,
                  rounds,
                  startingCash,
                  wallType,
                  weaponsAvailability
                };

                if (gameInstance) {
                  gameInstance.start(config);
                }
              });
            }
          }
        });
      }

      // Expose services
      globalThis.SCORCHED = {
        Game,
        rng,
        CONST,
        createHeadlessGame,
        Terrain
      };
    })();
  </script>
</body>
</html>
