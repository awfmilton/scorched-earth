<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Scorched Earth</title>
  <style>
    * {
      box-sizing: border-box;
    }
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #0c0c0c;
      color: #00ff00;
      font-family: 'Courier New', Courier, monospace;
    }
    body {
      display: flex;
      flex-direction: column;
    }
    #hud {
      flex: 0 0 auto;
      height: 40px;
      background: #141414;
      border-bottom: 2px solid #333;
      display: flex;
      align-items: center;
      padding: 0 10px;
    }
    #game {
      flex: 1 1 auto;
      display: block;
      width: 100%;
      height: calc(100% - 40px);
    }
    /* Setup Modal styling */
    #setup {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(12, 12, 12, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 100;
    }
    #setup[hidden] {
      display: none !important;
    }
    .setup-container {
      background: #181818;
      border: 3px double #00ff00;
      padding: 20px;
      width: 90%;
      max-width: 650px;
      box-shadow: 0 0 20px rgba(0, 255, 0, 0.2);
      max-height: 95vh;
      overflow-y: auto;
    }
    .setup-container h2 {
      margin-top: 0;
      text-align: center;
      color: #00ff00;
      border-bottom: 2px solid #00ff00;
      padding-bottom: 10px;
      letter-spacing: 2px;
    }
    .form-group {
      margin-bottom: 15px;
      display: flex;
      align-items: center;
    }
    .form-group label {
      width: 150px;
      color: #00ff00;
      font-weight: bold;
    }
    .form-group input[type="text"],
    .form-group input[type="number"],
    .form-group select {
      flex: 1;
      background: #000;
      border: 1px solid #00ff00;
      color: #00ff00;
      padding: 6px 10px;
      font-family: inherit;
      font-size: 14px;
      outline: none;
    }
    .form-group select option {
      background: #000;
      color: #00ff00;
    }
    .form-group input:focus,
    .form-group select:focus {
      box-shadow: 0 0 5px #00ff00;
    }
    .player-row {
      border: 1px dashed #333;
      padding: 10px;
      margin-bottom: 15px;
      background: #111;
    }
    .player-row .form-group {
      margin-bottom: 8px;
    }
    .player-row .form-group:last-child {
      margin-bottom: 0;
    }
    .settings-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
      border-top: 2px solid #333;
      padding-top: 15px;
      margin-top: 15px;
    }
    .settings-grid .form-group {
      flex-direction: column;
      align-items: flex-start;
      margin-bottom: 0;
    }
    .settings-grid .form-group label {
      width: 100%;
      margin-bottom: 5px;
    }
    .settings-grid .form-group input,
    .settings-grid .form-group select {
      width: 100%;
    }
    .checkbox-group .radio-options {
      display: flex;
      gap: 15px;
      width: 100%;
      margin-top: 5px;
    }
    .checkbox-group .radio-options label {
      display: flex;
      align-items: center;
      gap: 5px;
      font-weight: normal;
      cursor: pointer;
      width: auto;
    }
    .checkbox-group input[type="radio"] {
      appearance: none;
      -webkit-appearance: none;
      width: 14px;
      height: 14px;
      border: 1px solid #00ff00;
      background: #000;
      display: inline-block;
      position: relative;
      cursor: pointer;
      outline: none;
    }
    .checkbox-group input[type="radio"]:checked::after {
      content: '';
      position: absolute;
      top: 3px;
      left: 3px;
      width: 6px;
      height: 6px;
      background: #00ff00;
    }
    .error-msg {
      color: #ff5555;
      text-align: center;
      font-weight: bold;
      margin: 15px 0;
      min-height: 20px;
    }
    #start-btn {
      display: block;
      width: 100%;
      background: #00ff00;
      color: #000;
      border: none;
      padding: 12px;
      font-family: inherit;
      font-weight: bold;
      font-size: 16px;
      cursor: pointer;
      transition: background 0.2s;
    }
    #start-btn:hover {
      background: #33ff33;
      box-shadow: 0 0 10px #33ff33;
    }
    #shop {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background: rgba(12, 12, 12, 0.95);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 90;
    }
    #shop[hidden] {
      display: none !important;
    }
  </style>
</head>
<body>
  <div id="hud"></div>
  <canvas id="game"></canvas>
  <div id="setup">
    <div class="setup-container">
      <h2 id="setup-title">SCORCHED EARTH MULTIPLAYER</h2>
      
      <div id="landing-view">
        <button id="btn-create-match" style="width: 100%; padding: 15px; margin-bottom: 10px; font-weight: bold; font-size: 18px; background: #00ff00; color: #000; border: none; cursor: pointer;">CREATE PRIVATE MATCH</button>
        <button id="btn-create-public" style="width: 100%; padding: 15px; margin-bottom: 20px; font-weight: bold; font-size: 18px; background: #ffff00; color: #000; border: none; cursor: pointer;">CREATE PUBLIC MATCH</button>
        
        <div style="text-align: center; margin-bottom: 20px;">OR</div>
        <div style="display: flex; gap: 10px; margin-bottom: 20px;">
          <input type="text" id="join-code" placeholder="Enter 4-letter code" maxlength="4" style="flex: 1; text-transform: uppercase; text-align: center; font-size: 18px; letter-spacing: 5px;">
          <button id="btn-join-match" style="padding: 15px 30px; font-weight: bold; background: #0088ff; color: #fff; border: none; cursor: pointer;">JOIN</button>
        </div>

        <div style="text-align: center; margin-bottom: 10px; color: #00ff00; border-bottom: 1px solid #333; padding-bottom: 5px;">PUBLIC SESSIONS</div>
        <button id="btn-refresh-rooms" style="width: 100%; padding: 10px; margin-bottom: 10px; background: #333; color: #00ff00; border: 1px solid #00ff00; cursor: pointer;">REFRESH LIST</button>
        <div id="room-list" style="max-height: 150px; overflow-y: auto; background: #111; padding: 10px; border: 1px solid #333; margin-bottom: 20px;">
          <div style="text-align: center; color: #777;">Click REFRESH LIST to see public matches...</div>
        </div>

        <div style="text-align: center; margin-bottom: 10px; color: #888; border-top: 1px solid #333; padding-top: 15px;">NO ONE AROUND?</div>
        <button id="btn-play-solo" style="width: 100%; padding: 15px; font-weight: bold; font-size: 18px; background: #ff8800; color: #000; border: none; cursor: pointer;">PLAY SOLO vs AI</button>
      </div>

      <div id="solo-view" hidden>
        <div class="settings-grid">
          <div class="form-group">
            <label for="solo-name">Your Name:</label>
            <input type="text" id="solo-name" maxlength="12" value="PLAYER">
          </div>
          <div class="form-group">
            <label for="solo-ai-count">AI Opponents:</label>
            <select id="solo-ai-count">
              <option value="1">1</option>
              <option value="2" selected>2</option>
              <option value="3">3</option>
              <option value="4">4</option>
              <option value="5">5</option>
            </select>
          </div>
        </div>

        <div style="color: #00ff00; border-bottom: 1px solid #333; padding-bottom: 5px; margin: 15px 0 10px;">OPPONENTS</div>
        <div id="solo-ai-list" style="margin-bottom: 15px;"></div>

        <div style="color: #00ff00; border-bottom: 1px solid #333; padding-bottom: 5px; margin: 15px 0 10px;">MATCH SETTINGS</div>
        <div class="settings-grid">
          <div class="form-group">
            <label for="solo-rounds">Rounds (1-20):</label>
            <input type="number" id="solo-rounds" min="1" max="20" value="5">
          </div>
          <div class="form-group">
            <label for="solo-cash">Starting Cash:</label>
            <input type="number" id="solo-cash" min="0" value="10000">
          </div>
          <div class="form-group">
            <label for="solo-wall-type">Wall Type:</label>
            <select id="solo-wall-type">
              <option value="off">Off (Wrap-around / None)</option>
              <option value="rubber">Rubber (Bouncing)</option>
              <option value="wrap">Wrap (Screen wrap)</option>
              <option value="concrete">Concrete (Solid)</option>
            </select>
          </div>
          <div class="form-group">
            <label for="solo-weapons">Weapons:</label>
            <select id="solo-weapons">
              <option value="all">All</option>
              <option value="basic">Basic</option>
            </select>
          </div>
          <div class="form-group">
            <label for="solo-gravity">Gravity:</label>
            <select id="solo-gravity">
              <option value="150" selected>Normal</option>
              <option value="50">Low</option>
              <option value="300">High</option>
            </select>
          </div>
          <div class="form-group">
            <label for="solo-wind">Wind Variability:</label>
            <select id="solo-wind">
              <option value="changing-per-round" selected>Changing (per round)</option>
              <option value="changing-mid-round">Changing (mid-round)</option>
              <option value="constant">Constant</option>
              <option value="none">None</option>
            </select>
          </div>
          <div class="form-group">
            <label for="solo-terrain-style">Terrain Style:</label>
            <select id="solo-terrain-style">
              <option value="random" selected>Random Biome</option>
              <option value="mountains">Mountains</option>
              <option value="plains">Plains</option>
              <option value="hills">Hills</option>
              <option value="plateau">Plateau</option>
            </select>
          </div>
          <div class="form-group">
            <label for="solo-terrain-hills">Hill Count:</label>
            <select id="solo-terrain-hills">
              <option value="normal" selected>Normal</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="form-group">
            <label for="solo-terrain-flatness">Flatness:</label>
            <select id="solo-terrain-flatness">
              <option value="normal" selected>Normal</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
          </div>
        </div>

        <button id="btn-start-solo" style="width: 100%; padding: 15px; margin-top: 15px; font-weight: bold; font-size: 18px; background: #00ff00; color: #000; border: none; cursor: pointer;">START SOLO GAME</button>
        <button id="btn-solo-back" style="width: 100%; padding: 10px; margin-top: 10px; background: #333; color: #aaa; border: 1px solid #555; cursor: pointer;">BACK</button>
      </div>

      <div id="lobby-view" hidden>
        <div style="text-align: center; margin-bottom: 20px; padding: 10px; background: #222; border: 1px dashed #00ff00;">
          <span style="font-size: 14px; color: #aaa;">SHARE CODE</span><br>
          <strong id="display-share-code" style="font-size: 32px; letter-spacing: 5px; color: #00ff00;"></strong>
        </div>

        <div id="multiplayer-slots"></div>

        <div id="host-settings" class="settings-grid" hidden>
          <div class="form-group">
            <label for="rounds">Rounds (1-20):</label>
            <input type="number" id="rounds" min="1" max="20" value="5">
          </div>
          <div class="form-group">
            <label for="starting-cash">Starting Cash:</label>
            <input type="number" id="starting-cash" min="0" value="10000">
          </div>
          <div class="form-group">
            <label for="wall-type">Wall Type:</label>
            <select id="wall-type">
              <option value="off">Off (Wrap-around / None)</option>
              <option value="rubber">Rubber (Bouncing)</option>
              <option value="wrap">Wrap (Screen wrap)</option>
              <option value="concrete">Concrete (Solid)</option>
            </select>
          </div>
          <div class="form-group checkbox-group">
            <label>Weapons:</label>
            <div class="radio-options">
              <label>
                <input type="radio" name="weapon-availability" value="all" checked>
                All
              </label>
              <label>
                <input type="radio" name="weapon-availability" value="basic">
                Basic
              </label>
            </div>
          </div>
          <div class="form-group">
            <label for="gravity">Gravity:</label>
            <select id="gravity">
              <option value="150" selected>Normal</option>
              <option value="50">Low</option>
              <option value="300">High</option>
            </select>
          </div>
          <div class="form-group">
            <label for="wind">Wind Variability:</label>
            <select id="wind">
              <option value="changing-per-round" selected>Changing (per round)</option>
              <option value="changing-mid-round">Changing (mid-round)</option>
              <option value="constant">Constant</option>
              <option value="none">None</option>
            </select>
          </div>
          <div class="form-group">
            <label for="terrain-style">Terrain Style:</label>
            <select id="terrain-style">
              <option value="random" selected>Random Biome</option>
              <option value="mountains">Mountains</option>
              <option value="plains">Plains</option>
              <option value="hills">Hills</option>
              <option value="plateau">Plateau</option>
            </select>
          </div>
          <div class="form-group">
            <label for="terrain-hills">Hill Count:</label>
            <select id="terrain-hills">
              <option value="normal" selected>Normal</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
          </div>
          <div class="form-group">
            <label for="terrain-flatness">Flatness:</label>
            <select id="terrain-flatness">
              <option value="normal" selected>Normal</option>
              <option value="high">High</option>
              <option value="low">Low</option>
            </select>
          </div>
        </div>

        <div id="client-waiting" style="text-align: center; margin: 20px 0; color: #aaa;" hidden>
          Waiting for host to start the game...
        </div>

        <button id="start-btn" hidden>START GAME</button>
      </div>

      <div id="error-msg" class="error-msg"></div>
    </div>
  </div>
  <div id="shop" hidden></div>
  <script src="lib/terrain.js"></script>
  <script>
    (function() {
      'use strict';

      const CONST = {
        WORLD_W: 1200,
        WORLD_H: 700,
        GRAVITY: 260,
        TICK: 1/60,
        MAX_FLIGHT_TICKS: 1800,
        // Tanks never sit flush against the edge. Mirrors WORLD_MARGIN in
        // lib/constants.js, which the server uses to mint teleport columns.
        TANK_MARGIN: 40,
        // Driving. One fuel unit buys one DRIVE_STEP of horizontal travel;
        // MAX_CLIMB is the steepest rise a tank will haul itself up in a
        // single step, which is what stops a tank driving up a sheer wall.
        DRIVE_STEP: 4,
        MAX_CLIMB: 10,
        // Topped up to this at the start of every round, so a player who never
        // visits the shop can still reposition. Purchased fuel stacks on top.
        FUEL_PER_ROUND: 100,
        // Half-width of the shaft a Sandhog bores on its way down.
        SANDHOG_SHAFT_RADIUS: 9
      };

      const WEAPONS = [
        { id: 'Baby Missile', name: 'Baby Missile', cost: 0, packSize: 1, blast: 30, damage: 60, kind: 'explosive' },
        { id: 'Missile', name: 'Missile', cost: 500, packSize: 5, blast: 40, damage: 80, kind: 'explosive' },
        { id: 'Baby Nuke', name: 'Baby Nuke', cost: 2000, packSize: 1, blast: 60, damage: 120, kind: 'explosive' },
        { id: 'Nuke', name: 'Nuke', cost: 5000, packSize: 1, blast: 100, damage: 200, kind: 'explosive' },
        { id: 'Meganuke', name: 'Meganuke', cost: 10000, packSize: 1, blast: 150, damage: 300, kind: 'explosive' },
        { id: 'MIRV', name: 'MIRV', cost: 3000, packSize: 2, blast: 25, damage: 50, kind: 'multi' },
        { id: "Death's Head", name: "Death's Head", cost: 6000, packSize: 1, blast: 35, damage: 70, kind: 'multi' },
        { id: 'Cluster Bomb', name: 'Cluster Bomb', cost: 2000, packSize: 3, blast: 20, damage: 40, kind: 'pattern' },
        { id: 'Funky Bomb', name: 'Funky Bomb', cost: 3000, packSize: 2, blast: 25, damage: 50, kind: 'pattern' },
        { id: 'Baby Roller', name: 'Baby Roller', cost: 1000, packSize: 5, blast: 20, damage: 40, kind: 'pattern' },
        { id: 'Roller', name: 'Roller', cost: 2000, packSize: 3, blast: 30, damage: 60, kind: 'pattern' },
        { id: 'Heavy Roller', name: 'Heavy Roller', cost: 4000, packSize: 2, blast: 45, damage: 90, kind: 'pattern' },
        { id: 'Digger', name: 'Digger', cost: 1500, packSize: 3, blast: 25, damage: 50, kind: 'explosive' },
        { id: 'Heavy Digger', name: 'Heavy Digger', cost: 3000, packSize: 2, blast: 40, damage: 80, kind: 'explosive' },
        // Sandhogs bore straight down through the dirt, carving the shaft as
        // they go, and detonate at the bottom of it. `tunnel` is how deep.
        { id: 'Baby Sandhog', name: 'Baby Sandhog', cost: 1000, packSize: 5, blast: 25, damage: 50, kind: 'sandhog', tunnel: 70 },
        { id: 'Sandhog', name: 'Sandhog', cost: 2500, packSize: 3, blast: 40, damage: 80, kind: 'sandhog', tunnel: 140 },
        { id: 'Heavy Sandhog', name: 'Heavy Sandhog', cost: 5000, packSize: 2, blast: 60, damage: 120, kind: 'sandhog', tunnel: 240 },
        // Riot weapons are digging tools, not killers: they clear dirt and do
        // no damage at all, which is how you excavate yourself out of a hole.
        { id: 'Riot Charge', name: 'Riot Charge', cost: 500, packSize: 5, blast: 30, damage: 0, kind: 'riot' },
        { id: 'Riot Blast', name: 'Riot Blast', cost: 1000, packSize: 5, blast: 45, damage: 0, kind: 'riot' },
        { id: 'Riot Bomb', name: 'Riot Bomb', cost: 2000, packSize: 3, blast: 65, damage: 0, kind: 'riot' },
        { id: 'Heavy Riot Bomb', name: 'Heavy Riot Bomb', cost: 4000, packSize: 2, blast: 95, damage: 0, kind: 'riot' },
        // Explodes, then hops onward and explodes again — `hops` extra times.
        { id: 'LeapFrog', name: 'LeapFrog', cost: 2500, packSize: 3, blast: 30, damage: 60, kind: 'leapfrog', hops: 2 },
        { id: 'Napalm', name: 'Napalm', cost: 1500, packSize: 3, blast: 15, damage: 5, kind: 'liquid' },
        { id: 'Hot Napalm', name: 'Hot Napalm', cost: 3000, packSize: 2, blast: 20, damage: 10, kind: 'liquid' },
        { id: 'Liquid Dirt', name: 'Liquid Dirt', cost: 1000, packSize: 4, blast: 15, damage: 0, kind: 'liquid' },
        // The dirt-delivery tier ADDS terrain instead of removing it: bury a
        // tank, or rebuild the ridge someone just blew out from under you.
        { id: 'Dirt Clod', name: 'Dirt Clod', cost: 500, packSize: 5, blast: 18, damage: 0, kind: 'dirt' },
        { id: 'Dirt Ball', name: 'Dirt Ball', cost: 1000, packSize: 4, blast: 24, damage: 0, kind: 'dirt' },
        { id: 'Dirt Bomb', name: 'Dirt Bomb', cost: 1500, packSize: 3, blast: 30, damage: 0, kind: 'dirt' },
        { id: 'Ton of Dirt', name: 'Ton of Dirt', cost: 3000, packSize: 2, blast: 55, damage: 0, kind: 'dirt' },
        { id: 'Dirt Detonator', name: 'Dirt Detonator', cost: 1000, packSize: 5, blast: 0, damage: 50, kind: 'utility' },
        // Late-tier exotics.
        { id: 'Earth Disrupter', name: 'Earth Disrupter', cost: 4000, packSize: 2, blast: 45, damage: 90, kind: 'disrupter' },
        { id: 'Plasma Blast', name: 'Plasma Blast', cost: 7000, packSize: 1, blast: 120, damage: 220, kind: 'plasma' },
        { id: 'Laser', name: 'Laser', cost: 5000, packSize: 3, blast: 20, damage: 110, kind: 'laser' },
        { id: 'Sandstorm', name: 'Sandstorm', cost: 2000, packSize: 3, blast: 0, damage: 0, kind: 'utility' },
        { id: 'Tracer', name: 'Tracer', cost: 100, packSize: 10, blast: 0, damage: 0, kind: 'utility' },
        { id: 'Smoke Tracer', name: 'Smoke Tracer', cost: 200, packSize: 10, blast: 0, damage: 0, kind: 'utility' }
      ];

      const WEAPONS_BY_ID = new Map(WEAPONS.map(w => [w.id, w]));

      // Tracers mark a trajectory and never damage anything. Smoke Tracer is
      // the same shot with a trail that stays on screen after it lands.
      function isTracer(weaponId) {
        return weaponId === 'Tracer' || weaponId === 'Smoke Tracer';
      }

      // One table instead of the strength constant being repeated at every site
      // that raises, recharges or draws a shield — they had already drifted into
      // three separate copies of the same ternary. The shop entries below are
      // generated from this, so a shield can never cost one thing and absorb
      // another.
      const SHIELD_TYPES = {
        'Shield':              { cost: 1000,  strength: 100, deflects: false, colour: 'rgba(0, 255, 0, 0.5)' },
        'Heavy Shield':        { cost: 2500,  strength: 200, deflects: false, colour: 'rgba(0, 0, 255, 0.5)' },
        'Mag Deflector':       { cost: 4000,  strength: 150, deflects: true,  colour: 'rgba(0, 255, 255, 0.5)' },
        'Heavy Mag Deflector': { cost: 6000,  strength: 250, deflects: true,  colour: 'rgba(0, 200, 255, 0.5)' },
        'Super Magno Shield':  { cost: 8000,  strength: 400, deflects: true,  colour: 'rgba(180, 0, 255, 0.5)' },
        'Force Shield':        { cost: 10000, strength: 500, deflects: false, colour: 'rgba(255, 255, 255, 0.6)' }
      };

      // Strongest first: the order a tank raises what it owns.
      const SHIELD_PRIORITY = Object.keys(SHIELD_TYPES)
        .sort((a, b) => SHIELD_TYPES[b].strength - SHIELD_TYPES[a].strength);

      function shieldStrength(type) {
        const conf = SHIELD_TYPES[type];
        return conf ? conf.strength : 100;
      }

      function shieldDeflects(type) {
        const conf = SHIELD_TYPES[type];
        return !!(conf && conf.deflects);
      }

      // Proximity fuses trip this far from an enemy hull.
      const PROXIMITY_FUSE_RADIUS = 34;

      // A shot carries at most one trigger. The order is FIXED rather than
      // player-chosen, and that is the whole reason FIRE_SYNC does not need a
      // new field: every client runs armTrigger() against the same replicated
      // inventory and therefore arms the same trigger for the same shot.
      const TRIGGER_PRIORITY = [
        { item: 'Proximity Fuse', trigger: 'proximity' },
        { item: 'Contact Trigger', trigger: 'contact' }
      ];

      // What a room set to "Basic" may buy and fire. The server holds the same
      // list in lib/constants.js and enforces it per room, so this is the shop
      // filter rather than the security boundary; tests/weapon-registry.test.js
      // fails if the two ever drift apart.
      const BASIC_WEAPON_IDS = ['Baby Missile', 'Missile', 'Tracer'];

      const SHIELD_ITEMS = Object.keys(SHIELD_TYPES).map(id => ({
        id: id,
        name: id,
        cost: SHIELD_TYPES[id].cost,
        packSize: 1,
        kind: 'shield',
        strength: SHIELD_TYPES[id].strength
      }));

      const ITEMS = [
        ...SHIELD_ITEMS,
        { id: 'Battery', name: 'Battery', cost: 500, packSize: 2, kind: 'battery' },
        { id: 'Parachute', name: 'Parachute', cost: 500, packSize: 3, kind: 'parachute' },
        { id: 'Guidance Computer', name: 'Guidance Computer', cost: 2000, packSize: 1, kind: 'utility' },
        { id: 'Auto Defense', name: 'Auto Defense', cost: 3000, packSize: 1, kind: 'utility' },
        { id: 'Fuel', name: 'Fuel', cost: 400, packSize: 100, kind: 'fuel' },
        { id: 'Teleport', name: 'Teleport', cost: 2000, packSize: 1, kind: 'teleport' },
        // Triggers change how YOUR next shot detonates. Both arm automatically
        // while you hold stock, the way Parachute and Battery already do, so
        // there is no extra mode to remember mid-turn.
        { id: 'Contact Trigger', name: 'Contact Trigger', cost: 800, packSize: 5, kind: 'trigger' },
        { id: 'Proximity Fuse', name: 'Proximity Fuse', cost: 1500, packSize: 3, kind: 'trigger' }

      // Helper function to create deterministic mulberry32 generator stream
      function createRngStream(initialSeed) {
        let state = (initialSeed !== undefined ? initialSeed : 1) >>> 0;
        return {
          seed(n) {
            state = n >>> 0;
          },
          next() {
            let t = (state += 0x6D2B79F5);
            t = Math.imul(t ^ (t >>> 15), t | 1);
            t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
            return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
          },
          range(a, b) {
            return a + (b - a) * this.next();
          },
          int(a, b) {
            return Math.floor(this.range(a, b));
          }
        };
      }

      // Two isolated streams derived from round seed:
      // terrainRNG consumed ONLY by Terrain.generate
      // gameplayRNG consumed by wind, tank placement, AI jitter, sub-munition speed, tank repositioning
      const terrainRNG = createRngStream(1);
      const gameplayRNG = createRngStream(1);
      const rng = gameplayRNG;

      // Isolated generator for visual-only non-gameplay deterministic randomness
      let visualState = 12345;
      const visualRNG = {
        next() {
          visualState = (visualState * 1664525 + 1013904223) | 0;
          return (visualState >>> 0) / 4294967296;
        },
        range(a, b) {
          return a + (b - a) * this.next();
        },
        choice(arr) {
          const idx = Math.floor(this.range(0, arr.length));
          return arr[idx];
        }
      };

      // === BEGIN SIMULATION PATH ===
      /*
       * Deterministic Trigonometric Helpers
       * Math.sin, Math.cos and Math.tan are not required by IEEE-754 or ECMAScript to be
       * correctly rounded, and differ across JS engines (V8, JSC, SpiderMonkey).
       * In lockstep simulation, differences compound until trajectories desync.
       * To preserve exact lockstep determinism across simulation paths, detSin, detCos, and detTan
       * use range-reduction to [-pi/4, pi/4] followed by fixed polynomial evaluation using ONLY + - * /.
       * Do not reassociate or optimize arithmetic operation ordering: operation order is part of the contract.
       *
       * Note: Math.sqrt is IEEE-754 correctly rounded across engines and is deliberately exempt from replacement.
       */
      const TRIG_PI = Math.PI;
      const TRIG_TWO_PI = 2 * Math.PI;
      const TRIG_HALF_PI = Math.PI / 2;
      const TRIG_QUARTER_PI = Math.PI / 4;

      function detSin(x) {
        // Normalize x to [-PI, PI]
        let y = x % TRIG_TWO_PI;
        if (y > TRIG_PI) y = y - TRIG_TWO_PI;
        if (y < -TRIG_PI) y = y + TRIG_TWO_PI;

        // Reduce to [-PI/2, PI/2]
        if (y > TRIG_HALF_PI) y = TRIG_PI - y;
        else if (y < -TRIG_HALF_PI) y = -TRIG_PI - y;

        // Range reduce to [-PI/4, PI/4] then polynomial evaluation
        if (y > TRIG_QUARTER_PI) {
          const z = TRIG_HALF_PI - y;
          const z2 = z * z;
          const z4 = z2 * z2;
          const z6 = z4 * z2;
          const z8 = z6 * z2;
          const z10 = z8 * z2;
          return 1 - (z2 / 2) + (z4 / 24) - (z6 / 720) + (z8 / 40320) - (z10 / 3628800);
        } else if (y < -TRIG_QUARTER_PI) {
          const z = TRIG_HALF_PI + y;
          const z2 = z * z;
          const z4 = z2 * z2;
          const z6 = z4 * z2;
          const z8 = z6 * z2;
          const z10 = z8 * z2;
          return -(1 - (z2 / 2) + (z4 / 24) - (z6 / 720) + (z8 / 40320) - (z10 / 3628800));
        } else {
          const y2 = y * y;
          const y3 = y * y2;
          const y5 = y3 * y2;
          const y7 = y5 * y2;
          const y9 = y7 * y2;
          const y11 = y9 * y2;
          return y - (y3 / 6) + (y5 / 120) - (y7 / 5040) + (y9 / 362880) - (y11 / 39916800);
        }
      }

      function detCos(x) {
        return detSin(x + TRIG_HALF_PI);
      }

      function detTan(x) {
        return detSin(x) / detCos(x);
      }

      // Sizing function supporting zero-size layout and high DPI screens
      function resize() {
        if (typeof document === 'undefined' || typeof window === 'undefined') return;
        const canvas = document.getElementById('game');
        if (!canvas) return;
        const rect = canvas.getBoundingClientRect();
        const width = rect.width || window.innerWidth || 0;
        const height = rect.height || (window.innerHeight - 40) || 0;
        if (width === 0 || height === 0) return;

        const dpr = window.devicePixelRatio || 1;
        canvas.width = width * dpr;
        canvas.height = height * dpr;

        const ctx = canvas.getContext('2d');
        if (ctx) {
          ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
        }
      }

      // Lazily created AudioContext and mute controller
      let audioCtx = null;
      let masterGain = null;
      let isMuted = false;

      function initAudio() {
        if (audioCtx) return;
        const AudioContextClass = typeof window !== 'undefined' && (window.AudioContext || window.webkitAudioContext);
        if (!AudioContextClass) return;
        try {
          audioCtx = new AudioContextClass();
          masterGain = audioCtx.createGain();
          masterGain.gain.setValueAtTime(isMuted ? 0 : 1, audioCtx.currentTime);
          masterGain.connect(audioCtx.destination);
        } catch (e) {
          // Silent catch
        }
      }

      function sfx(name, opts = {}) {
        initAudio();
        if (!audioCtx || isMuted) return;

        if (audioCtx.state === 'suspended') {
          audioCtx.resume().catch(() => {});
        }

        try {
          if (name === 'launch') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(40, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
          } else if (name === 'bounce') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(200, audioCtx.currentTime);
            osc.frequency.setValueAtTime(300, audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
          } else if (name === 'hit') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'square';
            osc.frequency.setValueAtTime(100, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(20, audioCtx.currentTime + 0.15);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.15);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.15);
          } else if (name === 'death') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(80, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
            gain.gain.setValueAtTime(0.4, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.5);
          } else if (name === 'shieldHit') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(300, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
          } else if (name === 'roundEnd') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.setValueAtTime(400, audioCtx.currentTime + 0.2);
            osc.frequency.setValueAtTime(500, audioCtx.currentTime + 0.4);
            gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.6);

            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
          } else if (name === 'explode') {
            try {
              const bufferSize = audioCtx.sampleRate * 0.5;
              const buffer = audioCtx.createBuffer(1, bufferSize, audioCtx.sampleRate);
              const data = buffer.getChannelData(0);
              let nSeed = 12345;
              for (let i = 0; i < bufferSize; i++) {
                nSeed = (nSeed * 1664525 + 1013904223) | 0;
                const r = (nSeed >>> 0) / 4294967296;
                data[i] = (r * 2 - 1) * 0.2;

              noise.buffer = buffer;

              filter.type = 'lowpass';
              filter.frequency.setValueAtTime(800, audioCtx.currentTime);
              filter.frequency.exponentialRampToValueAtTime(10, audioCtx.currentTime + 0.5);
              const gain = audioCtx.createGain();
              gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
              gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
              noise.connect(filter);
              filter.connect(gain);
              gain.connect(masterGain);
              noise.start();
              noise.stop(audioCtx.currentTime + 0.5);
            } catch (e) {
              const osc = audioCtx.createOscillator();
              const gain = audioCtx.createGain();
              osc.type = 'sawtooth';
              osc.frequency.setValueAtTime(100, audioCtx.currentTime);
              osc.frequency.linearRampToValueAtTime(10, audioCtx.currentTime + 0.5);
              gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
              gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
              osc.connect(gain);
              gain.connect(masterGain);
              osc.start();
              osc.stop(audioCtx.currentTime + 0.5);
            }
          } else if (name === 'buy') {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);

            osc.connect(gain);
            gain.connect(masterGain);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.2);

        } catch (e) {

        }
      }

      if (typeof window !== 'undefined') {
        window.addEventListener('keydown', (e) => {
          if (e.key === 'm' || e.key === 'M') {

            if (masterGain && audioCtx) {
              masterGain.gain.setValueAtTime(isMuted ? 0 : 1, audioCtx.currentTime);
            }
          }
        });
      }

      let TerrainLib;
      if (typeof window !== 'undefined' && window.Terrain) {
        TerrainLib = window.Terrain;
      } else if (typeof globalThis !== 'undefined' && globalThis.Terrain) {
        TerrainLib = globalThis.Terrain;
      } else {
        try {
          TerrainLib = require('./lib/terrain.js');
        } catch (e) {
          // Fallback if needed
        }
      }

      // Player-facing text for each protocol ERROR code in lib/protocol.js.
      // The server builds ERROR frames with roomError(code), which sets
      // `message` to the code itself — so the code, not `message`, is what
      // carries meaning here.
      const NET_ERROR_TEXT = {
        UNKNOWN_ROOM: 'No room exists with that code.',
        ROOM_FULL: 'That room is already full.',
        NOT_YOUR_TURN: 'It is not your turn.',
        ALREADY_FIRED: 'You have already fired this turn.',
        NOT_HOST: 'Only the host can start the game.',
        NOT_ENOUGH_PLAYERS: 'Not enough players to start.',
        COLOUR_TAKEN: 'That colour is already taken.',
        BAD_MESSAGE: 'The server rejected that message.'
      };

      // handleError() emits two different shapes: a flat server ERROR frame
      // ({ type:'ERROR', code, message }) and a local transport failure
      // ({ type:'SOCKET_ERROR'|..., error }). Reading `.message` off either one
      // blindly would print an enum or undefined, so branch on the shape.
      function formatNetError(err) {
        if (!err || typeof err !== 'object') return 'Network error.';
        if (err.type === 'ERROR') {
          return NET_ERROR_TEXT[err.code] || err.message || err.code || 'Server error.';
        }
        switch (err.type) {
          case 'CONNECTION_ERROR': return 'Could not reach the game server.';
          case 'SOCKET_ERROR': return 'Connection error — retrying...';
          case 'PARSE_ERROR': return 'Received a malformed message from the server.';
          case 'HANDLER_ERROR': return 'This client hit an internal error handling a server update.';
          case 'SEND_ERROR': return 'Could not send to the server.';
          default: return 'Network error.';
        }
      }

      class NetClient {
        constructor() {
          this.socket = null;
          this.state = 'lost';
          this.onStateChangeCallback = null;
          this.onErrorCallback = null;
          this.backoffDelay = 1000;
          this.maxBackoffDelay = 30000;
          this.reconnectTimer = null;
          this.shouldReconnect = true;
          // Clicks made before the socket finished opening, flushed on open.
          this.pendingSends = [];

          // Latest lobby snapshot received via ROOM_STATE frames
          // ({ code, phase, hostSlot, players:[{slot,name,colour,connected,alive}] }).
          this.roomState = null;

          // Dispatch table keyed on S2C message names from lib/protocol.js,
          // mirrored inline as byte-identical string literals.
          // The gameplay frames are forwarded to whichever Game is live. This
          // is the lockstep channel: FIRE_SYNC spawns the shot, TURN_SYNC moves
          // the turn, ROUND_END finishes the round. They are bound here rather
          // than in the DOMContentLoaded block so a Game constructed after the
          // socket opens still receives them.
          this.dispatchTable = {
            ROOM_STATE: (msg) => this.handleRoomState(msg),
            ROOM_LIST: (msg) => console.log('ROOM_LIST', msg), // Will be overridden
            ROUND_START: (msg) => console.log('ROUND_START:', msg),
            FIRE_SYNC: (msg) => this.toGame('applyFireSync', msg),
            TURN_SYNC: (msg) => this.toGame('applyTurnSync', msg),
            PLAYER_LEFT: (msg) => this.toGame('applyPlayerLeft', msg),
            ROUND_END: (msg) => this.toGame('applyRoundEnd', msg),
            MOVE_SYNC: (msg) => this.toGame('applyMoveSync', msg),
            TELEPORT_SYNC: (msg) => this.toGame('applyTeleportSync', msg),
            ERROR: (msg) => {
              console.warn('Server ERROR:', msg.code, msg.message);
            }
          };
        }

        // Route a gameplay frame to the live Game. Frames that arrive before
        // the game exists (or after it is torn down) are dropped rather than
        // throwing inside the socket handler.
        toGame(method, msg) {
          const game = (typeof globalThis !== 'undefined' && globalThis.SCORCHED)
            ? globalThis.SCORCHED.gameInstance
            : null;
          if (game && typeof game[method] === 'function') {
            game[method](msg);
          }
        }

        handleRoomState(msg) {
          this.roomState = {
            code: msg.code,
            phase: msg.phase,
            hostSlot: msg.hostSlot,
            players: Array.isArray(msg.players) ? msg.players.map((p) => ({
              slot: p.slot,
              name: p.name,
              colour: p.colour,
              connected: p.connected,
              alive: p.alive
            })) : []
          };
        }

        register(type, handler) {
          this.dispatchTable[type] = handler;
        }

        onStateChange(cb) {
          this.onStateChangeCallback = cb;
        }

        onError(cb) {
          this.onErrorCallback = cb;
        }

        setState(newState) {
          if (this.state !== newState) {
            this.state = newState;
            if (this.onStateChangeCallback) {
              try {
                this.onStateChangeCallback(newState);
              } catch (e) {
                console.error("Error in onStateChange callback:", e);
              }
            }
          }
        }

        connect() {
          if (this.reconnectTimer) {
            clearTimeout(this.reconnectTimer);
            this.reconnectTimer = null;
          }

          if (this.socket) {
            try {
              this.socket.onopen = null;
              this.socket.onmessage = null;
              this.socket.onclose = null;
              this.socket.onerror = null;
              this.socket.close();
            } catch (e) {}
          }

          this.shouldReconnect = true;
          this.setState('connecting');

          const protocol = (typeof location !== 'undefined' && location.protocol === 'https:') ? 'wss://' : 'ws://';
          const host = (typeof location !== 'undefined') ? location.host : 'localhost';
          const url = protocol + host;

          const WSClass = (typeof WebSocket !== 'undefined') ? WebSocket : (typeof globalThis !== 'undefined' ? globalThis.WebSocket : null);
          if (!WSClass) {
            this.handleError({ type: 'CONNECTION_ERROR', error: new Error('WebSocket is not defined') });
            this.setState('lost');
            return;
          }

          try {
            this.socket = new WSClass(url);
          } catch (err) {
            this.handleError({ type: 'CONNECTION_ERROR', error: err });
            this.setState('lost');
            this.scheduleReconnect();
            return;
          }

          this.socket.onopen = () => {
            this.setState('live');
            this.backoffDelay = 1000; // Reset backoff delay on successful connection

            const session = this.getSessionToken();
            if (session) {
              this.send('REJOIN', { code: session.code, playerToken: session.playerToken });
            } else {
              this.send('LIST_ROOMS', {});
            }

            // Anything the player clicked before the socket finished opening.
            const queued = this.pendingSends;
            this.pendingSends = [];
            queued.forEach(({ type, fields }) => this.send(type, fields));
          };

          this.socket.onmessage = (event) => {
            // Parsing and dispatching are caught SEPARATELY on purpose. These
            // used to share one try, so a bug thrown by any handler was
            // reported as PARSE_ERROR — as if the server had sent garbage —
            // and then swallowed. That is exactly how a ReferenceError in the
            // shop renderer shipped: the online shop silently never opened and
            // nothing anywhere said why.
            let msg;
            try {
              msg = JSON.parse(event.data);
              if (!msg || typeof msg !== 'object') {
                throw new Error('Invalid message format');
              }
            } catch (err) {
              this.handleError({ type: 'PARSE_ERROR', error: err, data: event.data });
              return;
            }

            const type = msg.type;

            console.debug("Received S2C message:", type, msg);

            const handler = type ? this.dispatchTable[type] : null;
            if (!handler) {
              console.warn('Unrecognised S2C message type:', type, msg);
              return;
            }

            try {
              handler(msg);
            } catch (err) {
              // A handler bug is OUR defect, not a malformed frame. Say so
              // loudly and keep the socket alive so the match is not dropped.
              console.error('Handler for S2C message', type, 'threw:', err);
              this.handleError({ type: 'HANDLER_ERROR', messageType: type, error: err });
              return;
            }

            if (type === 'ERROR') {
              // Surface the server error once, via the onError callback.
              this.handleError(msg);
            }
          };

          this.socket.onclose = () => {
            if (this.state !== 'lost') {
              this.setState('reconnecting');
            }
            this.scheduleReconnect();
          };

          this.socket.onerror = (err) => {
            this.handleError({ type: 'SOCKET_ERROR', error: err });
          };
        }

        scheduleReconnect() {
          if (!this.shouldReconnect) return;
          if (this.reconnectTimer) return;

          this.reconnectTimer = setTimeout(() => {
            this.reconnectTimer = null;
            this.backoffDelay = Math.min(this.backoffDelay * 2, this.maxBackoffDelay);
            this.connect();
          }, this.backoffDelay);
        }

        disconnect() {
          this.shouldReconnect = false;
          if (this.reconnectTimer) {
            clearTimeout(this.reconnectTimer);
            this.reconnectTimer = null;
          }
          if (this.socket) {
            try {
              this.socket.close();
            } catch (e) {}
            this.socket = null;
          }
          this.setState('lost');
        }

        send(type, fields) {
          const WSClass = (typeof WebSocket !== 'undefined') ? WebSocket : (typeof globalThis !== 'undefined' ? globalThis.WebSocket : null);
          if (this.socket && WSClass && this.socket.readyState === WSClass.OPEN) {
            try {
              this.socket.send(JSON.stringify({ type, ...(fields || {}) }));
            } catch (err) {
              this.handleError({ type: 'SEND_ERROR', error: err });
            }
            return;
          }

          // The socket opens a moment after the page does, so a player who
          // clicks CREATE straight away used to have the click silently
          // dropped and no feedback at all. Queue intent instead and flush it
          // on open. Gameplay frames are deliberately NOT queued: replaying a
          // stale shot after a reconnect would desync everyone.
          if (type === 'FIRE' || type === 'RESOLVE_SHOT') return;
          this.pendingSends = this.pendingSends || [];
          if (this.pendingSends.length < 8) {
            this.pendingSends.push({ type, fields });
          }
        }

        handleError(errObj) {
          if (this.onErrorCallback) {
            try {
              this.onErrorCallback(errObj);
            } catch (e) {
              console.error("Error in Net error handler:", e);
            }
          } else {
            console.error("Net error:", errObj);
          }
        }

        setSessionToken(code, playerToken, slot) {
          if (typeof sessionStorage !== 'undefined') {
            try {
              sessionStorage.setItem('scorched_online_code', code);
              sessionStorage.setItem('scorched_online_playerToken', playerToken);
              sessionStorage.setItem('scorched_online_slot', slot);
            } catch (e) {
              console.warn('sessionStorage is not writable:', e);
            }
          }
        }

        getSessionToken() {
          if (typeof sessionStorage !== 'undefined') {
            try {
              const code = sessionStorage.getItem('scorched_online_code');
              const playerToken = sessionStorage.getItem('scorched_online_playerToken');
              const slot = sessionStorage.getItem('scorched_online_slot');
              if (code && playerToken && slot !== null) {
                return { code, playerToken, slot: parseInt(slot, 10) };
              }
            } catch (e) {
              console.warn('sessionStorage is not readable:', e);
            }
          }
          return null;
        }

        clearSessionToken() {
          if (typeof sessionStorage !== 'undefined') {
            try {
              sessionStorage.removeItem('scorched_online_code');
              sessionStorage.removeItem('scorched_online_playerToken');
              sessionStorage.removeItem('scorched_online_slot');
            } catch (e) {}
          }
        }
      }

      class Terrain {
        constructor() {
          this.heights = new Float32Array(CONST.WORLD_W);
          this.biome = 'plains';
        }

        generate(seed, config = {}) {
          terrainRNG.seed(seed);
          const h = TerrainLib.generateTerrain(terrainRNG, CONST.WORLD_W, CONST.WORLD_H, config);
          this.heights.set(h);
          this.biome = h.biome || 'plains';
        }

        heightAt(x) {
          const N = this.heights.length;
          // Clamped lookup
          const cx = Math.max(0, Math.min(N - 1, x));
          const x0 = Math.floor(cx);
          const x1 = Math.min(N - 1, x0 + 1);
          const t = cx - x0;
          return this.heights[x0] * (1 - t) + this.heights[x1] * t;
        }

        carve(x, y, r) {
          const N = this.heights.length;
          const cy_height = CONST.WORLD_H - y;
          const startCol = Math.max(0, Math.floor(x - r));
          const endCol = Math.min(N - 1, Math.ceil(x + r));

          for (let col = startCol; col <= endCol; col++) {
            const dx = col - x;
            if (Math.abs(dx) < r) {
              const dy = Math.sqrt(r * r - dx * dx);
              const y1 = cy_height - dy;
              const y2 = cy_height + dy;
              if (this.heights[col] > y1) {
                const overlap = Math.min(this.heights[col], y2) - y1;
                if (overlap > 0) {
                  this.heights[col] -= overlap;
                }
              }
            }
          }
        }

        deposit(x, y, r) {
          const N = this.heights.length;
          const cy_height = CONST.WORLD_H - y;
          const startCol = Math.max(0, Math.floor(x - r));
          const endCol = Math.min(N - 1, Math.ceil(x + r));

          for (let col = startCol; col <= endCol; col++) {
            const dx = col - x;
            if (Math.abs(dx) < r) {
              const dy = Math.sqrt(r * r - dx * dx);
              const y1 = cy_height - dy;
              const y2 = cy_height + dy;
              const overlap = Math.max(0, y2 - Math.max(this.heights[col], y1));
              if (overlap > 0) {
                this.heights[col] += overlap;
              }
            }
          }
        }

        settle() {
          const N = this.heights.length;
          const max_slope = 1.0;
          // Perform multiple sliding passes to let soil flow down slopes
          for (let pass = 0; pass < 20; pass++) {
            let changed = false;
            for (let i = 0; i < N - 1; i++) {
              const diff = this.heights[i] - this.heights[i + 1];
              if (diff > max_slope) {
                const excess = diff - max_slope;
                const move = excess / 2;
                this.heights[i] -= move;
                this.heights[i + 1] += move;
                changed = true;
              } else if (diff < -max_slope) {
                const excess = -diff - max_slope;
                const move = excess / 2;
                this.heights[i] += move;
                this.heights[i + 1] -= move;
                changed = true;
              }
            }
            if (!changed) break;
          }

          // Finally, clamp every column back into range
          const minH = CONST.WORLD_H * 0.15;
          const maxH = CONST.WORLD_H * 0.80;
          for (let i = 0; i < N; i++) {
            if (this.heights[i] < minH) this.heights[i] = minH;
            if (this.heights[i] > maxH) this.heights[i] = maxH;
          }
        }

        draw(ctx) {
          if (!ctx) return;

          // Sky gradient
          const skyGrad = ctx.createLinearGradient(0, 0, 0, CONST.WORLD_H);
          if (this.biome === 'mountains') {
            skyGrad.addColorStop(0, '#001a33');
            skyGrad.addColorStop(1, '#334d66');
          } else if (this.biome === 'plains') {
            skyGrad.addColorStop(0, '#002200');
            skyGrad.addColorStop(1, '#004411');
          } else if (this.biome === 'plateau') {
            skyGrad.addColorStop(0, '#331a00');
            skyGrad.addColorStop(1, '#663300');
          } else {
            skyGrad.addColorStop(0, '#020010');
            skyGrad.addColorStop(1, '#1b1b3a');
          }

          ctx.fillStyle = skyGrad;
          ctx.fillRect(0, 0, CONST.WORLD_W, CONST.WORLD_H);

          // Ground fill: darker body
          ctx.beginPath();
          ctx.moveTo(0, CONST.WORLD_H);
          for (let i = 0; i < this.heights.length; i++) {
            ctx.lineTo(i, CONST.WORLD_H - this.heights[i]);
          }
          ctx.lineTo(CONST.WORLD_W, CONST.WORLD_H);
          ctx.closePath();

          const groundGrad = ctx.createLinearGradient(0, CONST.WORLD_H * 0.15, 0, CONST.WORLD_H);
          if (this.biome === 'mountains') {
            groundGrad.addColorStop(0, '#888888');
            groundGrad.addColorStop(1, '#222222');
          } else if (this.biome === 'plains') {
            groundGrad.addColorStop(0, '#226622');
            groundGrad.addColorStop(1, '#003300');
          } else if (this.biome === 'plateau') {
            groundGrad.addColorStop(0, '#cc8844');
            groundGrad.addColorStop(1, '#664422');
          } else {
            groundGrad.addColorStop(0, '#5a3d28');
            groundGrad.addColorStop(1, '#1f140c');
          }
          
          ctx.fillStyle = groundGrad;
          ctx.fill();

          // Ground surface line: lighter surface line
          ctx.beginPath();
          ctx.moveTo(0, CONST.WORLD_H - this.heights[0]);
          for (let i = 1; i < this.heights.length; i++) {
            ctx.lineTo(i, CONST.WORLD_H - this.heights[i]);
          }
          ctx.strokeStyle = '#2d8a2d';
          ctx.lineWidth = 3;
          ctx.stroke();
        }
      }

      class Game {
        get gravity() {
          return this.config && this.config.gravity !== undefined ? this.config.gravity : CONST.GRAVITY;
        }

        constructor(opts = {}) {
          this.headless = !!opts.headless;
          this.seed = opts.seed !== undefined ? opts.seed : 42;
          this.mode = opts.mode || 'local';
          this.roundState = {
            ticks: 0
          };

          this.projectiles = [];
          this.terrain = new Terrain();
          this.newRound(this.seed);

          this.net = null;
          if (this.mode === 'online') {
            this.net = new NetClient();
            this.net.onStateChange(() => {
              this.updateHUD();
            });
            this.net.onError((err) => {
              this.showNetError(err);
            });
            this.net.connect();
          }

          if (!this.headless) {
            if (typeof document !== 'undefined') {
              this.canvas = document.getElementById('game');
              this.ctx = this.canvas ? this.canvas.getContext('2d') : null;
              if (typeof window !== 'undefined') {
                window.addEventListener('resize', () => resize());
                resize();
              }
              this.setupInput();
            }

            // Particle pool initialization (600 particles hard cap)
            this.particlePool = Array.from({ length: 600 }, () => ({
              active: false,
              x: 0,
              y: 0,
              vx: 0,
              vy: 0,
              color: '#ffffff',
              life: 0,
              maxLife: 0,
              size: 2,
              type: '',
              bounces: 0
            }));
            this.explosions = [];
          }
        }

        get projectile() {
          return this.projectiles && this.projectiles.length > 0 ? this.projectiles[0] : null;
        }

        set projectile(val) {
          if (!this.projectiles) {
            this.projectiles = [];
          }
          if (val === null) {
            this.projectiles = [];
          } else {
            this.projectiles = [val];
          }
        }

        setupInput() {
          window.addEventListener('keydown', (e) => {
            if (!this.roster || this.activePlayerIdx === undefined) return;
            const activeTank = this.roster[this.activePlayerIdx];
            if (!activeTank || activeTank.hp <= 0 || activeTank.type !== 'Human') return;
            // Online you may only touch your OWN tank. Without this every
            // client aims and fires the whole field on its local copy.
            if (this.mode === 'online' && activeTank.slot !== this.mySlot) return;
            if (this.roundOver) return; // Ignore input during shop intermission / match summary
            if (this.projectile || this.anyTankFalling()) return; // Ignore while projectile is live or tanks are falling

            let changed = false;
            if (e.key === 'ArrowLeft') {
              const diff = e.shiftKey ? 5 : 1;
              activeTank.angle = Math.min(180, Math.max(0, activeTank.angle + diff));
              changed = true;
            } else if (e.key === 'ArrowRight') {
              const diff = e.shiftKey ? 5 : 1;
              activeTank.angle = Math.min(180, Math.max(0, activeTank.angle - diff));
              changed = true;
            } else if (e.key === 'ArrowUp') {
              const diff = e.shiftKey ? 25 : 5;
              activeTank.power = Math.min(1000, Math.max(0, activeTank.power + diff));
              changed = true;
            } else if (e.key === 'ArrowDown') {
              const diff = e.shiftKey ? 25 : 5;
              activeTank.power = Math.min(1000, Math.max(0, activeTank.power - diff));
              changed = true;
            } else if (e.key === ' ' || e.code === 'Space') {
              this.fireActiveWeapon();
              e.preventDefault();
            } else if (e.key === '[' || e.key === ']' || e.key === 'Tab') {
              this.cycleWeapon(e.key === '[' ? -1 : 1);
              e.preventDefault();
            } else if (e.key === 'a' || e.key === 'A') {
              this.requestDrive(-1);
              e.preventDefault();
            } else if (e.key === 'd' || e.key === 'D') {
              this.requestDrive(1);
              e.preventDefault();
            } else if (e.key === 't' || e.key === 'T') {
              this.requestTeleport();
              e.preventDefault();
            }

            if (changed) {
              this.updateHUD();
            }
          });
        }

        fireActiveWeapon() {
          if (!this.roster || this.activePlayerIdx === undefined) return;
          const activeTank = this.roster[this.activePlayerIdx];
          if (!activeTank || activeTank.hp <= 0 || this.projectile) return;

          const weapon = activeTank.selectedWeapon || 'Baby Missile';
          const ammo = activeTank.inventory[weapon];
          if (ammo !== undefined && ammo <= 0) return;

          // Online we send the INPUT and spawn nothing. The projectile appears
          // on every client — this one included — when FIRE_SYNC comes back
          // carrying the server's authoritative launch vector.
          if (this.mode === 'online') {
            if (activeTank.slot !== this.mySlot) return;
            if (this.activeShotId) return; // a shot is already in flight
            if (this.net) {
              this.net.send('FIRE', {
                angle: activeTank.angle,
                power: activeTank.power,
                weapon
              });
            }
            return;
          }

          if (ammo !== undefined && ammo !== Infinity) {
            activeTank.inventory[weapon]--;
          }
          const trigger = this.armTrigger(activeTank);

          const angleRad = (activeTank.angle * Math.PI) / 180;
          const barrelLen = 12;
          const startX = activeTank.x + barrelLen * detCos(angleRad);
          const startY = activeTank.y - 6 - barrelLen * detSin(angleRad);

          const vx = activeTank.power * detCos(angleRad);
          const vy = -activeTank.power * detSin(angleRad);

          this.projectile = {
            x: startX,
            y: startY,
            vx: vx,
            vy: vy,
            weapon: weapon,
            shooterIdx: this.activePlayerIdx,
            trigger: trigger
          };

          if (!this.headless && typeof sfx === 'function') {
            sfx('launch');
          }
        }

        // Every client — including the one that pressed Space — spawns its
        // projectile from this frame, never from local input. The server mints
        // vx/vy once (lib/room-manager.js) and we integrate those exact doubles;
        // recomputing the vector from angle/power would let the shooter and the
        // watchers integrate trajectories that differ in the last few bits, and
        // one flipped `Math.floor(x)` terrain column is a permanent desync.
        applyFireSync(msg) {
          if (!this.roster) return;
          const shooterIdx = this.roster.findIndex(t => t.slot === msg.shooterSlot);
          if (shooterIdx === -1) return;
          const shooter = this.roster[shooterIdx];

          // Wind is server-authoritative for the shot, so a client that joined
          // late cannot fly the projectile through a different breeze.
          if (msg.wind !== undefined) this.wind = msg.wind;

          const weapon = msg.weapon || 'Baby Missile';
          const ammo = shooter.inventory[weapon];
          if (ammo !== undefined && ammo !== Infinity) {
            shooter.inventory[weapon]--;
          }
          // Armed locally, from the inventory every client already replicates —
          // the same reason the ammo decrement above is safe to do client-side.
          const trigger = this.armTrigger(shooter);
          shooter.selectedWeapon = weapon;

          // angle is used ONLY to place the barrel tip, and goes through the
          // deterministic trig pair so all clients agree on the spawn pixel.
          const angleRad = ((msg.angle !== undefined ? msg.angle : 45) * Math.PI) / 180;
          const barrelLen = 12;
          const startX = shooter.x + barrelLen * detCos(angleRad);
          const startY = shooter.y - 6 - barrelLen * detSin(angleRad);

          this.activeShotId = msg.shotId;
          this.reportedShotId = null;

          this.projectile = {
            x: startX,
            y: startY,
            vx: msg.vx,
            vy: msg.vy,
            weapon: weapon,
            shooterIdx: shooterIdx,
            shotId: msg.shotId,
            trigger: trigger
          };

          if (!this.headless && typeof sfx === 'function') {
            sfx('launch');
          }
        }

        // Server says the turn moved on. This is the ONLY thing that advances
        // the active player online — local nextTurn() never picks the next
        // shooter, or four clients would each pick their own.
        applyTurnSync(msg) {
          if (!this.roster) return;
          this.turnNumber = msg.turnNumber;
          this.activeShotId = null;
          this.reportedShotId = null;
          this.setActiveSlot(msg.activeSlot);
          this.raiseShieldForActivePlayer();
          this.updateHUD();
        }

        // A player dropped. Their tank stays on the field as a hulk (the server
        // keeps the slot so they can rejoin); we only refresh the HUD.
        applyPlayerLeft(msg) {
          if (!this.roster) return;
          const tank = this.roster.find(t => t.slot === msg.slot);
          if (tank) tank.connected = false;
          this.updateHUD();
        }

        // Server-declared end of round. Payouts are computed locally from the
        // locally-simulated damage numbers, which agree because the simulation
        // agrees.
        applyRoundEnd(msg) {
          this.serverWinnerSlot = msg ? msg.winnerSlot : undefined;
          // The local sim usually reaches "one tank left" a tick before the
          // server frame lands, which already ran the payouts and set
          // roundOver. Only run them if it has not.
          if (!this.roundOver) {
            this.handleRoundEnd();
          }
          this.roundOver = true;

          // Rounds won is the server's number, not ours — it is the only
          // match-level score neither client computes locally.
          if (msg && Array.isArray(msg.scores)) {
            this.standings = msg.scores;
            this.standings.forEach(s => {
              const tank = this.roster && this.roster.find(t => t.slot === s.slot);
              if (tank) tank.roundsWon = s.roundsWon || 0;
            });
          }
          if (msg && Number.isFinite(msg.totalRounds)) this.rounds = msg.totalRounds;
          if (msg && Number.isFinite(msg.round)) this.currentRound = msg.round;

          // A server that never sends matchOver only knows the old
          // single-round flow, so treat a missing field as "match is over"
          // rather than parking the player in a shop nothing will close.
          const matchOver = !msg || msg.matchOver === undefined ? true : msg.matchOver;
          this.matchOver = matchOver;

          if (this.headless) return;
          if (matchOver) {
            this.showMatchSummary();
          } else {
            this.showOnlineIntermission();
          }
        }

        // Online intermission: standings, then this client's own shop. Unlike
        // the local hot-seat shop this is NOT sequential — every client shops
        // for its own player at the same time, and the server starts the next
        // round once each of them has sent SHOP_DONE.
        showOnlineIntermission() {
          if (this.headless) return;
          const myIdx = this.roster ? this.roster.findIndex(t => t.slot === this.mySlot) : -1;
          if (myIdx === -1) {
            // A spectator, or a slot we never learned. Nothing to buy, but the
            // server still counts us, so report in immediately.
            this.sendShopDone();
            this.showWaitingForPlayers();
            return;
          }
          this.showShopForPlayer(myIdx, {
            standings: this.standings,
            onDone: () => {
              this.sendShopDone();
              this.showWaitingForPlayers();
            }
          });
        }

        sendShopDone() {
          if (this.shopDoneSentForRound === this.currentRound) return;
          this.shopDoneSentForRound = this.currentRound;
          if (this.net) this.net.send('SHOP_DONE', {});
        }

        showWaitingForPlayers() {
          if (this.headless || typeof document === 'undefined') return;
          const shopEl = document.getElementById('shop');
          if (!shopEl) return;
          shopEl.hidden = false;
          shopEl.innerHTML = '';

          const box = document.createElement('div');
          box.style.background = '#181818';
          box.style.border = '3px double #00ff00';
          box.style.padding = '30px';
          box.style.maxWidth = '500px';
          box.style.margin = '80px auto';
          box.style.textAlign = 'center';
          box.style.color = '#00ff00';
          box.style.letterSpacing = '2px';
          box.textContent = 'WAITING FOR OTHER PLAYERS…';
          shopEl.appendChild(box);
        }

        // Round 2+ of an online match. Deliberately NOT start(): start()
        // rebuilds the roster from the server's tank list, which would reset
        // cash and inventory to the starting values every round and wipe the
        // progression the shop just bought.
        applyServerRoundStart(msg) {
          this.currentRound = Number.isFinite(msg.round) ? msg.round : (this.currentRound || 1) + 1;
          if (Number.isFinite(msg.totalRounds)) this.rounds = msg.totalRounds;
          if (Array.isArray(msg.turnOrder)) this.turnOrder = msg.turnOrder.slice();
          this.matchOver = false;

          // Same call order as start(): newRound() seeds gameplayRNG from the
          // server's seed, then every tank position is drawn from that stream
          // in roster order. Any client that reorders or skips a draw here
          // builds a different world and desyncs silently.
          this.newRound(msg.seed);
          if (Number.isFinite(msg.wind)) this.wind = msg.wind;

          const N = this.roster.length;
          const zoneW = CONST.WORLD_W / N;
          const margin = 40;
          this.roster.forEach((tank, i) => {
            tank.hp = 100;
            tank.shield = null;
            tank.alive = true;
            tank.reportedDead = false;
            tank.damageDealt = 0;
            tank.kills = 0;
            this.grantRoundFuel(tank);
            const minX = zoneW * i + margin;
            const maxX = zoneW * (i + 1) - margin;
            tank.x = gameplayRNG.range(minX, maxX);
          });
          this.snapTanksToTerrain();

          this.activeShotId = null;
          this.reportedShotId = null;
          this.projectile = null;
          this.roundOver = false;
          // The server sends a TURN_SYNC right behind this to place the real
          // cursor; turnOrder[0] is only the placeholder until it lands.
          this.activePlayerIdx = 0;
          if (this.turnOrder && this.turnOrder.length) {
            this.setActiveSlot(this.turnOrder[0]);
          }
          this.raiseShieldForActivePlayer();

          if (!this.headless && typeof document !== 'undefined') {
            const shopEl = document.getElementById('shop');
            if (shopEl) shopEl.hidden = true;
            this.updateHUD();
          }
        }

        setActiveSlot(slot) {
          if (!this.roster) return;
          const idx = this.roster.findIndex(t => t.slot === slot);
          if (idx === -1) return;
          this.activePlayerIdx = idx;
        }

        // Online, a resolved shot is reported to the server rather than
        // advancing the turn locally. Fires at most once per shotId: the
        // physics loop reaches "no projectiles left" from several branches.
        reportShotResolved() {
          const shotId = this.activeShotId;
          if (shotId === undefined || shotId === null) return;
          if (this.reportedShotId === shotId) return;
          this.reportedShotId = shotId;

          const eliminated = [];
          if (this.roster) {
            this.roster.forEach((t) => {
              if (t.hp <= 0 && !t.reportedDead && Number.isInteger(t.slot)) {
                t.reportedDead = true;
                eliminated.push(t.slot);
              }
            });
          }

          if (this.net) {
            this.net.send('RESOLVE_SHOT', { shotId, eliminated });
          }
        }

        cycleWeapon(dir) {
          if (!this.roster || this.activePlayerIdx === undefined) return;
          const activeTank = this.roster[this.activePlayerIdx];
          if (!activeTank) return;

          const weapons = Object.keys(activeTank.inventory);
          if (weapons.length <= 1) return;

          let idx = weapons.indexOf(activeTank.selectedWeapon);
          idx = (idx + dir + weapons.length) % weapons.length;
          activeTank.selectedWeapon = weapons[idx];
          this.updateHUD();
        }

        newRound(roundSeed) {
          this.seed = roundSeed;
          this.roundOver = false;
          this.terrain.generate(roundSeed);
          gameplayRNG.seed(roundSeed);
          this.persistentTracers = [];
          // Regenerate wind: signed horizontal acceleration, let's say between -150 and 150
          this.wind = gameplayRNG.range(-150, 150);

          if (!this.headless) {
            if (this.particlePool) {
              this.particlePool.forEach(p => { p.active = false; });
            }
            if (this.explosions) {
              this.explosions.length = 0;
            }
            this.damageNumbers = [];
          }
        }

        snapTanksToTerrain() {
          if (!this.roster) return;
          this.roster.forEach(tank => {
            tank.y = CONST.WORLD_H - this.terrain.heightAt(tank.x);
          });
        }

        // Every round starts with at least a tank of fuel so repositioning is
        // never gated behind a shop visit; anything bought on top carries.
        grantRoundFuel(tank) {
          const held = tank.inventory['Fuel'] || 0;
          tank.inventory['Fuel'] = Math.max(held, CONST.FUEL_PER_ROUND);
        }

        /**
         * Drive a tank horizontally. Deterministic by construction: terrain
         * heights and arithmetic only, no RNG, so every client that applies the
         * same MOVE_SYNC lands on the same pixel.
         *
         * Fuel is deliberately NOT a precondition here. Online, a client only
         * knows its own inventory — every remote tank's Fuel entry is undefined
         * on this machine — so gating the movement on fuel would stop remote
         * tanks moving on every screen but their owner's, which is a desync.
         * The fuel check belongs at the input site, before the MOVE is sent;
         * this function only spends what it can see.
         */
        driveTank(tank, dir, steps) {
          if (!tank || tank.hp <= 0) return 0;
          const minX = CONST.TANK_MARGIN;
          const maxX = CONST.WORLD_W - CONST.TANK_MARGIN;

          let taken = 0;
          for (let i = 0; i < steps; i++) {
            const nextX = tank.x + dir * CONST.DRIVE_STEP;
            if (nextX < minX || nextX > maxX) break;

            const currentHeight = this.terrain.heightAt(tank.x);
            const nextHeight = this.terrain.heightAt(nextX);
            // Uphill only to a point. Downhill of any depth is fine — the tank
            // settles onto the new column rather than toppling, which keeps
            // this independent of the falling/parachute physics.
            if (nextHeight - currentHeight > CONST.MAX_CLIMB) break;

            tank.x = nextX;
            tank.y = CONST.WORLD_H - nextHeight;
            taken++;
          }

          if (taken > 0 && typeof tank.inventory['Fuel'] === 'number') {
            tank.inventory['Fuel'] = Math.max(0, tank.inventory['Fuel'] - taken);
          }
          return taken;
        }

        teleportTank(tank, x) {
          if (!tank || tank.hp <= 0) return false;
          const clamped = Math.min(
            CONST.WORLD_W - CONST.TANK_MARGIN,
            Math.max(CONST.TANK_MARGIN, x)
          );
          tank.x = clamped;
          tank.y = CONST.WORLD_H - this.terrain.heightAt(clamped);
          return true;
        }

        // Driving and teleporting are INPUTS, handled exactly like FIRE:
        // online they are sent and nothing is applied locally, so the move
        // lands on every client at the same point in the message order.
        requestDrive(dir) {
          if (!this.roster || this.activePlayerIdx === undefined) return;
          const tank = this.roster[this.activePlayerIdx];
          if (!tank || tank.hp <= 0 || this.projectile) return;
          if ((tank.inventory['Fuel'] || 0) <= 0) return;

          if (this.mode === 'online') {
            if (tank.slot !== this.mySlot) return;
            if (this.activeShotId) return;
            if (this.net) this.net.send('MOVE', { dir, steps: 1 });
            return;
          }

          this.driveTank(tank, dir, 1);
          if (!this.headless) this.updateHUD();
        }

        requestTeleport() {
          if (!this.roster || this.activePlayerIdx === undefined) return;
          const tank = this.roster[this.activePlayerIdx];
          if (!tank || tank.hp <= 0 || this.projectile) return;
          if ((tank.inventory['Teleport'] || 0) <= 0) return;

          if (this.mode === 'online') {
            if (tank.slot !== this.mySlot) return;
            if (this.activeShotId) return;
            if (this.net) this.net.send('TELEPORT', {});
            return;
          }

          // Local play is the only simulation there is, so the shared gameplay
          // stream is a safe source for the destination.
          const x = gameplayRNG.range(CONST.TANK_MARGIN, CONST.WORLD_W - CONST.TANK_MARGIN);
          this.teleportTank(tank, x);
          tank.inventory['Teleport'] = Math.max(0, (tank.inventory['Teleport'] || 0) - 1);
          if (!this.headless) this.updateHUD();
        }

        applyMoveSync(msg) {
          if (!this.roster || !msg) return;
          const tank = this.roster.find(t => t.slot === msg.slot);
          if (!tank) return;
          this.driveTank(tank, msg.dir, msg.steps);
          if (!this.headless) this.updateHUD();
        }

        applyTeleportSync(msg) {
          if (!this.roster || !msg) return;
          const tank = this.roster.find(t => t.slot === msg.slot);
          if (!tank) return;
          this.teleportTank(tank, msg.x);
          // Only the owning client tracks a Teleport count; on every other
          // client the entry is undefined and there is nothing to spend.
          if (typeof tank.inventory['Teleport'] === 'number') {
            tank.inventory['Teleport'] = Math.max(0, tank.inventory['Teleport'] - 1);
          }
          if (!this.headless) this.updateHUD();
        }

        updateHUD() {
          if (this.headless) return;
          const hud = document.getElementById('hud');
          if (!hud) return;

          if (!this.roster || this.activePlayerIdx === undefined) {
            hud.textContent = 'No active player';
            return;
          }

          const activeTank = this.roster[this.activePlayerIdx];
          if (!activeTank) {
            hud.textContent = 'No active player';
            return;
          }
