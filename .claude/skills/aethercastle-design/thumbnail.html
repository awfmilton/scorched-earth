<!doctype html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;height:100%}body{width:1280px;height:854px;display:flex;overflow:hidden}
.main{flex:0 0 75%;background:var(--magenta-600);display:grid;place-items:center}
.mark{font-family:var(--font-display);font-size:150px;line-height:1;color:var(--parchment-100);text-shadow:0 0 26px rgba(75,0,130,.75);white-space:nowrap}
.strip{flex:1;display:flex;flex-direction:column}.strip span{flex:1}</style></head>
<body><div class="main"><div class="mark">Æthercastle</div></div>
<div class="strip"><span style="background:var(--cyan-500)"></span><span style="background:var(--brass-500)"></span><span style="background:var(--violet-700)"></span></div>
</body></html>
