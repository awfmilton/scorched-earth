<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-world);display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.s{height:96px;border:1px solid var(--brass-700);border-radius:var(--radius-plate);display:flex;flex-direction:column;justify-content:flex-end;padding:8px}
.n{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase}.h{font:var(--type-readout-sm)}</style></head><body>
<div class="s" style="background:var(--stone-600)"><span class="n" style="color:var(--parchment-100)">Stone Gray</span><span class="h" style="color:var(--parchment-300)">#4A413C</span></div>
<div class="s" style="background:var(--magenta-600)"><span class="n" style="color:var(--parchment-100)">Electric Magenta</span><span class="h" style="color:var(--magenta-400)">#D5007F</span></div>
<div class="s" style="background:var(--violet-700)"><span class="n" style="color:var(--parchment-100)">Deep Violet</span><span class="h" style="color:var(--violet-500)">#4B0082</span></div>
<div class="s" style="background:var(--cyan-500)"><span class="n" style="color:var(--void-900)">Cyan Neon</span><span class="h" style="color:var(--void-800)">#00BFFF</span></div>
<div class="s" style="background:var(--brass-500)"><span class="n" style="color:var(--void-900)">Brass</span><span class="h" style="color:var(--void-800)">#B5A642</span></div>
</body></html>
