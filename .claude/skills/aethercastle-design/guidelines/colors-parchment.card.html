<!-- @dsCard group="Colors" viewport="700x150" name="Parchment &amp; brass" subtitle="Reading surfaces and gilded trim" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-world);font:var(--type-readout-sm)}
.r{display:grid;grid-template-columns:repeat(5,1fr);gap:6px;margin-bottom:10px}
.c{height:44px;border:1px solid rgba(8,7,10,.35);border-radius:2px;display:flex;align-items:flex-end;padding:4px;color:var(--void-900)}</style></head><body>
<div class="r">
<div class="c" style="background:var(--parchment-100)">100</div><div class="c" style="background:var(--parchment-200)">200</div><div class="c" style="background:var(--parchment-300)">300</div><div class="c" style="background:var(--parchment-400)">400</div><div class="c" style="background:var(--parchment-rule);color:var(--parchment-100)">rule</div></div>
<div class="r">
<div class="c" style="background:var(--brass-200)">200</div><div class="c" style="background:var(--brass-300)">300</div><div class="c" style="background:var(--brass-500)">500</div><div class="c" style="background:var(--brass-600);color:var(--parchment-100)">600</div><div class="c" style="background:var(--brass-700);color:var(--parchment-100)">700</div></div>
<div style="color:var(--brass-400)">Ink on parchment is --text-on-parchment #2B2115; rules are --border-rule-ink. Brass 500 is the standard 2px frame.</div>
</body></html>
