<!-- @dsCard group="Colors" viewport="700x130" name="Tier ladder" subtitle="T1 brass → T2 clockwork → T3 aether → T4 void" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-world);display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.t{border:2px solid;border-radius:var(--radius-plate);background:var(--plate);padding:10px;display:flex;flex-direction:column;gap:4px}
.k{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase}.v{font:var(--type-readout-sm);color:var(--stone-300)}</style></head><body>
<div class="t" style="border-color:var(--tier-1)"><span class="k" style="color:var(--tier-1)">T1 · Brass</span><span class="v">Steam Mortar, Dirt Clod</span></div>
<div class="t" style="border-color:var(--tier-2);box-shadow:0 0 12px -4px var(--tier-2)"><span class="k" style="color:var(--tier-2)">T2 · Clockwork</span><span class="v">Tesla Cores, Acid Rounds</span></div>
<div class="t" style="border-color:var(--tier-3);box-shadow:0 0 14px -3px var(--tier-3)"><span class="k" style="color:var(--tier-3)">T3 · Aether</span><span class="v">Aether-Strike, Hot Napalm</span></div>
<div class="t" style="border-color:var(--tier-4);box-shadow:0 0 16px -2px var(--tier-4)"><span class="k" style="color:var(--tier-4)">T4 · Void</span><span class="v">Void Bomb, Aether-Nuke</span></div>
</body></html>
