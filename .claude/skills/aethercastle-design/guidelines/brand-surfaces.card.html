<!-- @dsCard group="Brand" viewport="700x170" name="Two surfaces" subtitle="Riveted plate for chrome, parchment for reading" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-world);display:grid;grid-template-columns:1fr 1fr;gap:14px}
.plate{background-image:var(--scanline),var(--plate);border:var(--border-brass-frame);border-radius:var(--radius-plate);box-shadow:var(--shadow-panel),var(--bevel-raised);padding:14px;color:var(--text-on-plate)}
.sheet{background:var(--parchment);border:2px solid var(--brass-600);border-radius:var(--radius-sheet);box-shadow:var(--shadow-sheet);padding:14px;color:var(--text-on-parchment)}
h3{margin:0 0 6px;font:var(--type-banner);letter-spacing:var(--tracking-banner);font-size:var(--text-sm)}p{margin:0;font:var(--type-body-sm)}</style></head><body>
<div class="plate"><h3 style="color:var(--parchment-100)">Plate</h3><p style="color:var(--text-on-plate-muted)">HUD, lobby, settings, anything mechanical. 2px brass frame, raised bevel, faint scanline.</p></div>
<div class="sheet"><h3>Parchment</h3><p>Armory catalogues, briefs, rules — anything read at length. Ink rules instead of etched hairlines.</p></div>
</body></html>
