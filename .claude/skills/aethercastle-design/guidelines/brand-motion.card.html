<!-- @dsCard group="Brand" viewport="700x150" name="Motion" subtitle="Mechanical easing; aether pulses; no bounce, ever" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-world);font:var(--type-readout-sm);color:var(--stone-400);display:flex;flex-direction:column;gap:10px}
.track{height:14px;background:var(--surface-inset);border:1px solid var(--brass-700);position:relative;overflow:hidden}
.dot{position:absolute;top:2px;height:8px;width:26px;background:var(--cyan-500);box-shadow:var(--glow-cyan)}
.a{animation:slide 1.8s var(--ease-mech) infinite alternate}.b{animation:slide 1.8s var(--ease-ratchet) infinite alternate;background:var(--magenta-500);box-shadow:var(--glow-magenta)}
.c{animation:slide 1.8s var(--ease-fall) infinite alternate;background:var(--brass-400);box-shadow:none}
@keyframes slide{from{left:2px}to{left:calc(100% - 28px)}}</style></head><body>
<div>--ease-mech · default UI<div class="track"><span class="dot a"></span></div></div>
<div>--ease-ratchet · turn handoff, toggles<div class="track"><span class="dot b"></span></div></div>
<div>--ease-fall · terrain collapse, drops<div class="track"><span class="dot c"></span></div></div>
<div>90 / 140 / 220 / 380 / 620ms · press = translateY(1px) + inset bevel · hover = brightness(1.1) + variant glow</div>
</body></html>
