<!-- @dsCard group="Brand" viewport="700x160" name="Bevels, shadows, glows" subtitle="Metal is beveled; aether glows; nothing else casts light" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-world);display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font:var(--type-readout-sm);color:var(--stone-400)}
.d{height:56px;background:var(--plate);border:1px solid var(--brass-600);border-radius:var(--radius-plate);margin-bottom:6px}</style></head><body>
<div><div class="d" style="box-shadow:var(--bevel-raised)"></div>--bevel-raised</div>
<div><div class="d" style="box-shadow:var(--bevel-inset);background:var(--surface-inset)"></div>--bevel-inset</div>
<div><div class="d" style="box-shadow:var(--shadow-panel)"></div>--shadow-panel</div>
<div><div class="d" style="box-shadow:var(--glow-magenta);border-color:var(--magenta-500)"></div>--glow-magenta</div>
</body></html>
