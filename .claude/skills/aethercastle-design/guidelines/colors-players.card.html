<!-- @dsCard group="Colors" viewport="700x130" name="Player identity" subtitle="Four seats, hue-separated for colourblind safety" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-world);display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.p{background:var(--plate);border-left:4px solid;border:1px solid var(--stone-600);border-left-width:4px;padding:10px 12px}
.n{font:var(--type-banner);letter-spacing:var(--tracking-banner);font-size:var(--text-sm)}.h{font:var(--type-readout-sm);color:var(--stone-300)}</style></head><body>
<div class="p" style="border-left-color:var(--player-1)"><div class="n" style="color:var(--player-1)">Seat 1</div><div class="h">--player-1 #FF2D9B</div></div>
<div class="p" style="border-left-color:var(--player-2)"><div class="n" style="color:var(--player-2)">Seat 2</div><div class="h">--player-2 #00BFFF</div></div>
<div class="p" style="border-left-color:var(--player-3)"><div class="n" style="color:var(--player-3)">Seat 3</div><div class="h">--player-3 #E0C862</div></div>
<div class="p" style="border-left-color:var(--player-4)"><div class="n" style="color:var(--player-4)">Seat 4</div><div class="h">--player-4 #9B5DE0</div></div>
</body></html>
