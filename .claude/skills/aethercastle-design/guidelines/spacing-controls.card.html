<!-- @dsCard group="Spacing" viewport="700x150" name="Control heights" subtitle="30 / 40 / 52 — rows and slots never below 44" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-world);display:flex;flex-direction:column;gap:8px;font:var(--type-readout-sm);color:var(--stone-300)}
.r{display:flex;align-items:center;gap:12px}.box{background:var(--plate);border:1px solid var(--brass-600);border-radius:var(--radius-plate);width:180px}</style></head><body>
<div class="r"><span class="box" style="height:var(--control-height-sm)"></span>--control-height-sm 30px · dense shop actions</div>
<div class="r"><span class="box" style="height:var(--control-height)"></span>--control-height 40px · default input, select, button</div>
<div class="r"><span class="box" style="height:var(--row-height)"></span>--row-height 44px · shop + standings rows (touch min)</div>
<div class="r"><span class="box" style="height:var(--hud-height)"></span>--hud-height 56px · battle strip; --slot-height 76px lobby seat</div>
</body></html>
