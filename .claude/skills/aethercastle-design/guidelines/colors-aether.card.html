<!-- @dsCard group="Colors" viewport="700x160" name="Aether neon" subtitle="Magenta, violet, cyan — the only light in the system" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-world);font:var(--type-readout-sm);color:var(--stone-300)}
.r{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:8px}
.c{height:40px;border-radius:2px;display:flex;align-items:center;justify-content:center;color:var(--void-900);font:var(--type-readout-sm)}
.glow{margin-top:14px;display:flex;gap:18px;align-items:center}</style></head><body>
<div class="r"><div class="c" style="background:var(--magenta-700);color:var(--parchment-100)">700</div><div class="c" style="background:var(--magenta-600);color:var(--parchment-100)">600 · #D5007F</div><div class="c" style="background:var(--magenta-500)">500</div><div class="c" style="background:var(--magenta-400)">400</div></div>
<div class="r"><div class="c" style="background:var(--violet-800);color:var(--parchment-100)">800</div><div class="c" style="background:var(--violet-700);color:var(--parchment-100)">700 · #4B0082</div><div class="c" style="background:var(--violet-600);color:var(--parchment-100)">600</div><div class="c" style="background:var(--violet-500)">500</div></div>
<div class="r"><div class="c" style="background:var(--cyan-700);color:var(--parchment-100)">700</div><div class="c" style="background:var(--cyan-600)">600</div><div class="c" style="background:var(--cyan-500)">500 · #00BFFF</div><div class="c" style="background:var(--cyan-400)">400</div></div>
<div class="glow"><span style="box-shadow:var(--glow-magenta);background:var(--magenta-600);width:80px;height:16px"></span><span style="box-shadow:var(--glow-cyan);background:var(--cyan-500);width:80px;height:16px"></span><span style="box-shadow:var(--glow-violet);background:var(--violet-600);width:80px;height:16px"></span><span>--glow-magenta / --glow-cyan / --glow-violet</span></div>
</body></html>
