<!-- @dsCard group="Colors" viewport="700x160" name="Biome terrain ramps" subtitle="Sky → crust → core per seeded biome" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:14px;background:var(--surface-world);display:grid;grid-template-columns:repeat(4,1fr);gap:10px;font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase}
.b{border:1px solid var(--brass-700);border-radius:2px;overflow:hidden}.sky{height:44px}.crust{height:14px}.core{height:38px}
.cap{padding:6px 8px;color:var(--brass-300);background:var(--void-800)}</style></head><body>
<div class="b"><div class="sky" style="background:linear-gradient(180deg,var(--biome-mountains-sky),#334d66)"></div><div class="crust" style="background:var(--biome-mountains-crust)"></div><div class="core" style="background:var(--biome-mountains-core)"></div><div class="cap">Mountains</div></div>
<div class="b"><div class="sky" style="background:linear-gradient(180deg,var(--biome-plains-sky),#004411)"></div><div class="crust" style="background:var(--biome-plains-crust)"></div><div class="core" style="background:var(--biome-plains-core)"></div><div class="cap">Plains</div></div>
<div class="b"><div class="sky" style="background:linear-gradient(180deg,var(--biome-plateau-sky),#663300)"></div><div class="crust" style="background:var(--biome-plateau-crust)"></div><div class="core" style="background:var(--biome-plateau-core)"></div><div class="cap">Plateau</div></div>
<div class="b"><div class="sky" style="background:linear-gradient(180deg,var(--biome-hills-sky),#1b1b3a)"></div><div class="crust" style="background:var(--biome-hills-crust)"></div><div class="core" style="background:var(--biome-hills-core)"></div><div class="cap">Hills</div></div>
</body></html>
