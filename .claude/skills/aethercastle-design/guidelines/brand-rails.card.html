<!-- @dsCard group="Brand" viewport="700x120" name="Aether rails" subtitle="The magenta→violet→cyan conduit that frames every section" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:20px 16px;background:var(--surface-world);display:flex;flex-direction:column;gap:16px}
.row{display:flex;align-items:center;gap:12px}
.rail{height:2px;flex:1}.plate{font:var(--type-banner);letter-spacing:var(--tracking-banner);text-transform:uppercase;color:var(--parchment-100);background:var(--banner-fill);border:1px solid var(--brass-600);border-radius:2px;padding:5px 18px;white-space:nowrap;font-size:var(--text-sm)}</style></head><body>
<div class="row"><span class="rail" style="background:linear-gradient(90deg,transparent,var(--magenta-600));box-shadow:var(--glow-magenta)"></span><span class="plate">Expanded Arsenal</span><span class="rail" style="background:linear-gradient(270deg,transparent,var(--cyan-500));box-shadow:var(--glow-cyan)"></span></div>
<div class="row"><span class="rail" style="background:var(--aether-rail);box-shadow:var(--glow-violet)"></span></div>
</body></html>
