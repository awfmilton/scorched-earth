<!-- @dsCard group="Type" viewport="700x150" name="Readouts — Share Tech Mono" subtitle="Every number the player reads is tabular mono" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-world);display:flex;gap:22px;align-items:flex-end;flex-wrap:wrap}
.cell{display:flex;flex-direction:column;gap:2px}.k{font:var(--type-label);letter-spacing:var(--tracking-label);text-transform:uppercase;color:var(--brass-400)}
.v{font:var(--type-readout);letter-spacing:var(--tracking-numeric);font-variant-numeric:tabular-nums;color:var(--cyan-400)}
.lg{font:var(--type-readout-lg);color:var(--cyan-400);text-shadow:var(--glow-text-cyan)}
.m{font:var(--type-readout-sm);color:var(--stone-400);width:100%}</style></head><body>
<div class="cell"><span class="k">Angle</span><span class="v">45°</span></div>
<div class="cell"><span class="k">Power</span><span class="v">500</span></div>
<div class="cell"><span class="k">Cash</span><span class="v" style="color:var(--cash)">$10,000</span></div>
<div class="cell"><span class="k">Share code</span><span class="lg" style="letter-spacing:.32em">VLTK</span></div>
<div class="m">--type-readout 18px · --type-readout-lg 36px (codes, timers) · --type-readout-sm 12px · tabular-nums always on</div>
</body></html>
