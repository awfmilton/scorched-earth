<!-- @dsCard group="Brand" viewport="700x150" name="Borders &amp; radii" subtitle="Square by default; 2px is the largest radius on metal" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-world);display:grid;grid-template-columns:repeat(5,1fr);gap:12px;font:var(--type-readout-sm);color:var(--stone-400)}
.d{height:48px;background:var(--plate);margin-bottom:6px}</style></head><body>
<div><div class="d" style="border:var(--border-hair) solid var(--border-etch)"></div>1px etch</div>
<div><div class="d" style="border:var(--border-brass-frame)"></div>2px brass</div>
<div><div class="d" style="border:var(--border-brass-double)"></div>3px double (modals)</div>
<div><div class="d" style="border:var(--border-dashed-etch)"></div>dashed (empty seat)</div>
<div><div class="d" style="border:var(--border-brass-frame);border-radius:var(--radius-pill);background:var(--void-800)"></div>pill (ammo, chips)</div>
</body></html>
