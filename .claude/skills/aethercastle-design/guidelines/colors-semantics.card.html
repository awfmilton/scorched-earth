<!-- @dsCard group="Colors" viewport="700x140" name="Match semantics" subtitle="Hull, shield, damage, heal, cash, wind" -->
<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>body{margin:0;padding:16px;background:var(--surface-world);display:grid;grid-template-columns:repeat(4,1fr);gap:12px;font:var(--type-readout-sm);color:var(--stone-300)}
.i{display:flex;align-items:center;gap:8px}.d{width:18px;height:18px;border:1px solid rgba(8,7,10,.6)}</style></head><body>
<div class="i"><span class="d" style="background:var(--hp-full)"></span>hull &gt;60% --hp-full</div>
<div class="i"><span class="d" style="background:var(--hp-mid)"></span>hull &gt;30% --hp-mid</div>
<div class="i"><span class="d" style="background:var(--hp-low)"></span>hull low --hp-low</div>
<div class="i"><span class="d" style="background:var(--shield-charge);box-shadow:var(--glow-cyan)"></span>--shield-charge</div>
<div class="i"><span class="d" style="background:var(--damage)"></span>--damage</div>
<div class="i"><span class="d" style="background:var(--heal)"></span>--heal</div>
<div class="i"><span class="d" style="background:var(--cash)"></span>--cash</div>
<div class="i"><span class="d" style="background:var(--wind-marker)"></span>--wind-marker</div>
</body></html>
